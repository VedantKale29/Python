   code: "from itertools import tee\n\ndef source():\n    for i in range(5):\n        yield {\"id\": f\"t{i}\", \"amount\": i * 100.0}\n\na, b = tee(source())\ntotal = sum(r[\"amount\"] for r in a)\ncount = sum(1 for r in b)\n\nprint(f\"total={total} count={count} mean={total/count}\")\nprint()\nprint(\"tee buffers what the slower branch has not consumed —\")\nprint(\"on a large source that buffer is the memory you were avoiding\")",
   note: '`tee` looks like free re-iteration and is not: it caches every element the lagging iterator has not yet seen. For two aggregates over a large source, a single pass computing both is better.' }
],
body: [
 { h: 'The ones worth memorising', html:
   '<table><thead><tr><th>Function</th><th>Does</th></tr></thead><tbody><tr><td><code>islice(it, n)</code></td><td>First n, lazily — bounds an infinite source</td></tr><tr><td><code>chain(a, b)</code></td><td>Concatenate iterables without building a list</td></tr><tr><td><code>accumulate(it)</code></td><td>Running totals, or any two-arg function</td></tr><tr><td><code>groupby(it, key)</code></td><td>Group <b>consecutive</b> runs — sort first</td></tr><tr><td><code>takewhile</code> / <code>dropwhile</code></td><td>Stop or start at the first boundary</td></tr><tr><td><code>zip_longest</code></td><td>zip without silent truncation</td></tr><tr><td><code>tee</code></td><td>Two iterators from one — at a memory cost</td></tr><tr><td><code>combinations</code> / <code>product</code></td><td>Pairs and cartesian products</td></tr></tbody></table>' },
 { h: 'The two traps', html:
   '<ol><li><strong><code>groupby</code> is not SQL GROUP BY.</strong> It groups consecutive runs only. On unsorted input you get a key back several times, and a naive count is wrong.</li><li><strong><code>zip</code> truncates to the shortest input</strong> with no error. If equal length is a requirement, assert it — in Python 3.10+ <code>zip(..., strict=True)</code> raises instead.</li></ol>' },
 { h: 'When a plain loop is better', html:
   '<p>If the itertools version needs a lambda and a comment to be readable, write the loop. The point of these is streaming and clarity together — a clever one-liner that nobody can modify is a worse outcome than four obvious lines.</p>' }
],
call: '"itertools keeps a chain lazy, so memory stays flat regardless of input size — islice bounds an infinite source and chain concatenates without building a list. The two traps are that groupby only groups consecutive runs, so it needs sorted input, and that zip truncates to the shortest sequence silently."',
warn: '`zip` stops at the shortest input and reports nothing. Two sequences that should be parallel but differ by one row produce a result quietly missing the tail — use `zip_longest`, or assert the lengths match.',
qf: [
 ['What does islice do that slicing cannot?', 'Works on any iterator, including infinite ones, without materialising.'],
 ['Why does groupby need sorted input?', 'It groups only consecutive runs, so unsorted input yields the same key several times.'],
 ['What does zip do with unequal lengths?', 'Truncates to the shortest, silently.'],
 ['takewhile versus filter?', 'takewhile stops at the first failure; filter examines every element.'],
 ['What does accumulate produce?', 'A running total, or a running result of any two-argument function.'],
 ['What is the hidden cost of tee?', 'It buffers everything the lagging iterator has not consumed.'],
 ['When should you write a plain loop instead?', 'When the itertools version needs a lambda and a comment to be readable.']
]});

M.push({
code: 'Y1', track: 'Tier 10 · Performance and internals',
title: 'Measure before you optimise',
sub: 'Timing, counting operations, and the discipline of changing one thing.',
lede: 'Optimising without measuring is guessing, and Python programmers guess wrong reliably — the slow line is almost never the one that looks slow. The habit is: measure, find the dominant cost, change one thing, measure again.',
ex: [
 { t: 'Count the work, not the wall clock',
   code: "def naive(rows, keys):\n    ops = 0\n    out = []\n    for k in keys:\n        for r in rows:            # rescans the whole list per key\n            ops += 1\n            if r[\"k\"] == k:\n                out.append(r)\n    return out, ops\n\ndef indexed(rows, keys):\n    ops = 0\n    index = {}\n    for r in rows:\n        ops += 1\n        index.setdefault(r[\"k\"], []).append(r)\n    out = []\n    for k in keys:\n        ops += 1\n        out.extend(index.get(k, []))\n    return out, ops\n\nrows = [{\"k\": f\"k{i%10}\"} for i in range(100)]\nkeys = [f\"k{i}\" for i in range(10)]\n\n_, a = naive(rows, keys)\n_, b = indexed(rows, keys)\nprint(f\"naive:   {a:>5} operations\")\nprint(f\"indexed: {b:>5} operations\")\nprint(f\"ratio:   {a/b:.1f}x\")",
   note: 'Counting operations is more honest than timing on a small input, because it shows the *shape* of the cost rather than one machine on one day. 1000 versus 110 here; at 10,000 rows it is 100,000 versus 10,010.' },
 { t: 'The cost is rarely where you think',
   code: "def build_string_slow(n):\n    s = \"\"\n    for i in range(n):\n        s = s + str(i)        # builds a new string every time\n    return len(s)\n\ndef build_string_fast(n):\n    parts = []\n    for i in range(n):\n        parts.append(str(i))   # append is cheap\n    return len(\"\".join(parts))\n\nprint(\"slow result:\", build_string_slow(200))\nprint(\"fast result:\", build_string_fast(200))\nprint()\nprint(\"same answer; the first copies the whole string on every iteration\")\nprint(\"because strings are immutable — O(n^2) total work\")",
   note: 'Repeated string concatenation in a loop is quadratic because each `+` copies everything so far. `"".join(parts)` allocates once. This is the most common accidental quadratic in Python after list membership.' },
 { t: 'Membership: the single highest-value change',
   code: "def with_list(items, lookups):\n    known = list(items)\n    ops = 0\n    hits = 0\n    for x in lookups:\n        for k in known:        # what `x in known` does internally\n            ops += 1\n            if k == x:\n                hits += 1\n                break\n    return hits, ops\n\ndef with_set(items, lookups):\n    known = set(items)\n    hits = sum(1 for x in lookups if x in known)\n    return hits, len(lookups)\n\nitems = [f\"id{i}\" for i in range(200)]\nlookups = [f\"id{i}\" for i in range(0, 200, 2)]\n\nh1, o1 = with_list(items, lookups)\nh2, o2 = with_set(items, lookups)\nprint(f\"list: {h1} hits in ~{o1} comparisons\")\nprint(f\"set:  {h2} hits in ~{o2} lookups\")",
   note: 'One character of difference — `set(...)` instead of `list(...)` — turns a scan into a hash lookup. If you take one performance habit from this tier, take this one.' },
 { t: 'Change one thing at a time',
   code: "versions = {\n    \"baseline\":            {\"ops\": 10000, \"note\": \"nested loop\"},\n    \"set for membership\":  {\"ops\": 1200,  \"note\": \"one change\"},\n    \"+ avoid re-parsing\":  {\"ops\": 900,   \"note\": \"one more change\"},\n    \"+ batch the writes\":  {\"ops\": 880,   \"note\": \"diminishing\"},\n}\n\nprev = None\nfor name, v in versions.items():\n    delta = \"\" if prev is None else f\"{(1 - v['ops']/prev):.0%} faster\"\n    print(f\"{name:22} {v['ops']:>6}  {delta:>12}   {v['note']}\")\n    prev = v[\"ops\"]\n\nprint()\nprint(\"the first change did 88% of the work; the last did 2%\")\nprint(\"stop when the next change stops paying\")",
   note: 'One change per measurement is what lets you attribute the improvement. It also tells you when to stop — the last two changes here cost more code than they saved time.' }
],
body: [
 { h: 'The order', html:
   '<ol><li><strong>Is it actually slow?</strong> Slow relative to what requirement?</li><li><strong>Where?</strong> Time the stages, or count operations. Do not guess.</li><li><strong>Why?</strong> Algorithmic (the shape) or constant-factor (the work per item)?</li><li><strong>Change one thing.</strong> Re-measure.</li><li><strong>Stop</strong> when it meets the requirement.</li></ol><p>Algorithmic wins dominate. Turning O(n²) into O(n) beats every micro-optimisation combined, and no amount of tuning rescues the wrong shape.</p>' },
 { h: 'The real tools', html:
   '<div class="pre code">import timeit                 <i>micro-benchmarks, repeated</i>\nimport cProfile               <i>which function dominates</i>\ncProfile.run("main()", sort="cumtime")\n\npython -m cProfile -s cumtime job.py\npy-spy top --pid 1234         <i>sampling profiler, safe in production</i></div><p><code>cumtime</code> is the column to sort by — it includes everything a function called, which is what points at the branch of the pipeline responsible.</p>' },
 { h: 'What to suspect first in a pipeline', html:
   '<ul><li>Membership tests against a list.</li><li>Repeated string concatenation.</li><li>Re-reading or re-parsing the same data.</li><li>A round trip per row instead of per batch.</li><li>Materialising a whole file to compute one aggregate.</li></ul>' }
],
call: '"I measure before changing anything, because the slow line is almost never the one that looks slow. Algorithmic shape dominates — turning a list membership test into a set beats every micro-optimisation combined — and I change one thing per measurement so I can attribute the improvement."',
warn: 'Repeated string concatenation in a loop is quadratic, because strings are immutable and every `+` copies everything so far. It reads as the obvious way to build a string and it is the wrong one.',
qf: [
 ['What is the first question before optimising?', 'Whether it is actually too slow for the requirement.'],
 ['Why count operations rather than time on small input?', 'It shows the shape of the cost rather than one machine on one day.'],
 ['What dominates — algorithm or constant factor?', 'The algorithm. O(n²) to O(n) beats every micro-optimisation.'],
 ['Why is string concatenation in a loop slow?', 'Strings are immutable, so each + copies everything so far — quadratic overall.'],
 ['What is the highest-value single change?', 'Using a set instead of a list for membership tests.'],
 ['Why change one thing at a time?', 'Otherwise you cannot attribute the improvement or revert intelligently.']
]});

M.push({
code: 'Y2', track: 'Tier 10 · Performance and internals',
title: 'The cost of Python operations',
sub: 'What is O(1), what is O(n), and the ones that surprise people.',
lede: 'Knowing the complexity of the operations you use every day is what lets you spot a quadratic loop while writing it rather than after profiling it. Most of the table is unsurprising; four entries are not.',
ex: [
 { t: 'Membership: the difference that matters most',
   code: "items = list(range(500))\nas_set = set(items)\nas_dict = {k: True for k in items}\n\ndef scan_cost(target, seq):\n    n = 0\n    for x in seq:\n        n += 1\n        if x == target:\n            break\n    return n\n\nprint(\"list, best case (first):\", scan_cost(0, items))\nprint(\"list, worst case (last):\", scan_cost(499, items))\nprint(\"list, missing:          \", scan_cost(9999, items))\nprint()\nprint(\"set membership is one hash lookup regardless:\", 499 in as_set, 9999 in as_set)\nprint(\"dict is the same:\", 499 in as_dict)",
   note: 'A list scan costs one comparison per element until it matches — and the worst case is a miss, which examines everything. A set is one hash computation whatever the size.' },
 { t: 'Insertion and removal at the front versus the end',
   code: "from collections import deque\n\ndef list_front_cost(n):\n    xs = []\n    shifts = 0\n    for i in range(n):\n        xs.insert(0, i)      # every existing element moves right\n        shifts += len(xs) - 1\n    return shifts\n\ndef list_end_cost(n):\n    xs = []\n    for i in range(n):\n        xs.append(i)         # no shifting\n    return 0\n\nprint(\"insert(0) on 100 items shifted:\", list_front_cost(100), \"elements\")\nprint(\"append on 100 items shifted:   \", list_end_cost(100), \"elements\")\n\nd = deque()\nfor i in range(5):\n    d.appendleft(i)\nprint(\"deque appendleft is O(1):\", list(d))",
   note: '`list.insert(0, x)` and `list.pop(0)` move every remaining element. For a queue use `collections.deque`, which is O(1) at both ends. This is the second-most-common accidental quadratic.' },
 { t: 'Slicing and concatenation copy',
   code: "rows = list(range(10))\n\ns = rows[2:5]\nprint(\"slice is a new list:\", s, \" same object:\", s is rows)\n\ncombined = rows[:3] + rows[7:]\nprint(\"concatenation copies both sides:\", combined)\n\ntotal = []\nfor chunk in [[1,2],[3,4],[5,6]]:\n    total = total + chunk        # copies the accumulator every time\nprint(\"naive accumulate:\", total)\n\ntotal2 = []\nfor chunk in [[1,2],[3,4],[5,6]]:\n    total2.extend(chunk)          # amortised O(1) per item\nprint(\"extend:\", total2)",
   note: 'Both slicing and `+` allocate a new list and copy. Inside a loop that turns a linear job quadratic — use `extend` or a list comprehension, which allocate once.' },
 { t: 'sorted is O(n log n) and the key is called once per item',
   code: "calls = {\"n\": 0}\n\ndef expensive_key(row):\n    calls[\"n\"] += 1\n    return row[\"amount\"]\n\nrows = [{\"amount\": i} for i in [5, 3, 9, 1, 7]]\nresult = sorted(rows, key=expensive_key)\n\nprint(\"sorted:\", [r[\"amount\"] for r in result])\nprint(\"items:\", len(rows), \" key calls:\", calls[\"n\"])\nprint()\nprint(\"the key is computed ONCE per item, not once per comparison —\")\nprint(\"so an expensive key is affordable; an expensive __lt__ is not\")",
   note: 'This is why `sorted(key=...)` is preferred over defining `__lt__` for a one-off sort: the key is decorated once per element, whereas a comparison method runs O(n log n) times.' }
],
body: [
 { h: 'The table worth knowing', html:
   '<table><thead><tr><th>Operation</th><th>list</th><th>dict / set</th><th>deque</th></tr></thead><tbody><tr><td><code>x in c</code></td><td><b>O(n)</b></td><td>O(1)</td><td>O(n)</td></tr><tr><td>Index / key access</td><td>O(1)</td><td>O(1)</td><td>O(n) middle</td></tr><tr><td>Append / add</td><td>O(1)*</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Insert or pop at front</td><td><b>O(n)</b></td><td>n/a</td><td><b>O(1)</b></td></tr><tr><td>Pop at end</td><td>O(1)</td><td>O(1)</td><td>O(1)</td></tr><tr><td>Slice of length k</td><td>O(k)</td><td>n/a</td><td>n/a</td></tr><tr><td>Sort</td><td>O(n log n)</td><td>n/a</td><td>n/a</td></tr><tr><td>Min / max / sum</td><td>O(n)</td><td>O(n)</td><td>O(n)</td></tr></tbody></table><p class="snote">* amortised — an occasional resize copies, but averaged over many appends it is constant.</p>' },
 { h: 'The four that surprise people', html:
   '<ol><li><strong><code>x in list</code> is O(n).</strong> Inside a loop over n items, that is n².</li><li><strong><code>list.insert(0, x)</code> and <code>pop(0)</code> are O(n).</strong> Use a deque.</li><li><strong>String <code>+</code> in a loop is quadratic.</strong> Use join.</li><li><strong>Slicing copies.</strong> <code>rows[:]</code> is not free on a large list.</li></ol>' },
 { h: 'Memory has a shape too', html:
   '<p>A dict costs more per entry than a list, and a set more than a tuple. For a few million small records that difference is real — which is why the Tier 2 escalation ladder starts with "read fewer columns" rather than "use a faster structure".</p>' }
],

sub: 'Every attribute lives in a dict unless you say otherwise.',

MODS = ROADMAP.reduce(function(a, t){ return a.concat(t.items); }, []);

function runCode(host, meta, src){
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var res = PY.run(src);
  var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
  var out = res.output || '';
  var h = '';
  if(out) h += '<div class="pyout">' + esc(out.replace(/\n$/, '')) + '</div>';

    h += '<div class="err">' + esc(res.error) + '</div>';
    meta.className = 'meta bad';
    meta.innerHTML = '<b>' + esc(res.error.split(':')[0]) + '</b>';
  } else {
    meta.className = 'meta';

      ' \u00b7 <b>' + fmtInt(res.steps) + '</b> steps \u00b7 ' + (t1 - t0).toFixed(1) + ' ms';
  }
  if(!out && !res.error) h = '<div class="zero">ran cleanly, printed nothing</div>';
  host.innerHTML = h;
}
function fmtInt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function wireModule(m){
  (m.ex || []).forEach(function(e, i){
    if(e.ref) return;
    var id = m.code.toLowerCase() + '-e' + i;
    var box = $(id + '-code'), out = $(id + '-out'), meta = $(id + '-meta');
    if(!box) return;
    function go(){ runCode(out, meta, box.value); }
    $(id + '-run').addEventListener('click', go);
    $(id + '-rst').addEventListener('click', function(){ box.value = e.code; go(); });
    box.addEventListener('keydown', function(ev){
      if((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ ev.preventDefault(); go(); }
      if(ev.key === 'Tab'){
        ev.preventDefault();
        var a = box.selectionStart, b = box.selectionEnd;
        box.value = box.value.slice(0, a) + '    ' + box.value.slice(b);
        box.selectionStart = box.selectionEnd = a + 4;
      }
    });
    go();
  });
}


/* ---------- rail ---------- */
function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }
function buildRail(){
  var nav = $('nav'), host = $('mods');
  nav.innerHTML = '';

  ROADMAP.forEach(function(t){
    var wrap = document.createElement('div'); wrap.className = 'grp';
    wrap.innerHTML = '<div class="grp-t">' + esc(t.t) + '<u>' + t.items.length + '</u></div>';
    t.items.forEach(function(m){
      var sec = buildModule(m, mods.length);
      host.appendChild(sec);
      var idx = mods.length; mods.push(sec);
      var b = document.createElement('button');
      b.className = 'nv'; b.setAttribute('data-code', m.code);
      b.setAttribute('data-search', (m.code + ' ' + m.title + ' ' + m.sub + ' ' + t.t).toLowerCase());
      b.innerHTML = '<em>' + esc(m.code) + '</em><span>' + esc(m.title) + '</span>';
      b.addEventListener('click', function(){ go(idx); });
      wrap.appendChild(b); navBtns.push(b);
    });
    nav.appendChild(wrap);
  });

  var nEx = MODS.reduce(function(a, m){ return a + (m.ex ? m.ex.filter(function(e){ return !e.ref; }).length : 0); }, 0);
  var nQ  = MODS.reduce(function(a, m){ return a + m.qf.length; }, 0);
  $('railf').innerHTML = '<b>' + mods.length + '</b> modules · <b>' + nEx + '</b> runnable examples<br>' +
    '<b>' + nQ + '</b> quick-fire Q&amp;As<br>' +
    'plans and partitions are measured, not drawn<br>← → move · / search · t tables · d drill · e export';
}

/* ---------- router ---------- */
function buildPager(i){
  var host = mods[i], p = host.querySelector('.pager');
  if(!p){ p = document.createElement('div'); p.className = 'pager'; host.appendChild(p); }
  p.innerHTML = '';
  function mk(j, dir){
    var b = document.createElement('button');
    b.className = 'pg' + (dir === 'next' ? ' nx' : '');
    if(j < 0 || j >= mods.length){ b.disabled = true; b.innerHTML = '<span>' + dir + '</span><b>—</b>'; }
    else {
      b.innerHTML = '<span>' + dir + ' · ' + mods[j].getAttribute('data-code') + '</span><b>' +
        esc(mods[j].getAttribute('data-t')) + '</b>';
      b.addEventListener('click', function(){ go(j); });
    }
    return b;
  }
  p.appendChild(mk(i - 1, 'previous'));
  p.appendChild(mk(i + 1, 'next'));
  if(!host.querySelector('.kbd')){
    var k = document.createElement('div'); k.className = 'kbd';
    k.textContent = '← previous · next → · / search · p practice · d drill · r rates · e export';
    host.appendChild(k);
  }
}
var wired = {};
function go(i){
  if(i < 0 || i >= mods.length) return;
  cur = i;
  mods.forEach(function(m, j){ m.classList.toggle('on', j === i); });
  navBtns.forEach(function(b, j){ b.classList.toggle('on', j === i); });
  var code = mods[i].getAttribute('data-code');
  if(!wired[code]){
    wired[code] = true;
    var m = MODS.filter(function(x){ return x.code === code; })[0];
    if(m) wireModule(m);
  }
  $('topLab').textContent = mods[i].getAttribute('data-grp') || '';
  $('topN').textContent = code + ' · ' + pad2(i + 1) + ' / ' + pad2(mods.length);
  $('tape').style.width = ((i + 1) / mods.length * 100) + '%';
  $('btnDone').classList.toggle('on', !!doneSet[code]);
  buildPager(i);
  window.scrollTo(0, 0);
  railOpen(false);
  if(location.hash !== '#' + mods[i].id){
    try { history.replaceState(null, '', '#' + mods[i].id); } catch(e){ location.hash = mods[i].id; }
  }
}
function railOpen(v){
  $('rail').classList.toggle('open', v);
  $('scrim').classList.toggle('open', v);
}

/* ---------- filter ---------- */
function wireFilter(){
  var inp = $('find');
  inp.addEventListener('input', function(){
    var q = inp.value.trim().toLowerCase();
    navBtns.forEach(function(b){
      var hit = !q || (b.getAttribute('data-search') || '').indexOf(q) >= 0;
      b.classList.toggle('hide', !hit);
    });
    [].slice.call(document.querySelectorAll('.grp')).forEach(function(g){
      var any = [].slice.call(g.querySelectorAll('.nv')).some(function(b){ return !b.classList.contains('hide'); });
      g.classList.toggle('hide', !any);
    });
  });
}

/* ---------- full-text search ---------- */
var SEARCH_IDX = [];
function buildSearchIndex(){
  MODS.forEach(function(m){
    var body = m.body.map(function(b){ return (b.h || '') + ' ' + b.html.replace(/<[^>]+>/g, ' '); }).join(' ');
    var ex = (m.ex || []).map(function(e){ return e.t + ' ' + e.code + ' ' + e.note; }).join(' ');
    SEARCH_IDX.push({ code:m.code, title:m.title, track:m.track,
      text:(m.title + ' ' + m.sub + ' ' + m.lede.replace(/<[^>]+>/g,' ') + ' ' + ex + ' ' + body + ' ' +
            m.call + ' ' + (m.warn||'') + ' ' + m.qf.map(function(p){ return p[0] + ' ' + p[1]; }).join(' ')).replace(/<[^>]+>/g,' ') });
    m.qf.forEach(function(p){ SEARCH_IDX.push({ code:m.code, title:p[0], track:m.track + ' · quick-fire', text:p[0] + ' ' + p[1], qa:p }); });
  });
}
function runSearch(){
  var q = $('srIn').value.trim().toLowerCase(), box = $('srRes');
  if(q.length < 2){ box.innerHTML = '<div class="hint">Type at least two characters. Searches every module, example, query and quick-fire answer.</div>'; return; }
  var hits = [];
  SEARCH_IDX.forEach(function(e){
    var i = e.text.toLowerCase().indexOf(q);
    if(i >= 0) hits.push({ e:e, i:i, score:(e.title.toLowerCase().indexOf(q) >= 0 ? 0 : 1) });
  });
  hits.sort(function(a,b){ return a.score - b.score || a.i - b.i; });
  if(!hits.length){ box.innerHTML = '<div class="hint">No match.</div>'; return; }
  box.innerHTML = hits.slice(0, 40).map(function(h){
    var t = h.e.text, s = Math.max(0, h.i - 60), snip = t.slice(s, h.i + 120).replace(/\s+/g,' ');
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return '<button class="sr" data-code="' + h.e.code + '"><em>' + esc(h.e.track) + ' · ' + esc(h.e.code) + '</em>' +
      '<b>' + esc(h.e.title) + '</b><span>' + esc(snip).replace(re, '<mark>$1</mark>') + '…</span></button>';
  }).join('');
  [].slice.call(box.querySelectorAll('.sr')).forEach(function(b){
    b.addEventListener('click', function(){
      var code = b.getAttribute('data-code');
      for(var j = 0; j < mods.length; j++) if(mods[j].getAttribute('data-code') === code){ go(j); break; }
      ovl('srOvl', false);
    });
  });
}

/* ---------- drill ---------- */
var DRILL = [], di = 0, shown = false;
var DRILL_TRACK = '*';
function buildDrill(){
  DRILL = [];
  MODS.filter(function(m){ return DRILL_TRACK === '*' || m.track === DRILL_TRACK; })
    .forEach(function(m){ m.qf.forEach(function(p){ DRILL.push({ q:p[0], a:p[1], src:m.code + ' · ' + m.title }); }); });
  for(var i = DRILL.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = DRILL[i]; DRILL[i] = DRILL[j]; DRILL[j] = t; }
  di = 0; shown = false; renderDrill();
}
function renderDrill(){
  var c = $('drlBody');
  if(!DRILL.length){ c.innerHTML = '<div class="hint">No questions in that track.</div>'; DRILL_TRACK = '*'; return; }
  var d = DRILL[di];
  var opts = '<option value="*">All tracks</option>';
  ROADMAP.forEach(function(t){
    opts += '<option value="' + esc(t.t) + '"' + (DRILL_TRACK === t.t ? ' selected' : '') + '>' + esc(t.t) + '</option>';
  });
  c.innerHTML =
    '<div class="ex-opts"><select id="drlTrack">' + opts + '</select><span class="ex-count">' + DRILL.length + ' questions</span></div>' +
    '<div class="drl-bar"><i style="width:' + ((di + 1) / DRILL.length * 100) + '%"></i></div>' +
    '<div class="drl-src">' + esc(d.src) + ' · ' + (di + 1) + ' of ' + DRILL.length + '</div>' +
    '<div class="drl-q">' + esc(d.q) + '</div>' +
    (shown ? '<div class="drl-a">' + esc(d.a) + '</div>' : '') +
    '<div class="orow">' +
      '<button class="obtn pri" id="drlShow">' + (shown ? 'Hide answer' : 'Show answer') + '</button>' +
      '<button class="obtn" id="drlNext">Next →</button>' +
      '<button class="obtn" id="drlJump">Open module</button>' +
      '<button class="obtn" id="drlShuf">Reshuffle</button>' +
    '</div>';
  $('drlTrack').addEventListener('change', function(){ DRILL_TRACK = $('drlTrack').value; buildDrill(); });
  $('drlShow').addEventListener('click', function(){ shown = !shown; renderDrill(); });
  $('drlNext').addEventListener('click', function(){ di = (di + 1) % DRILL.length; shown = false; renderDrill(); });
  $('drlShuf').addEventListener('click', buildDrill);
  $('drlJump').addEventListener('click', function(){
    var code = d.src.split(' · ')[0];
    for(var j = 0; j < mods.length; j++) if(mods[j].getAttribute('data-code') === code){ go(j); break; }
    ovl('drlOvl', false);
  });
}


/* ============================================================
   EXPORT — three printable artefacts built from the same data
   the modules render from, so they can never drift out of sync.
   ============================================================ */
function stripTags(h){
  return String(h)
    .replace(/<code>([\s\S]*?)<\/code>/g, '`$1`')
    .replace(/<em class="hl">([\s\S]*?)<\/em>/g, '$1')
    .replace(/<\/?(b|strong)>/g, '**')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&mdash;/g, '\u2014').replace(/&nbsp;/g, ' ').replace(/&hellip;/g, '\u2026')
    .replace(/\s+/g, ' ').trim();
}
var EX_MODE = 'qf', EX_TRACK = '*';
function exModules(){
  return MODS.filter(function(m){ return EX_TRACK === '*' || m.track === EX_TRACK; });
}
function exRender(){
  var list = exModules(), body = $('exBody'), h = '', n = 0, lastTrack = null;
  list.forEach(function(m){
    if(m.track !== lastTrack){ h += '<h3>' + esc(m.track) + '</h3>'; lastTrack = m.track; }
    if(EX_MODE === 'qf'){
      h += '<h4>' + esc(m.code) + ' \u00b7 ' + esc(m.title) + '</h4>';
      m.qf.forEach(function(p){ n++;
        h += '<p class="sq">' + esc(p[0]) + '</p><p class="sa">' + esc(p[1]) + '</p>'; });
    } else if(EX_MODE === 'call'){
      n++;
      h += '<h4>' + esc(m.code) + ' \u00b7 ' + esc(m.title) + '</h4>' +
           '<blockquote>' + esc(stripTags(m.call)) + '</blockquote>';
      if(m.warn) h += '<p class="strap">' + esc(stripTags(m.warn)) + '</p>';
    } else {
      (m.ex || []).forEach(function(e, i){ n++;
        h += '<h4>' + esc(m.code) + '.' + (i+1) + ' \u00b7 ' + esc(e.t) + '</h4>' +
             '<pre>' + esc(e.code) + '</pre>' +
             '<p class="snote">' + esc(stripTags(e.note)) + '</p>'; });
    }
  });
  body.innerHTML = h || '<div class="hint">Nothing to show.</div>';
  var unit = EX_MODE === 'qf' ? ['question', 'questions']
           : (EX_MODE === 'call' ? ['interview point', 'interview points'] : ['example', 'examples']);
  $('exCount').textContent = n + ' ' + unit[n === 1 ? 0 : 1] + ' \u00b7 ' +
    list.length + ' module' + (list.length === 1 ? '' : 's');
  [].slice.call(document.querySelectorAll('.ex-tab')).forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-mode') === EX_MODE);
  });
}
function exMarkdown(){
  var list = exModules(), out = [], lastTrack = null;
  var titles = { qf:'Quick-fire sheet', call:'Interview points', sql:'Code cookbook' };
  out.push('# SQL Bench \u2014 ' + titles[EX_MODE]);
  out.push('');
  out.push('_' + (EX_TRACK === '*' ? 'All tracks' : EX_TRACK) + ' \u00b7 ' + list.length + ' modules_');
  out.push('');
  list.forEach(function(m){
    if(m.track !== lastTrack){ out.push(''); out.push('## ' + m.track); lastTrack = m.track; }
    out.push('');
    out.push('### ' + m.code + ' \u00b7 ' + m.title);
    if(EX_MODE === 'qf'){
      m.qf.forEach(function(p){ out.push(''); out.push('**Q.** ' + p[0]); out.push(''); out.push('A. ' + p[1]); });
    } else if(EX_MODE === 'call'){
      out.push('');
      out.push('> ' + stripTags(m.call));
      if(m.warn){ out.push(''); out.push('**Trap.** ' + stripTags(m.warn)); }
    } else {
      (m.ex || []).forEach(function(e, i){
        out.push('');
        out.push('**' + m.code + '.' + (i+1) + ' \u2014 ' + e.t + '**');
        out.push(''); out.push('```python'); out.push(e.code); out.push('```');
        out.push(''); out.push('> ' + stripTags(e.note));
      });
    }
  });
  out.push('');
  return out.join('\n');
}
function exCopy(){
  var txt = exMarkdown(), btn = $('exCopy');
  function done(ok){
    btn.textContent = ok ? 'Copied \u2713' : 'Use Download \u2193';
    setTimeout(function(){ btn.textContent = 'Copy markdown'; }, 2200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ exCopyFallback(txt, done); });
  } else exCopyFallback(txt, done);
}
function exCopyFallback(txt, done){
  try{
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta); done(ok);
  }catch(e){ done(false); }
}
function exDownload(){
  var names = { qf:'quick-fire-sheet', call:'interview-points', sql:'code-cookbook' };
  var blob = new Blob([exMarkdown()], { type:'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'sql-bench-' + names[EX_MODE] + '.md';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function buildExportUI(){
  var sel = $('exTrack'), opts = '<option value="*">All tracks</option>';
  ROADMAP.forEach(function(t){ opts += '<option value="' + esc(t.t) + '">' + esc(t.t) + '</option>'; });
  sel.innerHTML = opts;
  sel.addEventListener('change', function(){ EX_TRACK = sel.value; exRender(); });
  [].slice.call(document.querySelectorAll('.ex-tab')).forEach(function(b){
    b.addEventListener('click', function(){ EX_MODE = b.getAttribute('data-mode'); exRender(); });
  });
  $('exCopy').addEventListener('click', exCopy);
  $('exDl').addEventListener('click', exDownload);
  $('exPrint').addEventListener('click', function(){ window.print(); });
  exRender();
}





/* ---------- what the interpreter supports ---------- */
function buildTables(){
  var host = $('tblBody');
  if(!host) return;
  host.innerHTML =
    '<p class="snote">Every non-reference example on this page is executed by a Python interpreter ' +
    'written in JavaScript \u2014 a tokenizer, parser and evaluator, not a lookup table of expected output. ' +
    'Edit any example and press Ctrl+Enter.</p>' +
    '<h2>Supported</h2>' +
    '<div class="cols"><b>numbers, strings, bytes-free f-strings</b> \u00b7 <b>list / dict / set / tuple</b> \u00b7 ' +
    '<b>slicing</b> \u00b7 <b>comprehensions</b> (list, dict, set, generator) \u00b7 <b>if / elif / else</b> \u00b7 ' +
    '<b>for / while</b> with <b>else</b>, break, continue \u00b7 <b>def</b> with defaults, *args, **kwargs \u00b7 ' +
    '<b>lambda</b> \u00b7 <b>closures</b> \u00b7 <b>decorators</b> \u00b7 <b>class</b> with inheritance and dunders ' +
    '(__init__, __repr__, __str__, __eq__, __len__, __iter__, __getitem__, __enter__, __exit__) \u00b7 ' +
    '<b>try / except / else / finally</b> with a real exception hierarchy \u00b7 <b>raise</b> \u00b7 ' +
    '<b>custom exception classes</b> \u00b7 <b>with</b> \u00b7 <b>yield</b> and <b>yield from</b> \u2014 genuinely lazy \u00b7 ' +
    '<b>unpacking</b> including starred \u00b7 <b>assert</b> \u00b7 <b>import</b></div>' +
    '<h2>Built-ins</h2>' +
    '<div class="cols">print len range list tuple set dict str repr int float bool abs round min max sum ' +
    'sorted reversed enumerate zip map filter any all type isinstance hasattr getattr setattr id hash ' +
    'iter next divmod pow chr ord bin hex format callable</div>' +
    '<h2>Modules</h2>' +
    '<div class="cols"><b>math</b> \u00b7 <b>json</b> \u00b7 <b>random</b> (seeded, reproducible) \u00b7 ' +
    '<b>collections</b> (Counter, defaultdict, namedtuple, deque) \u00b7 ' +
    '<b>itertools</b> (count, cycle, islice, chain, groupby, combinations, product) \u00b7 ' +
    '<b>functools</b> (reduce, lru_cache, cache, partial, wraps) \u00b7 <b>operator</b> \u00b7 ' +
    '<b>dataclasses</b> \u00b7 <b>typing</b> \u00b7 <b>logging</b> \u00b7 <b>time</b></div>' +
    '<h2>Fidelity</h2>' +
    '<p>The interpreter is checked against CPython behaviour on the details these modules teach: ' +
    'aliasing and identity, mutable defaults evaluated once at definition, three-valued float display ' +
    '(<code>10/2</code> is <code>5.0</code>), Python\u2019s sign-following modulo (<code>-7 % 3</code> is <code>2</code>), ' +
    'round-half-to-even on the stored binary double (<code>round(2.675, 2)</code> is <code>2.67</code>), ' +
    'lazy generators that exhaust after one pass, and an exception hierarchy where a custom subclass is ' +
    'caught by its base.</p>' +
    '<div class="call warn"><h4>The trap</h4><p>This is a teaching interpreter, not CPython. There is no ' +
    'filesystem, no network, no threads and no C extensions \u2014 so <code>open()</code>, <code>requests</code>, ' +
    '<code>pandas</code> and <code>asyncio</code> are not available, and the modules that need them appear as ' +
    'reference blocks rather than runnable examples. Execution is capped at 400,000 steps so an infinite ' +
    'loop stops rather than hanging your browser. Treat it as a place to run the ideas, not as a ' +
    'compatibility reference.</p></div>';
}


/* ---------- overlays ---------- */
function ovl(id, v){
  var el = $(id);
  el.classList.toggle('open', v);
  if(v && id === 'srOvl') setTimeout(function(){ $('srIn').focus(); $('srIn').select(); }, 30);
}

/* ---------- boot ---------- */
function boot(){
  buildRail();
  buildSearchIndex();
  wireFilter();

  $('burger').addEventListener('click', function(){ railOpen(!$('rail').classList.contains('open')); });
  $('scrim').addEventListener('click', function(){ railOpen(false); });

  $('btnSearch').addEventListener('click', function(){ ovl('srOvl', true); runSearch(); });
  $('srIn').addEventListener('input', runSearch);
  $('srX').addEventListener('click', function(){ ovl('srOvl', false); });
  $('btnDrill').addEventListener('click', function(){ ovl('drlOvl', true); if(!DRILL.length) buildDrill(); });
  $('btnTables').addEventListener('click', function(){ ovl('tblOvl', true); });
  $('tblX').addEventListener('click', function(){ ovl('tblOvl', false); });
  buildTables();
  $('btnExport').addEventListener('click', function(){ ovl('exOvl', true); });
  $('exX').addEventListener('click', function(){ ovl('exOvl', false); });
  buildExportUI();
  $('drlX').addEventListener('click', function(){ ovl('drlOvl', false); });
  $('btnDone').addEventListener('click', function(){
    var code = mods[cur].getAttribute('data-code');
    doneSet[code] = !doneSet[code];
    navBtns[cur].classList.toggle('ok', !!doneSet[code]);
    $('btnDone').classList.toggle('on', !!doneSet[code]);
  });

  document.addEventListener('keydown', function(e){
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea';
    if(e.key === 'Escape'){ ovl('srOvl', false); ovl('drlOvl', false); ovl('exOvl', false); ovl('tblOvl', false); return; }
    if(typing) return;
    if(e.key === '/'){ e.preventDefault(); ovl('srOvl', true); runSearch(); return; }
    if(e.key === 'd' || e.key === 'D'){ ovl('drlOvl', true); if(!DRILL.length) buildDrill(); return; }
    if(e.key === 'e' || e.key === 'E'){ ovl('exOvl', true); return; }
    if(e.key === 't' || e.key === 'T'){ ovl('tblOvl', true); return; }
    if(e.key === 'ArrowLeft') go(cur - 1);
    if(e.key === 'ArrowRight') go(cur + 1);
  });

  var start = 0;
  if(location.hash){
    var want = location.hash.slice(1).toLowerCase();
    for(var j = 0; j < mods.length; j++) if(mods[j].id === want){ start = j; break; }
  }
  go(start);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
