   note: 'Assigning the result of `.sort()` silently replaces your list with None. Every method that mutates in place returns None by convention — `append`, `extend`, `reverse`, `update` — which is deliberate, so that this mistake fails loudly on the next line.' },
 { t: 'operator.itemgetter over a lambda',
   code: "from operator import itemgetter\n\nrows = [(\"t3\", 100.0), (\"t1\", 900.0), (\"t2\", 250.0)]\n\nprint(\"by lambda:    \", sorted(rows, key=lambda r: r[1]))\nprint(\"by itemgetter:\", sorted(rows, key=itemgetter(1)))\n\ndicts = [{\"w\": \"w-2\", \"amt\": 5}, {\"w\": \"w-1\", \"amt\": 9}]\nprint(\"multi-key:\", sorted(dicts, key=itemgetter(\"w\", \"amt\")))",
   note: 'itemgetter does the same job, is faster because it avoids a Python-level call per element, and reads better for multi-key sorts. Reach for a lambda when you need real logic, itemgetter when you are just pulling fields.' },
 { t: 'Functions in data structures',
   code: "def to_float(v):\n    return float(v)\n\ndef strip_text(v):\n    return v.strip()\n\nCLEANERS = {\n    \"amount\": to_float,\n    \"wallet\": strip_text,\n    \"note\":   lambda v: v.strip().lower(),\n}\n\nrow = {\"amount\": \"100\", \"wallet\": \"  w-1 \", \"note\": \"  URGENT  \"}\ncleaned = {k: CLEANERS[k](v) for k, v in row.items()}\nprint(cleaned)",
   note: 'A dict of functions is a dispatch table, and it replaces a long if/elif chain with data you can extend without touching the logic. This is the shape of most column-cleaning code in a pipeline.' },
 { t: 'map and filter are lazy; comprehensions are not',
   code: "nums = [1, 2, 3, 4, 5]\n\ndoubled = map(lambda n: n * 2, nums)\nevens = filter(lambda n: n % 2 == 0, nums)\n\nprint(\"map object:\", type(doubled).__name__)\nprint(\"first pass: \", list(doubled))\nprint(\"second pass:\", list(doubled), \"<- exhausted\")\n\nprint(\"comprehension:\", [n * 2 for n in nums if n % 2 == 0])\nprint(\"filter total:\", sum(filter(lambda n: n % 2 == 0, nums)))",
   note: '`map` and `filter` return lazy iterators, so they exhaust after one pass just like generators. For readability a comprehension usually wins; `map` earns its place when you already have a named function to apply.' }
],
body: [
 { h: 'When a lambda is right, and when it is not', html:
   '<table><thead><tr><th>Use a lambda</th><th>Use a def</th></tr></thead><tbody><tr><td>A sort key</td><td>Anything with a branch</td></tr><tr><td>A one-expression callback</td><td>Anything worth a name</td></tr><tr><td>A default in a dispatch table</td><td>Anything you want to test</td></tr></tbody></table><p>A lambda cannot contain a statement, so it cannot have a try block, an assignment or a loop. If you find yourself wanting one, you wanted a <code>def</code>.</p>' },
 { h: 'Sorting facts worth knowing', html:
   '<ul><li><strong>Python’s sort is stable</strong> — equal elements keep their original order, which is what lets you sort by one field then another and get a correct multi-key result.</li><li><strong><code>key</code> is called once per element</strong>, not once per comparison, so an expensive key function is affordable.</li><li><strong>Mixed types raise.</strong> Sorting a list containing both <code>None</code> and numbers fails — supply a key that normalises first.</li><li><strong><code>reverse=True</code> is not the same as reversing the key</strong> when the sort is stable and multi-key.</li></ul>' },
 { h: 'The convention behind returning None', html:
   '<p>Methods that mutate return <code>None</code> on purpose. It means <code>x = x.sort()</code> destroys your data immediately and visibly, rather than appearing to work. Once you know the rule, <code>sorted</code> versus <code>.sort()</code> and <code>reversed</code> versus <code>.reverse()</code> stop being arbitrary.</p>' }
],
call: '"A tuple key sorts by several fields at once and negating a number reverses just that one, which is cleaner than sorting twice. And I keep in mind that sort() mutates and returns None while sorted() returns a new list — assigning the result of sort() replaces your data with None."',
warn: 'Assigning the result of `.sort()`, `.append()` or `.update()` gives you None. The convention is deliberate — mutating methods return None so the mistake fails immediately rather than silently producing an empty result later.',
qf: [
 ['What does sorted() return versus .sort()?', 'sorted() returns a new list; .sort() mutates in place and returns None.'],
 ['How do you sort by two fields with opposite directions?', 'A tuple key, negating the numeric field you want descending.'],
 ["Is Python's sort stable?", 'Yes — equal elements keep their relative order, which makes multi-pass sorting valid.'],
 ['How often is the key function called?', 'Once per element, not once per comparison.'],
 ['When is itemgetter better than a lambda?', 'When you are only pulling fields — it is faster and reads better for multi-key sorts.'],
 ['What do map and filter return?', 'Lazy iterators that exhaust after one pass.'],
 ['What can a lambda not contain?', 'Statements — no assignment, try, or loop. Use def instead.']
]});

M.push({
code: 'U4', track: 'Tier 3 · Functions',
title: 'Closures and late binding',
sub: 'A function remembers where it was made — including the variable, not its value.',
lede: 'A closure is a function that keeps a reference to the scope it was defined in. That is what makes factories, decorators and callbacks work. It is also the source of the most-asked Python puzzle, because the closure captures the <em class="hl">variable</em>, not the value it had at definition time.',
ex: [
 { t: 'A closure captures its enclosing scope',
   code: "def make_multiplier(factor):\n    def multiply(n):\n        return n * factor      # factor comes from the enclosing scope\n    return multiply\n\ndouble = make_multiplier(2)\ntriple = make_multiplier(3)\n\nprint(double(10), triple(10))\nprint(\"independent:\", double(1), triple(1))",
   note: 'Each call to the factory creates a new scope, so `double` and `triple` hold different `factor` values. The inner function outlives the call that created it and keeps its scope alive.' },
 { t: 'The late-binding trap',
   code: "funcs = []\nfor i in range(3):\n    funcs.append(lambda: i)\n\nprint(\"expected [0, 1, 2], got:\", [f() for f in funcs])\nprint(\"because all three close over the SAME variable i, now\", i)",
   note: 'All three lambdas reference the same `i`, and by the time they run the loop has finished. This is not a bug in closures — it is what capturing a variable rather than a value means, and it is asked in interviews constantly.' },
 { t: 'Two fixes, and why the first is preferred',
   code: "funcs_default = []\nfor i in range(3):\n    funcs_default.append(lambda i=i: i)      # bind now, via a default\n\ndef make(i):\n    return lambda: i                          # fresh scope per call\n\nfuncs_factory = [make(i) for i in range(3)]\n\nprint(\"default-argument fix:\", [f() for f in funcs_default])\nprint(\"factory fix:         \", [f() for f in funcs_factory])",
   note: 'The default-argument fix works because defaults evaluate at definition time — the same mechanism that causes the mutable-default trap, used deliberately. The factory version is clearer when the closure is more than one line.' },
 { t: 'A closure holding real state',
   code: "def make_batcher(size):\n    batch = []\n    def add(row):\n        nonlocal batch\n        batch.append(row)\n        if len(batch) >= size:\n            full, batch = batch, []\n            return full\n        return None\n    return add\n\nadd = make_batcher(3)\nfor n in range(7):\n    out = add(n)\n    if out:\n        print(\"emitted batch:\", out)\nprint(\"held back (not yet full):\", add(\"flush-marker\") is None)",
   note: 'A closure is a lightweight alternative to a class when you need one piece of state and one operation. `nonlocal` is what lets `add` rebind `batch` rather than shadowing it.' },
 { t: 'Closures are why decorators work',
   code: "def counted(fn):\n    calls = 0\n    def wrapper(*args):\n        nonlocal calls\n        calls += 1\n        wrapper.calls = calls\n        return fn(*args)\n    wrapper.calls = 0\n    return wrapper\n\n@counted\ndef parse(x):\n    return int(x)\n\nparse(\"1\"); parse(\"2\"); parse(\"3\")\nprint(\"parse called\", parse.calls, \"times\")",
   note: 'The wrapper closes over both `fn` and `calls`. Every decorator in the next module is this shape — which is why closures come first.' }
],
body: [
 { h: 'What a closure captures', html:
   '<div class="pre">def outer():\n    x = 1\n    def inner():\n        return x     <i>captures the VARIABLE x, not the value 1</i>\n    x = 99\n    return inner\n\nouter()()  ->  99, not 1</div><p>The inner function looks up <code>x</code> when it runs, not when it is defined. Everything about late binding follows from that.</p>' },
 { h: 'Where late binding actually bites', html:
   '<ul><li><strong>Building callbacks in a loop</strong> — event handlers, retry functions, per-column cleaners.</li><li><strong>Building a dispatch table in a loop</strong> — every entry ends up pointing at the last value.</li><li><strong>Deferred logging</strong> — a lambda capturing a loop variable logs the final one.</li></ul><p>It does not bite in a list comprehension that calls the function immediately, which is why the bug only appears when the functions are stored and run later.</p>' },
 { h: 'Closure or class?', html:
   '<table><thead><tr><th>Closure</th><th>Class</th></tr></thead><tbody><tr><td>One piece of state</td><td>Several related fields</td></tr><tr><td>One operation</td><td>Several methods</td></tr><tr><td>No need to inspect state</td><td>You want a repr, equality, or tests on state</td></tr></tbody></table>' }
],
call: '"A closure captures the variable rather than its value, which is why lambdas built in a loop all return the final one — they look it up when they run, not when they were defined. The default-argument fix binds at definition time, using the same mechanism that causes the mutable-default trap, deliberately."',
warn: "Building functions in a loop and storing them for later gives every one of them the loop variable's final value. The code reads correctly, and it only misbehaves once the functions are called after the loop ends.",
qf: [
 ['What is a closure?', 'A function that keeps a reference to the scope it was defined in.'],
 ['What does a closure capture — value or variable?', 'The variable. It is looked up when the function runs, not when it is defined.'],
 ['Why do lambdas in a loop all return the last value?', 'They share one loop variable, and by the time they run the loop has finished.'],
 ['Name two fixes for late binding.', 'A default argument that binds at definition time, or a factory function giving each a fresh scope.'],
 ['What does nonlocal do in a closure?', 'Lets the inner function rebind the enclosing variable rather than shadowing it.'],
 ['When is a closure better than a class?', 'One piece of state and one operation, with no need to inspect it.']
]});

M.push({
code: 'U5', track: 'Tier 3 · Functions',
title: 'Decorators, built up from nothing',
sub: 'A function that takes a function and returns a function. Everything else is detail.',
lede: 'Decorators look like syntax and are not — <code>@deco</code> above a definition is exactly <code>f = deco(f)</code>. Once that lands, retry, caching, timing, logging and validation all stop being magic and become the same four-line shape you can write from memory.',
ex: [
 { t: 'Build one from first principles',
   code: "def announce(fn):\n    def wrapper(*args, **kwargs):\n        print(f\"  calling {fn.__name__} with {args}\")\n        result = fn(*args, **kwargs)\n        print(f\"  {fn.__name__} returned {result}\")\n        return result\n    return wrapper\n\ndef add(a, b):\n    return a + b\n\nadd = announce(add)          # this line IS the @ syntax\nprint(\"result:\", add(2, 3))",
   note: 'No decorator syntax used at all. `announce` receives the function, builds a replacement that calls it, and returns the replacement. The `@` form on the next example is identical.' },
 { t: 'The same thing with @',
   code: "def announce(fn):\n    def wrapper(*args, **kwargs):\n        print(f\"  calling {fn.__name__}\")\n        return fn(*args, **kwargs)\n    return wrapper\n\n@announce\ndef parse(raw):\n    return float(raw)\n\nprint(\"result:\", parse(\"12.5\"))\nprint(\"what parse actually is now:\", parse.__name__)",
   note: 'Note the last line: the name is now `wrapper`, not `parse`. The decorator replaced the function and the identity went with it — which breaks tracebacks, documentation and anything that introspects. That is what functools.wraps fixes.' },
 { t: 'functools.wraps preserves identity',
   code: "from functools import wraps\n\ndef announce(fn):\n    @wraps(fn)\n    def wrapper(*args, **kwargs):\n        return fn(*args, **kwargs)\n    return wrapper\n\n@announce\ndef parse(raw):\n    return float(raw)\n\nprint(\"name preserved:\", parse.__name__)\nprint(\"still works:\", parse(\"7\"))",
   note: 'One line, and the wrapped function keeps its name. Always use it — without it, a stack trace from inside a decorated function names `wrapper` and tells you nothing about which function failed.' },
 { t: 'A decorator that takes arguments needs three levels',
   code: "def retry(attempts):\n    def decorate(fn):\n        def wrapper(*args):\n            for attempt in range(1, attempts + 1):\n                try:\n                    return fn(*args)\n                except ValueError as e:\n                    print(f\"  attempt {attempt} failed: {e}\")\n                    if attempt == attempts:\n                        raise\n        return wrapper\n    return decorate\n\nstate = {\"n\": 0}\n\n@retry(attempts=3)\ndef flaky():\n    state[\"n\"] += 1\n    if state[\"n\"] < 3:\n        raise ValueError(\"transient\")\n    return \"ok\"\n\nprint(\"result:\", flaky(), \"after\", state[\"n\"], \"attempts\")",
   note: 'Three nested functions: `retry(3)` returns `decorate`, which receives the function and returns `wrapper`. The extra level exists purely to capture the argument — which is a closure, from the previous module.' },
 { t: 'Caching, and measuring that it worked',
   code: "from functools import lru_cache\n\ncalls = {\"n\": 0}\n\n@lru_cache\ndef slow_lookup(key):\n    calls[\"n\"] += 1\n    return key.upper()\n\nfor k in [\"a\", \"b\", \"a\", \"a\", \"b\"]:\n    slow_lookup(k)\n\nprint(\"lookups requested: 5\")\nprint(\"actual calls made:\", calls[\"n\"])\nprint(\"cache saved\", 5 - calls[\"n\"], \"calls\")",
   note: 'The cache is keyed on the arguments, so repeats never reach the function. This only works if arguments are hashable and the function is pure — caching something that reads a changing source hands you stale data with no warning.' },
 { t: 'Stacking decorators applies bottom-up',
   code: "def tag(name):\n    def decorate(fn):\n        def wrapper(*a):\n            return f\"<{name}>{fn(*a)}</{name}>\"\n        return wrapper\n    return decorate\n\n@tag(\"outer\")\n@tag(\"inner\")\ndef content():\n    return \"text\"\n\nprint(content())\nprint(\"bottom decorator is applied first, so it ends up innermost\")",
   note: 'Read decorators bottom-up: `inner` wraps the function, then `outer` wraps that. It matters when order changes behaviour — caching above retry caches the failures, caching below retry caches only successes.' }
],
body: [
 { h: 'The three shapes', html:
   '<div class="pre code">def deco(fn):                    <i>no arguments</i>\n    def wrapper(*a, **kw):\n        return fn(*a, **kw)\n    return wrapper\n\ndef deco(arg):                   <i>takes arguments — one extra level</i>\n    def decorate(fn):\n        def wrapper(*a, **kw):\n            return fn(*a, **kw)\n        return wrapper\n    return decorate\n\nclass Deco:                      <i>class-based, for stateful decorators</i>\n    def __init__(self, fn): self.fn = fn\n    def __call__(self, *a): return self.fn(*a)</div>' },
 { h: 'What decorators are actually for', html:
   '<table><thead><tr><th>Concern</th><th>Why a decorator</th></tr></thead><tbody><tr><td>Retry with backoff</td><td>Needed on many functions, identical each time</td></tr><tr><td>Caching</td><td>Orthogonal to what the function computes</td></tr><tr><td>Timing and logging</td><td>Cross-cutting; you want it off in one place</td></tr><tr><td>Input validation</td><td>Same check on every entry point</td></tr><tr><td>Registration</td><td>Building a dispatch table at import time</td></tr></tbody></table><p>The test is whether the behaviour is <em class="hl">orthogonal</em> to the function’s purpose. Business logic in a decorator hides it from anyone reading the function.</p>' },
 { h: 'The two rules', html:
   '<ul><li><strong>Always use <code>functools.wraps</code></strong>, or tracebacks and introspection break.</li><li><strong>Read stacked decorators bottom-up.</strong> The one closest to <code>def</code> is applied first and sits innermost.</li></ul>' }
],
call: '"A decorator is a function that takes a function and returns a replacement — the @ is just f = deco(f). One that takes arguments needs a third level purely to capture them. And I always use functools.wraps, because without it a traceback from inside a decorated function names \'wrapper\' and tells you nothing."',
warn: 'Caching above retry caches the failures too, so a transient error becomes permanent for every later caller. Stacking order changes behaviour, and decorators apply bottom-up — the one nearest `def` runs first.',
qf: [
 ['What is a decorator, mechanically?', 'A function that takes a function and returns a replacement.'],
 ['What is @deco shorthand for?', 'f = deco(f).'],
 ['Why does a parameterised decorator need three levels?', 'The outer level captures the argument, the middle receives the function, the inner is the wrapper.'],
 ['What does functools.wraps do?', "Preserves the wrapped function's name and metadata so tracebacks and introspection still work."],
 ['In what order do stacked decorators apply?', 'Bottom-up — the one nearest def is applied first and ends up innermost.'],
 ['When is caching unsafe?', 'When the function is not pure — caching a changing source returns stale data silently.'],
 ['What belongs in a decorator?', "Behaviour orthogonal to the function's purpose — retry, caching, timing, validation, registration."]
]});

M.push({
code: 'U6', track: 'Tier 3 · Functions',
title: 'Type hints and what they do not do',
sub: 'Documentation the tooling can check. Not enforcement — Python ignores them at runtime.',
lede: 'Annotations describe intent and are checked by <code>mypy</code>, your editor and code review — never by the interpreter. Believing otherwise leads to a function annotated <code>-> float</code> that cheerfully returns a string. Used honestly they are the cheapest documentation available, because they cannot go stale silently.',
ex: [
 { t: 'Annotations are not enforced',
   code: "def parse_amount(raw: str) -> float:\n    return raw            # returns a str, not a float — no error at runtime\n\nresult = parse_amount(\"100\")\nprint(\"returned:\", result, \"of type\", type(result).__name__)\nprint(\"annotation says float; Python did not check\")\n\ndef add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(\"x\", \"y\"), \"<- also fine at runtime\")",
   note: 'Both functions violate their annotations and run happily. Python stores annotations and ignores them. A type checker catches both of these before the code ever runs, which is the entire value proposition.' },
 { t: 'Where they earn their place',
   code: "def summarise(rows: list, key: str) -> dict:\n    totals: dict = {}\n    for r in rows:\n        totals[r[key]] = totals.get(r[key], 0) + r[\"amount\"]\n    return totals\n\nrows = [{\"wallet\": \"w-1\", \"amount\": 100}, {\"wallet\": \"w-1\", \"amount\": 50}]\nprint(summarise(rows, \"wallet\"))\n\n# without the annotation the reader must infer the shape from the body;\n# with it, the contract is on the first line",
   note: 'The signature is where a reader looks first. Annotating the boundary functions of a module — what goes in, what comes out — gives most of the benefit for very little typing.' },
 { t: 'Optional, and the None that hides in every pipeline',
   code: "def find_wallet(rows, wallet_id):\n    for r in rows:\n        if r[\"wallet\"] == wallet_id:\n            return r\n    return None                      # the case people forget\n\nrows = [{\"wallet\": \"w-1\", \"amount\": 100}]\n\nhit = find_wallet(rows, \"w-1\")\nprint(\"found:\", hit)\n\nmiss = find_wallet(rows, \"w-9\")\nprint(\"missing:\", miss)\ntry:\n    print(miss[\"amount\"])\nexcept TypeError as e:\n    print(\"and this is the crash:\", e)",
   note: 'A function that returns `X | None` is the single most common source of runtime crashes in a pipeline. Annotating it `Optional[dict]` makes the checker force every caller to handle the None branch — which is the whole point.' },
 { t: 'Runtime validation is a separate job',
   code: "def load(rows, mode=\"append\"):\n    if not isinstance(rows, list):\n        raise TypeError(f\"rows must be a list, got {type(rows).__name__}\")\n    if mode not in {\"append\", \"overwrite\"}:\n        raise ValueError(f\"unknown mode: {mode!r}\")\n    return f\"{len(rows)} rows, mode={mode}\"\n\nprint(load([1, 2]))\ntry:\n    load(\"not a list\")\nexcept TypeError as e:\n    print(\"caught:\", e)\ntry:\n    load([1], mode=\"upsert\")\nexcept ValueError as e:\n    print(\"caught:\", e)",
   note: 'If a value comes from outside your code — a config file, an API, a CLI argument — annotations will not save you. Validate at the boundary and let annotations document the interior.' }
],
body: [
 { h: 'The common annotations', html:
   '<div class="pre code">def f(x: int, name: str = "", rows: list[dict] | None = None) -> float: ...\n\nlist[dict]        <i>a list of dicts (Python 3.9+)</i>\ndict[str, float]  <i>keys and values</i>\nX | None          <i>optional (3.10+); Optional[X] before that</i>\nCallable[..., X]  <i>a function returning X</i>\nIterator[dict]    <i>a generator of dicts</i>\nAny               <u>an escape hatch — use sparingly</u></div>' },
 { h: 'What they buy, honestly', html:
   '<table><thead><tr><th>Real benefit</th><th>Not a benefit</th></tr></thead><tbody><tr><td>Editor autocomplete and navigation</td><td>Runtime safety</td></tr><tr><td>mypy catches mismatches before running</td><td>Performance</td></tr><tr><td>Documentation that cannot silently rot</td><td>Input validation</td></tr><tr><td>Forces callers to handle <code>None</code></td><td>Protection from bad external data</td></tr></tbody></table>' },
 { h: 'Where to spend the effort', html:
   '<ul><li><strong>Annotate public functions</strong> — the boundary of a module.</li><li><strong>Always annotate anything returning <code>X | None</code></strong>; that is where the crashes come from.</li><li><strong>Skip obvious locals.</strong> <code>count: int = 0</code> adds nothing.</li><li><strong>Run mypy in CI</strong>, or the annotations are decoration.</li><li><strong>Validate external input separately</strong> — annotations are for your code, not the world’s data.</li></ul>' }
],
call: '"Annotations are documentation the tooling can check, not enforcement — Python ignores them at runtime, so a function annotated to return float can return a string. I annotate module boundaries and anything that can return None, and I validate external input separately, because a type hint will not stop a malformed API response."',
warn: 'A type hint provides no runtime protection whatsoever. Data arriving from a file, an API or a config is unvalidated regardless of how carefully the function is annotated — and the crash happens deep inside, not at the boundary.',
qf: [
 ['Does Python enforce type hints?', 'No — it stores and ignores them. Only a checker like mypy uses them.'],
 ['What is the main practical benefit?', 'Catching mismatches before running, plus editor support and documentation that cannot rot silently.'],
 ['Which annotation matters most in a pipeline?', 'X | None (Optional) — it forces callers to handle the missing case.'],
 ['Do hints validate external input?', 'No. Validate at the boundary with explicit checks.'],
 ['Where should you spend annotation effort?', 'Public functions and module boundaries, not obvious locals.'],
 ['What makes annotations worthwhile?', 'Running a type checker in CI — otherwise they are decoration.']
]});

M.push({
code: 'O1', track: 'Tier 4 · Objects',
title: 'Classes, __init__ and where state lives',
sub: 'Instance attributes belong to the object. Class attributes are shared by every instance.',
lede: 'A class is a template for objects that carry state and behaviour together. The distinction that causes real bugs is <em class="hl">where</em> an attribute lives: set on <code>self</code> it belongs to one instance; set in the class body it is shared by all of them — which is the mutable-default trap wearing different clothes.',
ex: [
 { t: 'Instance state, set in __init__',
   code: "class Transaction:\n    def __init__(self, txn_id, amount, wallet):\n        self.txn_id = txn_id\n        self.amount = amount\n        self.wallet = wallet\n        self.flags = []                # a NEW list per instance\n\n    def flag(self, reason):\n        self.flags.append(reason)\n        return self\n\na = Transaction(\"t1\", 9800.0, \"w-2\")\nb = Transaction(\"t2\", 40.0, \"w-1\")\na.flag(\"near-threshold\")\n\nprint(\"a.flags:\", a.flags)\nprint(\"b.flags:\", b.flags, \"<- independent\")\nprint(\"a.__dict__:\", a.__dict__)",
   note: 'Each instance gets its own `flags` because the list is created inside `__init__`, which runs per object. `__dict__` shows exactly what this instance carries — useful when debugging why two objects behave differently.' },
 { t: 'Class attributes are shared — and mutable ones are a trap',
   code: "class Broken:\n    flags = []                         # ONE list, shared by every instance\n\n    def __init__(self, txn_id):\n        self.txn_id = txn_id\n\na = Broken(\"t1\")\nb = Broken(\"t2\")\na.flags.append(\"suspicious\")\n\nprint(\"a.flags:\", a.flags)\nprint(\"b.flags:\", b.flags, \"<- same list!\")\nprint(\"shared with the class:\", Broken.flags)",
   note: 'Exactly the mutable-default bug from Tier 2, in class form. A mutable class attribute is shared state that looks like per-object state, and it accumulates for the life of the process.' },
 { t: 'When a class attribute is right',
   code: "class Loader:\n    VALID_MODES = (\"append\", \"overwrite\", \"merge\")     # immutable, shared: correct\n    instances_created = 0                               # deliberate shared counter\n\n    def __init__(self, mode):\n        if mode not in Loader.VALID_MODES:\n            raise ValueError(f\"unknown mode: {mode!r}\")\n        self.mode = mode\n        Loader.instances_created += 1\n\nLoader(\"append\")\nLoader(\"merge\")\nprint(\"created:\", Loader.instances_created)\ntry:\n    Loader(\"upsert\")\nexcept ValueError as e:\n    print(\"rejected:\", e)",
   note: 'Constants and deliberate counters are exactly what class attributes are for. The tuple is immutable so sharing is safe, and the counter is shared on purpose — note it is incremented on `Loader`, not on `self`.' },
 { t: 'Assigning through self creates an instance attribute',
   code: "class Config:\n    retries = 3                        # class-level default\n\na = Config()\nb = Config()\n\nprint(\"both see the default:\", a.retries, b.retries)\n\na.retries = 10                          # creates an INSTANCE attribute on a\nprint(\"a overrode it:\", a.retries, \" b still default:\", b.retries)\nprint(\"class unchanged:\", Config.retries)\n\nConfig.retries = 5                      # changing the class\nprint(\"a keeps its own:\", a.retries, \" b follows the class:\", b.retries)",
   note: 'Assignment through `self` never modifies the class — it shadows. This is why the immutable class-attribute-as-default pattern works safely, and why the mutable version does not: `append` mutates the shared object rather than shadowing it.' }
],
body: [
 { h: 'Where attributes live', html:
   '<table><thead><tr><th></th><th>Instance attribute</th><th>Class attribute</th></tr></thead><tbody><tr><td>Set in</td><td><code>__init__</code>, via <code>self.x = ...</code></td><td>The class body</td></tr><tr><td>Belongs to</td><td>One object</td><td>Every instance</td></tr><tr><td>Right for</td><td>Per-object state</td><td>Constants, defaults, counters</td></tr><tr><td>Mutable version</td><td>Fine</td><td><b>Shared-state bug</b></td></tr></tbody></table>' },
 { h: 'Lookup order', html:
   '<p>Reading <code>obj.x</code> checks the instance first, then the class, then its bases. Writing <code>obj.x = ...</code> always writes to the instance. That asymmetry is the whole model, and it explains every behaviour in this module.</p>' },
 { h: 'The rule', html:
   '<p>Any mutable class attribute — <code>[]</code>, <code>{}</code>, <code>set()</code> — should be created in <code>__init__</code> instead. Immutable ones are safe and idiomatic.</p>' }
],
call: '"Instance attributes are created per object in __init__; class attributes are shared by every instance. A mutable class attribute is the same bug as a mutable default argument — shared state that looks like per-object state — so anything mutable belongs in __init__."',
warn: 'A mutable class attribute looks like a per-instance default and is one shared object. Every instance appends to the same list, and in a long-running process it grows until the memory does.',
qf: [
 ['Where do instance attributes live?', 'On the object, created by self.x = ... in __init__.'],
 ['What is wrong with a mutable class attribute?', 'It is shared by every instance — the same bug as a mutable default argument.'],
 ['When is a class attribute right?', 'Immutable constants, defaults, and deliberate shared counters.'],
 ['What does self.x = 1 do if x is a class attribute?', 'Creates an instance attribute that shadows it; the class is unchanged.'],
 ['What is the attribute lookup order?', 'Instance, then class, then base classes.'],
 ['What does obj.__dict__ show?', 'The instance attributes only, not class-level ones.']
]});

M.push({
code: 'O2', track: 'Tier 4 · Objects',
title: 'Methods, self, and the three method types',
sub: 'self is just the first argument. staticmethod and classmethod change what gets passed.',
lede: 'A method is a function stored on a class. When you call it through an instance, Python passes the instance as the first argument — that is all <code>self</code> means. <code>@staticmethod</code> and <code>@classmethod</code> change what that first argument is, or remove it.',
ex: [
 { t: 'self is passed explicitly by the interpreter',
   code: "class Wallet:\n    def __init__(self, wid):\n        self.wid = wid\n\n    def describe(self):\n        return f\"wallet {self.wid}\"\n\nw = Wallet(\"w-1\")\n\nprint(\"normal call:\", w.describe())\nprint(\"same thing:  \", Wallet.describe(w))\nprint(\"bound method:\", w.describe)",
   note: '`w.describe()` and `Wallet.describe(w)` are the same call. A bound method is just the function with the instance already attached — which is why forgetting `self` in a definition produces an argument-count error rather than something mysterious.' },
 { t: 'classmethod as an alternative constructor',
   code: "class Transaction:\n    def __init__(self, txn_id, amount):\n        self.txn_id = txn_id\n        self.amount = amount\n\n    @classmethod\n    def from_row(cls, row):\n        return cls(row[\"id\"], float(row[\"amount\"]))\n\n    @classmethod\n    def from_csv_line(cls, line):\n        parts = line.split(\",\")\n        return cls(parts[0], float(parts[1]))\n\n    def __repr__(self):\n        return f\"Transaction({self.txn_id!r}, {self.amount})\"\n\nprint(Transaction.from_row({\"id\": \"t1\", \"amount\": \"100\"}))\nprint(Transaction.from_csv_line(\"t2,250.5\"))",
   note: 'This is the main real use of `classmethod`: named constructors for different input shapes. Because it receives `cls` rather than a hardcoded name, a subclass calling `from_row` gets an instance of the subclass.' },
 { t: 'staticmethod for a related function with no state',
   code: "class AmountParser:\n    THRESHOLD = 9000.0\n\n    @staticmethod\n    def clean(raw):\n        return float(str(raw).replace(\",\", \"\").strip())\n\n    @classmethod\n    def is_near_threshold(cls, raw):\n        return cls.clean(raw) >= cls.THRESHOLD\n\nprint(AmountParser.clean(\" 1,250.50 \"))\nprint(AmountParser.is_near_threshold(\"9,800\"))\nprint(AmountParser.is_near_threshold(\"100\"))",
   note: '`clean` needs neither the instance nor the class, so it takes neither. Grouping it on the class is organisational — and honestly, a module-level function would often be just as good.' },
 { t: 'Forgetting self, and what the error looks like',
   code: "class Broken:\n    def method():                      # no self\n        return \"hi\"\n\nb = Broken()\ntry:\n    b.method()\nexcept TypeError as e:\n    print(\"calling through the instance:\", e)\n\nprint(\"but through the class it works:\", Broken.method())",
   note: 'The instance is still passed, so a zero-parameter method receives one argument and fails. Reading the error as "one too many" rather than "something broke" makes it obvious immediately.' }
],
body: [
 { h: 'The three method types', html:
   '<table><thead><tr><th></th><th>Receives</th><th>Use for</th></tr></thead><tbody><tr><td>Instance method</td><td><code>self</code></td><td>Anything using instance state</td></tr><tr><td><code>@classmethod</code></td><td><code>cls</code></td><td><b>Alternative constructors</b>, class-level state</td></tr><tr><td><code>@staticmethod</code></td><td>Nothing</td><td>A related helper needing no state</td></tr></tbody></table>' },
 { h: 'Why classmethod beats hardcoding the class', html:
   '<div class="pre code">@classmethod\ndef from_row(cls, row):\n    return cls(row["id"])       <i>a subclass gets a subclass instance</i>\n\n@staticmethod\ndef from_row(row):\n    return Transaction(row["id"])  <u>a subclass still gets a Transaction</u></div>' },
 { h: 'When not to use a class at all', html:
   '<p>If a class has one method and no state, it is a function. If it has only static methods, it is a module. Python does not require you to wrap things in classes — reaching for one where a function would do is a common way to make code harder to test.</p>' }
],
call: '"self is just the first argument — w.describe() and Wallet.describe(w) are the same call. I use classmethod for alternative constructors because it receives cls, so a subclass gets an instance of itself rather than the parent. And a class with only static methods is really a module."',
warn: 'Forgetting `self` gives a confusing argument-count error, because the instance is still passed. The method appears to take zero arguments and receives one — reading it as "one too many" makes the cause obvious.',
qf: [
 ['What is self?', 'The first argument, which Python passes automatically when calling through an instance.'],
 ['Are w.f() and Cls.f(w) the same?', 'Yes — a bound method is the function with the instance already attached.'],
 ['What does a classmethod receive?', 'cls, the class it was called on — including a subclass.'],
 ['What is the main use of classmethod?', 'Alternative constructors that work correctly for subclasses.'],
 ['What does a staticmethod receive?', 'Nothing — it is a plain function grouped on the class.'],
 ['When should you not write a class?', 'When there is one method and no state, or only static methods.']
]});

M.push({
code: 'O3', track: 'Tier 4 · Objects',
title: 'Dunder methods',
sub: 'How your objects hook into len(), ==, in, iteration, printing and with.',
lede: 'Python’s built-in operations are protocols: <code>len(x)</code> calls <code>x.__len__()</code>, <code>a == b</code> calls <code>a.__eq__(b)</code>, <code>for x in y</code> calls <code>y.__iter__()</code>. Implementing the right dunders makes your objects work with the language instead of alongside it.',
ex: [
 { t: '__repr__ and __str__ are for different audiences',
   code: "class Txn:\n    def __init__(self, tid, amount):\n        self.tid = tid\n        self.amount = amount\n\n    def __repr__(self):\n        return f\"Txn(tid={self.tid!r}, amount={self.amount})\"\n\n    def __str__(self):\n        return f\"{self.tid}: {self.amount:,.2f}\"\n\nt = Txn(\"t1\", 9800.0)\nprint(\"str  (for humans):\", str(t))\nprint(\"repr (for you):   \", repr(t))\nprint(\"inside a list:\", [t])",
   note: '`__repr__` is for developers and should be unambiguous — ideally something you could paste back into code. `__str__` is for display. Containers always use `__repr__`, which is why a list of objects with only `__str__` prints uselessly.' },
 { t: '__eq__ and the hashability rule',
   code: "class Key:\n    def __init__(self, wallet, dt):\n        self.wallet = wallet\n        self.dt = dt\n\n    def __eq__(self, other):\n        return (self.wallet, self.dt) == (other.wallet, other.dt)\n\n    def __hash__(self):\n        return hash((self.wallet, self.dt))\n\n    def __repr__(self):\n        return f\"Key({self.wallet}, {self.dt})\"\n\na = Key(\"w-1\", \"2026-02-01\")\nb = Key(\"w-1\", \"2026-02-01\")\n\nprint(\"equal:\", a == b, \" same object:\", a is b)\nprint(\"dedupes in a set:\", len({a, b}))\nprint(\"works as a dict key:\", {a: 1}[b])",
   note: 'Defining `__eq__` without `__hash__` makes the object unhashable — Python assumes that if you customised equality, the default hash is wrong. Two objects that compare equal must hash equal, or sets and dicts break silently.' },
 { t: 'Container protocols: len, getitem, contains, iter',
   code: "class Batch:\n    def __init__(self, rows):\n        self._rows = rows\n\n    def __len__(self):\n        return len(self._rows)\n\n    def __getitem__(self, i):\n        return self._rows[i]\n\n    def __contains__(self, tid):\n        return any(r[\"id\"] == tid for r in self._rows)\n\n    def __iter__(self):\n        return iter(self._rows)\n\nb = Batch([{\"id\": \"t1\"}, {\"id\": \"t2\"}, {\"id\": \"t3\"}])\n\nprint(\"len:\", len(b))\nprint(\"index:\", b[0])\nprint(\"in:\", \"t2\" in b, \"t9\" in b)\nprint(\"iterate:\", [r[\"id\"] for r in b])\nprint(\"truthy:\", bool(b), \" empty is falsy:\", bool(Batch([])))",
   note: 'Four dunders and the object behaves like a built-in container. Note the last line: `bool()` falls back to `__len__` when `__bool__` is absent, so an empty batch is correctly falsy without extra work.' },
 { t: 'Arithmetic and ordering',
   code: "class Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __add__(self, other):\n        return Money(self.amount + other.amount)\n\n    def __lt__(self, other):\n        return self.amount < other.amount\n\n    def __eq__(self, other):\n        return self.amount == other.amount\n\n    def __repr__(self):\n        return f\"Money({self.amount})\"\n\na, b = Money(100), Money(250)\nprint(\"add:\", a + b)\nprint(\"compare:\", a < b, a > b)\nprint(\"sorted:\", sorted([b, a]))\nprint(\"min:\", min(a, b))",
   note: '`__lt__` alone is enough for `sorted`, `min` and `max`, because they only need "less than". Python derives `>` by swapping the operands, so you rarely need to implement all six comparisons.' },
 { t: '__enter__ and __exit__ make it usable with `with`',
   code: "class Timer:\n    def __init__(self, label):\n        self.label = label\n        self.steps = 0\n\n    def __enter__(self):\n        print(f\"  start {self.label}\")\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        print(f\"  end {self.label} after {self.steps} steps\")\n        return False\n\nwith Timer(\"load\") as t:\n    for _ in range(3):\n        t.steps += 1\n\ntry:\n    with Timer(\"failing load\") as t:\n        raise ValueError(\"boom\")\nexcept ValueError as e:\n    print(\"propagated:\", e)",
   note: '`__exit__` runs on both paths, and returning False lets the exception propagate. Returning True would swallow it — the context-manager equivalent of `except: pass`.' }
],
body: [
 { h: 'The dunders worth knowing', html:
   '<table><thead><tr><th>Dunder</th><th>Powers</th></tr></thead><tbody><tr><td><code>__init__</code></td><td>Construction</td></tr><tr><td><code>__repr__</code> / <code>__str__</code></td><td>Debugging / display</td></tr><tr><td><code>__eq__</code> + <code>__hash__</code></td><td>Equality, sets, dict keys</td></tr><tr><td><code>__len__</code></td><td><code>len()</code>, and truthiness</td></tr><tr><td><code>__getitem__</code></td><td>Indexing and slicing</td></tr><tr><td><code>__contains__</code></td><td><code>in</code></td></tr><tr><td><code>__iter__</code></td><td><code>for</code>, unpacking, <code>list()</code></td></tr><tr><td><code>__lt__</code></td><td><code>sorted</code>, <code>min</code>, <code>max</code></td></tr><tr><td><code>__enter__</code> / <code>__exit__</code></td><td><code>with</code></td></tr><tr><td><code>__call__</code></td><td>Making an instance callable</td></tr></tbody></table>' },
 { h: 'The equality and hashing contract', html:
   '<ul><li>If <code>a == b</code> then <code>hash(a) == hash(b)</code>. The reverse need not hold.</li><li>Defining <code>__eq__</code> sets <code>__hash__</code> to None unless you define it too.</li><li>Hash on the same fields you compare on, as a tuple.</li><li>Never hash on a mutable field — the object would move buckets and become unfindable.</li></ul>' },
 { h: 'Do not overdo it', html:
   '<p>Implement the dunders that make your object work naturally with Python. Overloading arithmetic on a domain object that is not a number makes code cryptic — <code>report + report</code> means nothing to a reader.</p>' }
],
call: '"Dunders are how objects hook into the language — len, in, iteration and sorting are all protocols. The contract that catches people is that defining __eq__ without __hash__ makes the object unhashable, because Python assumes the default hash no longer matches your equality."',
warn: 'Defining `__eq__` silently removes hashability. The class works fine until someone puts it in a set or uses it as a dict key, and then fails with an unhashable-type error far from the class definition.',
qf: [
 ['What is the difference between __repr__ and __str__?', '__repr__ is unambiguous, for developers; __str__ is for display. Containers use __repr__.'],
 ['What happens if you define __eq__ without __hash__?', 'The object becomes unhashable and cannot go in a set or be a dict key.'],
 ['What is the hashing contract?', 'Equal objects must hash equal — hash on the same fields you compare on.'],
 ['Which dunder makes `in` work?', '__contains__, falling back to __iter__ if absent.'],
 ['How many comparison dunders do you need for sorting?', 'Just __lt__ — Python derives the rest by swapping operands.'],
 ['What determines truthiness without __bool__?', '__len__ — zero length is falsy.'],
 ['What does returning True from __exit__ do?', 'Swallows the exception, which is usually wrong.']
]});

M.push({
code: 'O4', track: 'Tier 4 · Objects',
title: 'Inheritance, super() and the MRO',
sub: 'What a subclass inherits, how super() cooperates, and where the method actually comes from.',
lede: 'Inheritance says a subclass <em class="hl">is a</em> kind of its parent and reuses its behaviour. The mechanics worth knowing are the lookup order — the method resolution order — and <code>super()</code>, which does not simply mean "the parent" but "the next class in the MRO".',
ex: [
 { t: 'Overriding and extending',
   code: "class Loader:\n    def __init__(self, table):\n        self.table = table\n\n    def load(self, rows):\n        return f\"loaded {len(rows)} into {self.table}\"\n\nclass ValidatingLoader(Loader):\n    def load(self, rows):\n        clean = [r for r in rows if r.get(\"amount\") is not None]\n        base = super().load(clean)              # extend, do not replace\n        return f\"{base} (dropped {len(rows) - len(clean)})\"\n\nrows = [{\"amount\": 1}, {\"amount\": None}, {\"amount\": 3}]\nprint(Loader(\"txns\").load(rows))\nprint(ValidatingLoader(\"txns\").load(rows))",
   note: '`super().load(clean)` calls the parent implementation and builds on it. Overriding without calling super replaces the behaviour entirely — both are valid, and which you want is a design decision you should be able to state.' },
 { t: 'super() in __init__ is the common case',
   code: "class Job:\n    def __init__(self, name):\n        self.name = name\n        self.attempts = 0\n\nclass RetryingJob(Job):\n    def __init__(self, name, max_attempts):\n        super().__init__(name)                  # parent sets name and attempts\n        self.max_attempts = max_attempts\n\n    def __repr__(self):\n        return f\"RetryingJob({self.name!r}, {self.attempts}/{self.max_attempts})\"\n\nj = RetryingJob(\"silver\", 3)\nprint(j)\nprint(\"inherited attribute:\", j.attempts)",
   note: 'Forgetting `super().__init__()` is the most common inheritance bug: the parent never runs, so half the attributes never exist and the failure appears later as an AttributeError.' },
 { t: 'The MRO decides where a method comes from',
   code: "class Base:\n    def who(self):\n        return \"Base\"\n\nclass Left(Base):\n    def who(self):\n        return \"Left -> \" + super().who()\n\nclass Right(Base):\n    def who(self):\n        return \"Right -> \" + super().who()\n\nclass Both(Left, Right):\n    pass\n\nprint(Both().who())\nprint()\nprint(\"Both, Left, Right, Base  <- the order Python searches\")",
   note: 'The chain goes Left then Right then Base, not Left straight to Base. `super()` means "the next class in the MRO", which is why cooperative multiple inheritance works at all — and why it is confusing.' },
 { t: 'isinstance follows the chain',
   code: "class Error(Exception): pass\nclass LoadError(Error): pass\nclass SchemaError(LoadError): pass\n\ne = SchemaError(\"column missing\")\nprint(\"SchemaError:\", isinstance(e, SchemaError))\nprint(\"LoadError:  \", isinstance(e, LoadError))\nprint(\"Error:      \", isinstance(e, Error))\nprint(\"Exception:  \", isinstance(e, Exception))\n\nfor exc in [SchemaError(\"s\"), LoadError(\"l\"), Error(\"e\")]:\n    try:\n        raise exc\n    except SchemaError:\n        print(\"caught as SchemaError\")\n    except LoadError:\n        print(\"caught as LoadError\")\n    except Error:\n        print(\"caught as Error\")",
   note: 'A single object is an instance of every class in its chain, which is exactly what makes an exception hierarchy useful: catch the specific type when you can handle it specifically, the base type when you cannot.' },
 { t: 'Depth is a cost',
   code: "class A:\n    def process(self): return \"A\"\nclass B(A):\n    def process(self): return \"B -> \" + super().process()\nclass C(B):\n    def process(self): return \"C -> \" + super().process()\nclass D(C):\n    def process(self): return \"D -> \" + super().process()\n\nprint(D().process())\nprint()\nprint(\"to understand D.process you must read four classes\")",
   note: 'Every level of inheritance is a file a reader must open to understand one call. Two levels is usually fine; four is a design that will be misread. This is the argument that leads directly into composition.' }
],
body: [
 { h: 'What super() actually means', html:
   '<p>Not "my parent" but <em class="hl">"the next class in the MRO after me"</em>. With single inheritance those coincide, which is why the distinction only surfaces with multiple inheritance — and then surprises people.</p><div class="pre">class Both(Left, Right)\n\nMRO:  Both -> Left -> Right -> Base -> object\n\nLeft.who()\'s super() is RIGHT, not Base.</div>' },
 { h: 'The rules of thumb', html:
   '<ul><li><strong>Always call <code>super().__init__()</code></strong> unless you deliberately mean not to.</li><li><strong>Keep hierarchies shallow.</strong> Two levels is usually the limit before readability suffers.</li><li><strong>Inherit for "is a", not for reuse.</strong> Wanting a method is not a reason to inherit — that is composition.</li><li><strong>Avoid multiple inheritance</strong> except for genuine mixins with no state.</li></ul>' },
 { h: 'Where inheritance genuinely wins', html:
   '<p>Exception hierarchies — as above — are the clearest case, because catching a base type is exactly the behaviour you want. Framework base classes are the other: subclassing an ORM model or a test case is inheritance doing its job.</p>' }
],
call: '"super() means the next class in the MRO rather than the parent, which only matters with multiple inheritance but matters a lot there. I keep hierarchies to about two levels, because every extra level is another file someone has to read to understand one method call."',
warn: 'Forgetting `super().__init__()` means the parent never initialises, so attributes it was supposed to set simply do not exist. The failure appears later as an AttributeError in an unrelated method.',
qf: [
 ['What does super() refer to?', 'The next class in the MRO, which is the parent only under single inheritance.'],
 ['What is the most common inheritance bug?', 'Forgetting super().__init__(), so parent attributes are never set.'],
 ['What is the MRO?', 'The order Python searches classes for an attribute — left to right, depth-aware.'],
 ['Why is a deep hierarchy a problem?', 'Understanding one call requires reading every level.'],
 ['When is inheritance clearly right?', 'Exception hierarchies and framework base classes — genuine "is a" relationships.'],
 ['What does isinstance check?', "Whether the object's class chain contains the given class."]
]});

M.push({
code: 'O5', track: 'Tier 4 · Objects',
title: 'Composition over inheritance',
sub: 'Wanting a method is not a reason to inherit. Hold the object instead.',
lede: 'Inheritance couples a subclass to its parent’s entire surface, permanently. Composition gives your object a reference to another object and delegates — more typing, far less coupling, and it can be swapped at runtime, which is what makes it testable.',
ex: [
 { t: 'The same job, both ways',
   code: "class Writer:\n    def write(self, rows):\n        return f\"wrote {len(rows)} rows\"\n\n# inheritance: Pipeline IS a Writer\nclass InheritedPipeline(Writer):\n    def run(self, rows):\n        clean = [r for r in rows if r]\n        return self.write(clean)\n\n# composition: Pipeline HAS a Writer\nclass ComposedPipeline:\n    def __init__(self, writer):\n        self.writer = writer\n    def run(self, rows):\n        clean = [r for r in rows if r]\n        return self.writer.write(clean)\n\nrows = [{\"a\": 1}, None, {\"a\": 2}]\nprint(\"inherited:\", InheritedPipeline().run(rows))\nprint(\"composed: \", ComposedPipeline(Writer()).run(rows))",
   note: 'Identical output. The difference is that `ComposedPipeline` takes its writer as an argument — which is what the next example exploits and inheritance cannot.' },
 { t: 'Composition makes it testable and swappable',
   code: "class Writer:\n    def write(self, rows):\n        return f\"wrote {len(rows)} rows to the warehouse\"\n\nclass FakeWriter:\n    def __init__(self):\n        self.received = []\n    def write(self, rows):\n        self.received = list(rows)\n        return f\"captured {len(rows)} rows\"\n\nclass Pipeline:\n    def __init__(self, writer):\n        self.writer = writer\n    def run(self, rows):\n        return self.writer.write([r for r in rows if r])\n\nrows = [{\"a\": 1}, None, {\"a\": 2}]\nprint(\"production:\", Pipeline(Writer()).run(rows))\n\nfake = FakeWriter()\nprint(\"under test:\", Pipeline(fake).run(rows))\nprint(\"test can assert on:\", fake.received)",
   note: 'The fake needs no inheritance, no framework and no patching — just the same method name. Swapping the collaborator is the entire technique, and it is why composition is the default in testable code.' },
 { t: 'Inheritance couples you to the whole surface',
   code: "class Repository:\n    def __init__(self):\n        self._rows = []\n    def add(self, row):\n        self._rows.append(row)\n    def clear(self):\n        self._rows = []\n    def all(self):\n        return list(self._rows)\n\nclass AppendOnlyLog(Repository):\n    pass\n\nlog = AppendOnlyLog()\nlog.add({\"id\": \"t1\"})\nlog.clear()                    # inherited — and it should NOT exist here\nprint(\"append-only log was cleared:\", log.all())\n\nclass SafeLog:\n    def __init__(self):\n        self._repo = Repository()\n    def add(self, row):\n        self._repo.add(row)\n    def all(self):\n        return self._repo.all()\n\nsafe = SafeLog()\nsafe.add({\"id\": \"t1\"})\nprint(\"no clear() to call:\", hasattr(safe, \"clear\"), safe.all())",
   note: 'The subclass inherited a method that violates its own contract, and there is no way to remove it. Composition exposes only what you choose — which is the real argument, not style preference.' },
 { t: 'Composing behaviour from small pieces',
   code: "class UpperCase:\n    def apply(self, row):\n        return {k: (v.upper() if isinstance(v, str) else v) for k, v in row.items()}\n\nclass AddBand:\n    def apply(self, row):\n        return dict(row, band=\"large\" if row[\"amount\"] >= 100 else \"small\")\n\nclass Pipeline:\n    def __init__(self, steps):\n        self.steps = steps\n    def run(self, row):\n        for step in self.steps:\n            row = step.apply(row)\n        return row\n\np = Pipeline([UpperCase(), AddBand()])\nprint(p.run({\"wallet\": \"w-1\", \"amount\": 250}))\n\np2 = Pipeline([AddBand()])\nprint(p2.run({\"wallet\": \"w-1\", \"amount\": 50}))",
   note: 'Steps are a list you can reorder, extend or shorten at runtime. Expressing the same thing with inheritance would need a class per combination, which is the combinatorial explosion composition exists to avoid.' }
],
body: [
 { h: 'Choosing', html:
   '<table><thead><tr><th>Use inheritance</th><th>Use composition</th></tr></thead><tbody><tr><td>A genuine "is a" relationship</td><td>A "has a" or "uses a" relationship</td></tr><tr><td>Exception hierarchies</td><td>Anything you want to swap in tests</td></tr><tr><td>A framework requires it</td><td>Behaviour assembled from parts</td></tr><tr><td>The full parent surface is correct</td><td>You want only some of it</td></tr></tbody></table>' },
 { h: 'The test that settles it', html:
   '<p>Ask whether every public method of the parent makes sense on the child. If even one does not — like <code>clear()</code> on an append-only log — inheritance is wrong, because you cannot take it away.</p>' },
 { h: 'Dependency injection is just composition', html:
   '<p>Passing a collaborator into <code>__init__</code> rather than constructing it inside is the whole of dependency injection. It is why the composed pipeline is testable with a five-line fake and the inherited one is not.</p>' }
],
call: '"I ask whether every public method of the parent makes sense on the child — if one does not, inheritance is wrong, because you cannot remove it. Composition means passing the collaborator in, which is also what makes it testable: a fake with the same method name and no framework at all."',
warn: 'A subclass inherits every public method of its parent, including ones that contradict its own contract. An append-only log that inherits `clear()` cannot remove it, and nothing in the subclass warns a caller.',
qf: [
 ['What is composition?', 'Holding a reference to another object and delegating, rather than inheriting from it.'],
 ['What test decides between them?', 'Whether every public method of the parent makes sense on the child.'],
 ['Why is composition more testable?', 'The collaborator is passed in, so a test can substitute a fake with the same method names.'],
 ['What is the cost of composition?', 'More typing — you write the delegating methods yourself.'],
 ['What is dependency injection?', 'Passing collaborators into __init__ instead of constructing them inside — composition by another name.'],
 ['When does inheritance still win?', 'Genuine "is a" relationships, exception hierarchies, and framework base classes.']
]});

M.push({
code: 'O6', track: 'Tier 4 · Objects',
title: 'Properties and encapsulation',
sub: 'A method that looks like an attribute — so you can add validation without changing callers.',
lede: 'Python has no private attributes and does not need them. The convention is a single underscore, and <code>@property</code> is the escape hatch that lets a plain attribute become a computed or validated one <em class="hl">without breaking any code that already uses it</em>.',
ex: [
 { t: 'Start with a plain attribute',
   code: "class Transaction:\n    def __init__(self, amount):\n        self.amount = amount\n\nt = Transaction(100.0)\nprint(\"read:\", t.amount)\nt.amount = -50.0\nprint(\"nothing stopped a negative amount:\", t.amount)",
   note: 'A plain attribute is the right starting point — do not write getters and setters preemptively. The question is what happens when you later need validation, and in Python the answer is that you can add it without touching a single caller.' },
 { t: 'Add a property later; callers do not change',
   code: "class Transaction:\n    def __init__(self, amount):\n        self.amount = amount          # goes through the setter below\n\n    @property\n    def amount(self):\n        return self._amount\n\n    @amount.setter\n    def amount(self, value):\n        if value < 0:\n            raise ValueError(f\"amount cannot be negative: {value}\")\n        self._amount = float(value)\n\nt = Transaction(100)\nprint(\"read the same way:\", t.amount)\nt.amount = 250\nprint(\"written the same way:\", t.amount)\ntry:\n    t.amount = -50\nexcept ValueError as e:\n    print(\"now rejected:\", e)",
   note: 'The public interface is identical to the previous example — `t.amount` for reading and writing — but validation now runs. This is why Python does not need getters up front, and it is the whole argument for properties.' },
 { t: 'A computed property',
   code: "class Batch:\n    def __init__(self, rows):\n        self.rows = rows\n\n    @property\n    def total(self):\n        return sum(r[\"amount\"] for r in self.rows)\n\n    @property\n    def is_empty(self):\n        return len(self.rows) == 0\n\nb = Batch([{\"amount\": 100.0}, {\"amount\": 250.0}])\nprint(\"total:\", b.total)\n\nb.rows.append({\"amount\": 50.0})\nprint(\"stays correct after a change:\", b.total)\nprint(\"empty batch:\", Batch([]).is_empty)",
   note: 'A computed property cannot go stale, because it is calculated on access. Storing `self.total` in `__init__` would be wrong the moment `rows` changed — and nothing would report it.' },
 { t: 'Read-only by omitting the setter',
   code: "class Run:\n    def __init__(self, run_id):\n        self._run_id = run_id\n\n    @property\n    def run_id(self):\n        return self._run_id\n\nr = Run(\"run-2026-02-01\")\nprint(\"readable:\", r.run_id)\ntry:\n    r.run_id = \"run-tampered\"\nexcept AttributeError as e:\n    print(\"immutable:\", e)",
   note: 'Omitting the setter makes the attribute read-only. Useful for identifiers and anything set once at construction — and much clearer than a naming convention alone.' },
 { t: 'The underscore convention',
   code: "class Loader:\n    def __init__(self, table):\n        self.table = table            # public: callers may use it\n        self._conn = \"internal\"       # private by convention\n        self._cache = {}\n\n    def load(self, rows):\n        return f\"{len(rows)} -> {self.table}\"\n\nl = Loader(\"txns\")\nprint(\"public:\", l.table)\nprint(\"still reachable:\", l._conn)\nprint(\"nothing is enforced — the underscore is a message, not a lock\")\nprint(\"attributes:\", sorted(l.__dict__))",
   note: 'A single underscore means "not part of the interface, may change". Python trusts you rather than enforcing it, and in practice that trust works because the convention is universal.' }
],
body: [
 { h: 'The naming convention', html:
   '<table><thead><tr><th>Name</th><th>Means</th><th>Enforced?</th></tr></thead><tbody><tr><td><code>x</code></td><td>Public interface</td><td>n/a</td></tr><tr><td><code>_x</code></td><td>Internal; may change without notice</td><td><b>No</b> — convention</td></tr><tr><td><code>__x</code></td><td>Name-mangled to avoid subclass clashes</td><td>Partly — still reachable</td></tr><tr><td><code>__x__</code></td><td>Reserved for Python protocols</td><td>Do not invent your own</td></tr></tbody></table>' },
 { h: 'When to use a property', html:
   '<ul><li><strong>Validation</strong> on assignment.</li><li><strong>A computed value</strong> that must not go stale.</li><li><strong>Read-only</strong> attributes — omit the setter.</li><li><strong>Adding behaviour to an existing attribute</strong> without changing callers.</li></ul><p>And when not to: if a property runs an expensive query or hits the network, make it a method. Attribute syntax promises cheapness, and a property that takes two seconds violates the reader’s expectation.</p>' },
 { h: 'Why Python does not have private', html:
   '<p>The design position is that the developer is responsible. Encapsulation is communicated by naming, not enforced by the language, and the practical result is that debugging and testing are far easier — you can always reach in when you genuinely need to.</p>' }
],
call: '"Python has no private attributes, so I start with a plain attribute and add a property later if it needs validation — the public interface is identical, so no caller changes. And I keep properties cheap, because attribute syntax promises cheapness and a property that hits the network breaks that."',
warn: 'A property that performs an expensive operation looks like a free attribute read. Someone puts it in a loop, and a query runs a thousand times — the syntax gave no hint that anything was happening.',
qf: [
 ['Does Python have private attributes?', 'No — a single underscore is a convention meaning "internal", not an enforcement.'],
 ['What does @property do?', 'Makes a method callable as an attribute, so validation or computation can be added without changing callers.'],
 ['How do you make an attribute read-only?', 'Define the property getter and omit the setter.'],
 ['Why not write getters and setters up front?', 'Because a plain attribute can become a property later with no change to callers.'],
 ['When should a property be a method instead?', 'When it is expensive — attribute syntax implies a cheap read.'],
 ['What does a double underscore prefix do?', 'Name mangling, to avoid clashes in subclasses. It is still reachable.']
]});

M.push({
code: 'O7', track: 'Tier 4 · Objects',
title: 'dataclasses, namedtuple and Enum',
sub: 'Three ways to stop writing __init__ and __repr__ by hand.',
lede: 'Most classes in a pipeline are records: a few fields, equality, a readable repr, and no behaviour. Writing that by hand is twenty lines of boilerplate you will get subtly wrong. Three tools generate it, and choosing between them is about mutability and intent.',
ex: [
 { t: 'The boilerplate, and what replaces it',
   code: "from dataclasses import dataclass\n\nclass Manual:\n    def __init__(self, txn_id, amount, wallet=\"unknown\"):\n        self.txn_id = txn_id\n        self.amount = amount\n        self.wallet = wallet\n    def __repr__(self):\n        return f\"Manual(txn_id={self.txn_id!r}, amount={self.amount}, wallet={self.wallet!r})\"\n    def __eq__(self, other):\n        return (self.txn_id, self.amount, self.wallet) == (other.txn_id, other.amount, other.wallet)\n\n@dataclass\nclass Txn:\n    txn_id: str\n    amount: float\n    wallet: str = \"unknown\"\n\nprint(Manual(\"t1\", 100.0))\nprint(Txn(\"t1\", 100.0))\nprint(\"equality for free:\", Txn(\"t1\", 100.0) == Txn(\"t1\", 100.0))\nprint(\"defaults work:\", Txn(\"t2\", 50.0, \"w-1\"))",
   note: 'Twelve lines become four, and the generated versions cannot drift out of sync with the fields. Note the annotations are what declare the fields — without them the dataclass has nothing to build from.' },
 { t: 'Dataclasses are mutable and therefore unhashable',
   code: "from dataclasses import dataclass\n\n@dataclass\nclass Txn:\n    txn_id: str\n    amount: float\n\nt = Txn(\"t1\", 100.0)\nt.amount = 250.0\nprint(\"mutable:\", t)\n\ntry:\n    {t}\nexcept TypeError as e:\n    print(\"unhashable:\", e)\nprint(\"because __eq__ was generated but __hash__ was not — same as any class\")",
   note: 'Defining equality without hashing is exactly the O3 contract, applied by the decorator. A frozen dataclass gets a hash and becomes usable as a dict key; a mutable one deliberately does not.' },
 { t: 'namedtuple for immutable records',
   code: "from collections import namedtuple\n\nPoint = namedtuple(\"Point\", \"wallet amount\")\n\np = Point(\"w-1\", 100.0)\nprint(\"by name:\", p.wallet, p.amount)\nprint(\"repr:\", p)\n\nq = Point(\"w-1\", 100.0)\nprint(\"equal:\", p == q)\nprint(\"hashable:\", len({p, q}))\n\nwallet, amount = p\nprint(\"unpacks like a tuple:\", wallet, amount)",
   note: 'A namedtuple is a tuple with names: immutable, hashable, unpackable, and comparable. That makes it the right choice for a dict key or a set member, where a dataclass would refuse.' },
 { t: 'Enum for a closed set of values',
   code: "from enum import Enum\n\nclass Status(Enum):\n    PENDING = \"pending\"\n    LOADED = \"loaded\"\n    REJECTED = \"rejected\"\n\ns = Status.LOADED\nprint(\"member:\", s, \"| name:\", s.name, \"| value:\", s.value)\nprint(\"identity comparison:\", s is Status.LOADED)\n\ndef describe(status):\n    if status is Status.REJECTED:\n        return \"needs review\"\n    return \"fine\"\n\nprint(describe(Status.REJECTED))\nprint(describe(Status.PENDING))",
   note: 'The alternative is bare strings, and a typo in `"rejcted"` fails silently as an unmatched branch. An Enum turns that into an AttributeError at the point of the typo — which is the entire reason to use one.' },
 { t: 'Choosing between them, by behaviour',
   code: "from dataclasses import dataclass\nfrom collections import namedtuple\n\n@dataclass\nclass Mutable:\n    x: int\n\nImmutable = namedtuple(\"Immutable\", \"x\")\n\nm = Mutable(1)\nm.x = 99\nprint(\"dataclass mutable:\", m)\n\ni = Immutable(1)\ntry:\n    i.x = 99\nexcept AttributeError as e:\n    print(\"namedtuple immutable:\", e)\n\nprint(\"dict key: namedtuple yes ->\", {Immutable(1): \"ok\"}[Immutable(1)])\ntry:\n    {Mutable(1): \"no\"}\nexcept TypeError:\n    print(\"dict key: dataclass no\")",
   note: 'The decision is mutability. If the record will change after construction, use a dataclass; if it is a value that identifies something — a key, a coordinate, a composite id — use a namedtuple.' }
],
body: [
 { h: 'Choosing', html:
   '<table><thead><tr><th></th><th>dataclass</th><th>namedtuple</th><th>Enum</th></tr></thead><tbody><tr><td>Mutable</td><td><b>Yes</b></td><td>No</td><td>n/a</td></tr><tr><td>Hashable</td><td>No (unless frozen)</td><td><b>Yes</b></td><td>Yes</td></tr><tr><td>Unpackable</td><td>No</td><td><b>Yes</b></td><td>No</td></tr><tr><td>Defaults</td><td>Yes</td><td>Yes</td><td>n/a</td></tr><tr><td>Right for</td><td>Records you modify</td><td>Keys and value objects</td><td>A closed set of options</td></tr></tbody></table>' },
 { h: 'Where they show up in a pipeline', html:
   '<ul><li><strong>dataclass</strong> — a parsed row you enrich as it moves through stages.</li><li><strong>namedtuple</strong> — a composite key like <code>(wallet, date)</code> used in a dict.</li><li><strong>Enum</strong> — load modes, statuses, severities: anything with a fixed set of valid values.</li><li><strong>A plain dict</strong> — still right when the shape is dynamic or comes straight from JSON.</li></ul>' },
 { h: 'The honest caveat', html:
   '<p>Do not convert every dict into a dataclass. Rows arriving from JSON or a database are naturally dict-shaped, and forcing them into typed records at the boundary costs allocation and code for benefit you may not need. Use them where the shape is fixed and the type genuinely helps a reader.</p>' }
],
call: '"A dataclass generates __init__, __repr__ and __eq__ from annotations, and it is mutable so it is deliberately unhashable — the same eq-without-hash rule as any class. When I need a dict key I reach for a namedtuple instead, and for a closed set of values an Enum, because a bare string typo fails silently as an unmatched branch."',
warn: 'Using bare strings for statuses means a typo like `"rejcted"` never matches any branch and never raises. The row silently takes the default path — an Enum turns the same typo into an AttributeError at the line that made it.',
qf: [
 ['What does @dataclass generate?', '__init__, __repr__ and __eq__ from the annotated fields.'],
 ['Why is a dataclass unhashable by default?', 'It generates __eq__ without __hash__, because it is mutable.'],
 ['When do you need a namedtuple instead?', 'When the record must be immutable, hashable, or used as a dict key.'],
 ['What does an Enum prevent?', 'Typos in a closed set of values failing silently as unmatched branches.'],
 ['How do you make a dataclass hashable?', 'Freeze it — frozen=True makes it immutable and gives it a hash.'],
 ['When is a plain dict still right?', 'When the shape is dynamic or arrives from JSON, and typing it adds no value.']
]});

M.push({
code: 'T1', track: 'Tier 5 · Iteration',
title: 'The iterator protocol',
sub: 'What `for` actually does — and why the same loop works on lists, files, dicts and your own objects.',
lede: 'A <code>for</code> loop is not built into the types it iterates. It calls <code>iter()</code> to get an iterator, then <code>next()</code> repeatedly until <code>StopIteration</code>. Everything iterable in Python — lists, dicts, files, generators, your own classes — works because it implements that two-method contract.',
ex: [
 { t: 'The loop, unrolled by hand',
   code: "rows = [{\"id\": \"t1\"}, {\"id\": \"t2\"}]\n\nit = iter(rows)\nwhile True:\n    try:\n        row = next(it)\n    except StopIteration:\n        break\n    print(\"got\", row[\"id\"])\n\nprint()\nprint(\"that IS the for loop — nothing more\")",
   note: 'Every `for` in Python is this. Once you have seen it unrolled, generators, files and custom iterables stop being separate features and become one contract implemented three ways.' },
 { t: 'Iterable versus iterator',
   code: "rows = [1, 2, 3]\n\nprint(\"a list is iterable:\", hasattr(rows, \"__iter__\"))\nit = iter(rows)\nprint(\"iter() gives an iterator:\", type(it).__name__)\n\nprint(\"first:\", next(it))\nprint(\"rest: \", list(it), \"<- the iterator is consumed\")\nprint(\"but the list is fine:\", rows)\n\na, b = iter(rows), iter(rows)\nprint(\"two independent iterators:\", next(a), next(b))",
   note: 'An <em>iterable</em> can produce iterators; an <em>iterator</em> is a single-use cursor. A list is iterable and can hand out many iterators; a generator IS an iterator, which is exactly why it exhausts after one pass.' },
 { t: 'Implementing the protocol yourself',
   code: "class Countdown:\n    def __init__(self, start):\n        self.start = start\n\n    def __iter__(self):\n        n = self.start\n        while n > 0:\n            yield n\n            n -= 1\n\nc = Countdown(3)\nprint(\"first pass: \", list(c))\nprint(\"second pass:\", list(c), \"<- re-iterable\")\n\nfor n in Countdown(2):\n    print(\"tick\", n)",
   note: 'Making `__iter__` a generator function is the easiest correct implementation: each call creates a fresh generator, so the object is re-iterable. This is what you almost always want.' },
 { t: 'The self-returning iterator, and its cost',
   code: "class Cursor:\n    def __init__(self, rows):\n        self.rows = rows\n        self.i = 0\n\n    def __iter__(self):\n        return self                # I am my own iterator\n\n    def __next__(self):\n        if self.i >= len(self.rows):\n            raise StopIteration\n        row = self.rows[self.i]\n        self.i += 1\n        return row\n\nc = Cursor([1, 2, 3])\nprint(\"first pass: \", list(c))\nprint(\"second pass:\", list(c), \"<- exhausted, like a generator\")",
   note: 'Returning `self` makes the object single-use, because there is only one position counter. That is correct for something genuinely stream-like — a file, a network cursor — and wrong for a collection.' },
 { t: 'Unpacking and starred assignment use the same protocol',
   code: "def rows():\n    yield {\"id\": \"t1\"}\n    yield {\"id\": \"t2\"}\n    yield {\"id\": \"t3\"}\n\nfirst, *rest = rows()\nprint(\"first:\", first[\"id\"], \" rest:\", [r[\"id\"] for r in rest])\n\na, b, c = \"xyz\"\nprint(\"strings too:\", a, b, c)\n\ndef pair():\n    yield 1\n    yield 2\nx, y = pair()\nprint(\"from a generator:\", x, y)",
   note: 'Unpacking, `zip`, `sum`, `sorted`, `in`, `min` — all of them go through `iter()`. Implementing the protocol once makes your object work with the entire standard library rather than just `for`.' }
],
body: [
 { h: 'The contract', html:
   '<div class="pre code">iter(x)   ->  calls x.__iter__()   returns an ITERATOR\nnext(it)  ->  calls it.__next__()  returns the next value\n                                   or raises StopIteration</div><table><thead><tr><th></th><th>Iterable</th><th>Iterator</th></tr></thead><tbody><tr><td>Has</td><td><code>__iter__</code></td><td><code>__iter__</code> and <code>__next__</code></td></tr><tr><td>Re-usable</td><td>Usually yes</td><td><b>No</b> — single pass</td></tr><tr><td>Examples</td><td>list, dict, str, range</td><td>generator, file, map, filter</td></tr></tbody></table>' },
 { h: 'Which implementation to choose', html:
   '<ul><li><strong><code>__iter__</code> as a generator function</strong> — the default. Re-iterable, short, hard to get wrong.</li><li><strong><code>__iter__</code> returning <code>self</code> plus <code>__next__</code></strong> — only for genuinely single-pass sources like a file handle or a network cursor.</li><li><strong><code>__getitem__</code> alone</strong> — legacy fallback; Python will iterate integers from 0 until IndexError. Do not rely on it.</li></ul>' },
 { h: 'Why this matters in a pipeline', html:
   '<p>A function that accepts "rows" should work whether it is handed a list, a generator or a database cursor. Writing against the iterator protocol rather than against <code>list</code> is what makes a transform reusable — and it is why <code>len(rows)</code> inside a transform quietly forces the caller to materialise everything.</p>' }
],
call: '"A for loop is just iter() then next() until StopIteration, so anything implementing that contract works with the whole standard library, not only for. I make __iter__ a generator function so the object is re-iterable — returning self is correct only for genuinely single-pass sources like a file cursor."',
warn: 'Calling `len(rows)` inside a transform forces the caller to pass a list. The function silently loses the ability to accept a generator, and the cost lands on whoever streams a large source into it.',
qf: [
 ['What does a for loop actually do?', 'Calls iter() to get an iterator, then next() repeatedly until StopIteration.'],
 ['Iterable versus iterator?', 'An iterable can produce iterators; an iterator is a single-use cursor with __next__.'],
 ['Why does a generator exhaust after one pass?', 'A generator is an iterator — there is one position, and it only moves forward.'],
 ['What is the easiest correct __iter__?', 'A generator function, so each call returns a fresh iterator and the object stays re-iterable.'],
 ['When should __iter__ return self?', 'Only for genuinely single-pass sources like a file handle or network cursor.'],
 ['Why avoid len() inside a transform?', 'It forces the input to be a list, so the function can no longer accept a generator.']
]});

M.push({
code: 'T2', track: 'Tier 5 · Iteration',
title: 'itertools in anger',
sub: 'The functions that replace hand-written loops — and keep the data streaming.',
lede: 'Most loops that build an intermediate list have a lazy equivalent in <code>itertools</code>. The value is not brevity: it is that the whole chain stays streaming, so memory stays flat regardless of input size.',
ex: [
 { t: 'islice, chain and the infinite source',
   code: "from itertools import count, islice, chain\n\ndef ids():\n    for n in count(1):\n        yield f\"t-{n:04d}\"\n\nprint(\"first three:\", list(islice(ids(), 3)))\nprint(\"a window:   \", list(islice(ids(), 5, 8)))\n\nbatch_a = [{\"id\": \"a1\"}, {\"id\": \"a2\"}]\nbatch_b = [{\"id\": \"b1\"}]\nmerged = chain(batch_a, batch_b)\nprint(\"chained:\", [r[\"id\"] for r in merged])",
   note: '`count` never ends and `islice` bounds it without materialising. `chain` concatenates iterables lazily — the alternative, `list(a) + list(b)`, builds both in memory to produce a third.' },
 { t: 'accumulate for running totals',
   code: "from itertools import accumulate\n\namounts = [100.0, 250.0, 75.0, 900.0]\n\nprint(\"running total:\", list(accumulate(amounts)))\nprint(\"running max:  \", list(accumulate(amounts, lambda a, b: a if a > b else b)))\n\nbalance = 1000.0\nprint(\"balance over time:\", [balance - t for t in accumulate(amounts)])",
   note: 'A running aggregate with no accumulator variable and no mutation. The second form takes any two-argument function, which covers running max, running min, and compounding.' },
 { t: 'groupby needs sorted input — and that is the trap',
   code: "from itertools import groupby\n\nrows = [\n    {\"wallet\": \"w-1\", \"amount\": 100},\n    {\"wallet\": \"w-2\", \"amount\": 250},\n    {\"wallet\": \"w-1\", \"amount\": 75},\n]\n\nprint(\"UNSORTED input:\")\nfor key, group in groupby(rows, key=lambda r: r[\"wallet\"]):\n    print(f\"  {key}: {len(list(group))} row(s)\")\n\nprint()\nprint(\"sorted first:\")\nrows.sort(key=lambda r: r[\"wallet\"])\nfor key, group in groupby(rows, key=lambda r: r[\"wallet\"]):\n    print(f\"  {key}: {len(list(group))} row(s)\")",
   note: 'w-1 appears twice in the first output because groupby only groups *consecutive* runs. It is not SQL GROUP BY. Sort by the same key first, or use a dict — which is usually simpler and does not need the sort.' },
 { t: 'takewhile and dropwhile stop at the first failure',
   code: "from itertools import takewhile, dropwhile\n\nreadings = [1, 2, 3, 10, 2, 1]\n\nprint(\"takewhile <5:\", list(takewhile(lambda x: x < 5, readings)))\nprint(\"dropwhile <5:\", list(dropwhile(lambda x: x < 5, readings)))\nprint(\"filter    <5:\", list(filter(lambda x: x < 5, readings)))\nprint()\nprint(\"takewhile STOPS at 10; filter keeps scanning and removes it\")",
   note: 'The distinction matters on a sorted stream: `takewhile` can stop reading early, which is a real saving on a large source. `filter` must examine every element.' },
 { t: 'zip_longest and the silent truncation zip causes',
   code: "from itertools import zip_longest\n\nids = [\"t1\", \"t2\", \"t3\"]\namounts = [100.0, 250.0]\n\nprint(\"zip:        \", list(zip(ids, amounts)))\nprint(\"zip_longest:\", list(zip_longest(ids, amounts, fillvalue=0.0)))\nprint()\nprint(\"zip silently dropped t3 — no error, no warning\")",
   note: 'This is a genuine data-loss bug: `zip` stops at the shortest input. If the two sequences are supposed to be the same length, assert it rather than trusting `zip` to tell you — it will not.' },
 { t: 'tee when you genuinely need two passes',
