   '<p>Pin versions for anything that runs unattended. <code>pandas>=2.0</code> means a minor release can change behaviour on a Tuesday with no deploy on your side. A lockfile makes the environment reproducible, which is what lets you say a failure is a code change rather than a dependency drift.</p>' }
],
call: '"I keep transforms as pure functions in their own module so they test in a second without a database, and everything that touches I/O sits at the edges. Logs carry a run id on every line, because the first thing anyone does during an incident is filter by run."',
warn: 'A secret committed to a repository is in git history permanently, even after you delete the line. Rotating the credential is the only real fix, and the cost of that at a bank is measured in days.',
qf: [
 ['Why separate transform from I/O?', 'So the transform can be unit tested with no database, network or cluster.'],
 ['Why logging rather than print?', 'Levels, timestamps, structured fields and routing — print cannot be filtered or alarmed on.'],
 ['What should every log line carry?', 'The run id, so an incident can be filtered to one run.'],
 ['Where do secrets come from?', 'The environment, injected by a secrets manager — never a committed file.'],
 ['Why os.environ["X"] over .get()?', 'It fails immediately when required configuration is missing, rather than an hour in.'],
 ['Why pin dependency versions?', 'So an upstream minor release cannot change behaviour without a deploy on your side.']
]});

M.push({
code: 'P2', track: 'Level 6 · Testing and CI', theory: true,
title: 'Testing a pipeline',
sub: 'Unit-test the transform; the rest is integration — and data quality is a third thing.',
lede: 'A pipeline nobody can test is a pipeline nobody can change. The good news is that the part worth testing hardest — the transform — is a pure function, so it needs no infrastructure at all.',
ex: [
 { t: 'Assertions you can run right here',
   code: "def clean(rows):\n    out = []\n    for r in rows:\n        if r.get(\"amount\") is None:\n            continue\n        out.append({\"id\": r[\"id\"], \"amount\": float(r[\"amount\"])})\n    return out\n\ndef test_drops_missing_amount():\n    result = clean([{\"id\": \"t1\", \"amount\": \"10\"}, {\"id\": \"t2\"}])\n    assert len(result) == 1, \"row without amount should be dropped\"\n    assert result[0][\"amount\"] == 10.0\n\ndef test_empty_input():\n    assert clean([]) == []\n\ndef test_is_pure():\n    src = [{\"id\": \"t1\", \"amount\": \"10\"}]\n    clean(src)\n    assert \"amount\" in src[0] and src[0][\"amount\"] == \"10\", \"input was mutated\"\n\nfor t in [test_drops_missing_amount, test_empty_input, test_is_pure]:\n    try:\n        t()\n        print(\"PASS\", t.__name__)\n    except AssertionError as e:\n        print(\"FAIL\", t.__name__, \"-\", e)",
   note: 'Three tests, no infrastructure, instant. The third one is the test people never write: assert the transform did not mutate its input. That is the N1 lesson turned into a gate.' },
 { t: 'The idempotency test',
   code: "def load(target, rows):\n    for r in rows:\n        target[r[\"id\"]] = r\n    return target\n\ndef test_idempotent():\n    batch = [{\"id\": \"t1\", \"amount\": 100.0}]\n    once = load({}, batch)\n    twice = load(load({}, batch), batch)\n    assert once == twice, \"running twice differs from running once\"\n\ntry:\n    test_idempotent()\n    print(\"PASS test_idempotent\")\nexcept AssertionError as e:\n    print(\"FAIL\", e)\n\ndef bad_load(target, rows):\n    for r in rows:\n        target[len(target)] = r\n    return target\n\nonce = bad_load({}, [{\"id\": \"t1\"}])\ntwice = bad_load(bad_load({}, [{\"id\": \"t1\"}]), [{\"id\": \"t1\"}])\nprint(\"append-style idempotent:\", once == twice)",
   note: 'Four lines, and it settles the question that Level 4 is entirely about. If a load claims to be idempotent, the claim should be executable — and the second half shows the test correctly failing the append version.' },
 { t: 'Data quality assertions: zero rows means pass',
   code: "rows = [\n    {\"id\": \"t1\", \"amount\": 100.0, \"wallet\": \"w-1\"},\n    {\"id\": \"t1\", \"amount\": 100.0, \"wallet\": \"w-1\"},\n    {\"id\": \"t3\", \"amount\": -5.0,  \"wallet\": \"w-2\"},\n    {\"id\": \"t4\", \"amount\": 40.0,  \"wallet\": None},\n]\n\nseen, dupes = set(), []\nfor r in rows:\n    if r[\"id\"] in seen:\n        dupes.append(r[\"id\"])\n    seen.add(r[\"id\"])\n\nnegatives = [r[\"id\"] for r in rows if r[\"amount\"] < 0]\nmissing   = [r[\"id\"] for r in rows if r[\"wallet\"] is None]\n\nfor name, failures in [(\"unique id\", dupes), (\"amount > 0\", negatives), (\"wallet not null\", missing)]:\n    status = \"PASS\" if not failures else f\"FAIL {failures}\"\n    print(f\"{name:18} {status}\")",
   note: 'Quality checks are queries with an expected answer of zero rows. The failures are the debugging output, and the same expression works in Python, SQL or dbt — which is why knowing the assertion matters more than knowing the framework.' },
 { t: 'Testing something that talks to the outside world', ref:true,
   code: "def fetch_rows(client, dt):\n    return client.query(f\"SELECT * FROM txns WHERE dt = '{dt}'\")\n\nclass FakeClient:\n    def __init__(self, rows):\n        self.rows = rows\n        self.calls = []\n    def query(self, sql):\n        self.calls.append(sql)\n        return self.rows\n\ndef test_fetch_passes_date():\n    fake = FakeClient([{\"id\": \"t1\"}])\n    rows = fetch_rows(fake, \"2026-02-01\")\n    assert rows == [{\"id\": \"t1\"}]\n    assert \"2026-02-01\" in fake.calls[0]",
   note: 'Inject the client rather than constructing it inside the function. A fake with a recorded call list tests the wiring without a database — and the fact that this is easy is a consequence of the layout in P1.' }
],
body: [
 { h: 'The three kinds of test', html:
   '<table><thead><tr><th>Kind</th><th>Tests</th><th>Needs</th></tr></thead><tbody><tr><td><b>Unit</b></td><td>Transforms, with hand-written rows</td><td>Nothing</td></tr><tr><td><b>Integration</b></td><td>Reading and writing for real</td><td>A test database or bucket</td></tr><tr><td><b>Data quality</b></td><td>The output of a real run</td><td>Runs inside the pipeline</td></tr></tbody></table><p>The third is the one that catches what the first two cannot: the code is correct and the data is wrong.</p>' },
 { h: 'What to test in a transform', html:
   '<ul><li><strong>The happy path</strong>, with a couple of representative rows.</li><li><strong>Empty input</strong> — the most common production surprise.</li><li><strong>Nulls in every nullable field.</strong></li><li><strong>Duplicates</strong>, if the transform is supposed to handle them.</li><li><strong>That the input was not mutated.</strong></li><li><strong>That running the load twice changes nothing.</strong></li></ul>' },
 { h: 'The CI gate', html:
   '<div class="pre">1  lint and type-check          ruff, mypy — seconds\n2  unit tests                   no infrastructure\n3  build and version the package\n4  deploy to a non-production environment\n5  run against a SAMPLE\n6  run data quality assertions on the output\n7  promote only if 6 passed</div><p>Step 6 is the one teams skip, and it is the difference between proving the code compiles and proving the pipeline produces correct data.</p>' }
],
call: '"The transform is a pure function, so it unit-tests in a second with no infrastructure — and the two tests I always add are that the input was not mutated and that running the load twice changes nothing. Data quality assertions are a separate layer, because the code can be correct while the data is wrong."',
warn: 'Passing CI proves the code compiles and the unit tests pass. It proves nothing about the data. Without quality assertions on real output before promotion, a schema change upstream ships cleanly and breaks the warehouse.',
qf: [
 ['What should be unit tested?', 'Pure transforms, with hand-written rows and no infrastructure.'],
 ['Which edge cases always?', 'Empty input, nulls, duplicates, and that the input was not mutated.'],
 ['How do you test code that hits a database?', 'Inject the client and pass a fake that records calls.'],
 ['How is a data quality check written?', 'As an assertion returning zero rows on success — the failures are the output.'],
 ['What CI step do teams skip?', 'Running quality assertions against real output before promoting.'],
 ['What does passing CI not prove?', 'That the data is correct — only that the code runs.']
]});

M.push({
code: 'A1', track: 'Level 7 · Concurrency', theory: true,
title: 'Threads, asyncio and processes',
sub: 'The GIL blocks CPU work, not waiting — and almost all pipeline time is waiting.',
lede: 'A job that makes two hundred API calls in sequence spends nearly all its wall-clock time doing nothing. The Global Interpreter Lock stops two threads running Python bytecode at once, which sounds fatal for concurrency and mostly is not — because the lock is <em class="hl">released while waiting on I/O</em>, and waiting is what your pipeline does.',
ex: [
 { t: 'Threads for I/O-bound work', ref:true,
   code: "from concurrent.futures import ThreadPoolExecutor\n\ndef fetch(page):\n    return http_get(f\"/txns?page={page}\")     # waits on the network\n\n# sequential: 200 pages x 200ms = 40 seconds\n# threaded:   200 pages / 10 workers = ~4 seconds\nwith ThreadPoolExecutor(max_workers=10) as pool:\n    results = list(pool.map(fetch, range(200)))\n\n# max_workers is a politeness setting as much as a speed one:\n# 200 concurrent requests will get you rate-limited or blocked.",
   note: 'The GIL is released during the network wait, so threads genuinely overlap. Ten workers is usually plenty — the limit is the source’s tolerance, not your CPU.' },
 { t: 'asyncio for the same problem, differently', ref:true,
   code: "import asyncio\n\nasync def fetch(session, page):\n    async with session.get(f\"/txns?page={page}\") as r:\n        return await r.json()\n\nasync def main():\n    async with aiohttp.ClientSession() as session:\n        tasks = [fetch(session, p) for p in range(200)]\n        return await asyncio.gather(*tasks)\n\n# The mistake that silently kills async:\n#   time.sleep(1)        <- BLOCKS the whole event loop\n#   await asyncio.sleep(1)  <- yields, other tasks proceed\n# One synchronous call in an async function serialises everything.",
   note: 'asyncio scales to thousands of concurrent waits with one thread. The trap is that a single blocking call — `requests.get`, `time.sleep`, a synchronous database driver — stops the entire loop, and the code still runs, just serially.' },
 { t: 'Processes for CPU-bound work', ref:true,
   code: "from concurrent.futures import ProcessPoolExecutor\n\ndef parse_heavy(chunk):\n    return [expensive_transform(r) for r in chunk]   # real CPU work\n\nwith ProcessPoolExecutor(max_workers=4) as pool:\n    results = list(pool.map(parse_heavy, chunks))\n\n# Each process has its own interpreter and its own GIL.\n# Cost: arguments and results are PICKLED between processes,\n# so passing large objects can cost more than the parallelism saves.",
   note: 'Separate processes sidestep the GIL entirely, at the price of serialising everything that crosses the boundary. Worth it for genuine computation; a loss for anything that is mostly waiting.' }
],
body: [
 { h: 'Choosing', html:
   '<table><thead><tr><th>Work is</th><th>Use</th><th>Why</th></tr></thead><tbody><tr><td>Waiting on network or disk</td><td><b>Threads</b></td><td>GIL released during the wait; simplest change</td></tr><tr><td>Thousands of concurrent waits</td><td><b>asyncio</b></td><td>One thread, far less overhead per task</td></tr><tr><td>Real computation</td><td><b>Processes</b></td><td>Each has its own GIL</td></tr><tr><td>Very large data</td><td>Spark or a warehouse</td><td>Beyond one machine</td></tr></tbody></table><p>For data engineering the honest answer is usually threads: the work is I/O-bound, the change is a few lines, and asyncio requires the whole call chain to be async.</p>' },
 { h: 'What the GIL actually does', html:
   '<p>It allows only one thread to execute Python bytecode at a time. It is released around I/O, and inside C extensions such as NumPy and pandas that drop it deliberately. So the GIL prevents CPU-parallelism in pure Python and does <em class="hl">not</em> prevent overlapping network calls — which is the case that matters here.</p>' },
 { h: 'Concurrency does not remove idempotency', html:
   '<p>Ten workers writing concurrently means partial failure is now partial in a new way: some chunks committed, some did not, and the retry re-runs all of them. Everything in Level 4 applies more strongly, not less.</p>' }
],
call: '"The GIL blocks CPU parallelism in pure Python but is released while waiting on I/O, and a pipeline is almost entirely waiting — so threads are usually the right answer and the change is a few lines. asyncio wins at thousands of concurrent waits, and processes only for genuine computation, where pickling cost has to be weighed."',
warn: 'One blocking call inside an async function stops the entire event loop. `requests.get` or `time.sleep` in a coroutine makes every task serial while the code still appears concurrent — and nothing errors, it is just slow.',
qf: [
 ['What does the GIL prevent?', 'Two threads executing Python bytecode simultaneously — CPU parallelism in pure Python.'],
 ['Why are threads still useful?', "The GIL is released while waiting on I/O, which is most of a pipeline's time."],
 ['When would you use processes?', 'Genuine CPU-bound work — each process has its own GIL, at the cost of pickling.'],
 ['What silently kills asyncio performance?', 'A blocking call inside a coroutine — it stops the whole event loop.'],
 ['Threads or asyncio for 200 API calls?', 'Threads — simpler, and asyncio needs the whole call chain to be async.'],
 ['What does concurrency change about retries?', 'Partial failure gets more likely, so idempotency matters more.']
]});

M.push({
code: 'A2', track: 'Level 8 · APIs, LLMs and agents', theory: true,
title: 'Calling things over the network',
sub: 'Timeouts, retries, pagination and idempotency keys — and what changes for an LLM.',
lede: 'Every network call can hang, fail, rate-limit or lie. Four things belong on every HTTP call in a pipeline, and the pagination bug in particular is one of the quietest data-loss failures there is.',
ex: [
 { t: 'The four things every call needs', ref:true,
   code: "resp = requests.get(\n    url,\n    timeout=(3, 30),           # 1. connect and read timeouts — NEVER omit\n    headers={\"Authorization\": f\"Bearer {token}\"},\n)\nresp.raise_for_status()        # 2. a 4xx/5xx is not a success\n\n# 3. retry only transient failures, with backoff and jitter\n#      429, 500, 502, 503, 504, connection errors  -> retry\n#      400, 401, 403, 404, 422                     -> fail fast\n# 4. rate limit yourself: honour Retry-After, cap concurrency",
   note: 'Without a timeout the default is to wait forever, and a hung call holds a worker until someone notices. `raise_for_status` matters because a 500 with a JSON error body is still a response object that looks fine.' },
 { t: 'The pagination bug', ref:true,
   code: "# WRONG - stops at the first empty page, and some APIs\n# return an empty page in the middle of a result set\nwhile True:\n    page = get(url, params={\"page\": n})\n    if not page[\"items\"]:\n        break\n    yield from page[\"items\"]\n    n += 1\n\n# RIGHT - follow the cursor the API gives you\ncursor = None\nwhile True:\n    page = get(url, params={\"cursor\": cursor})\n    yield from page[\"items\"]\n    cursor = page.get(\"next_cursor\")\n    if not cursor:\n        break",
   note: 'Guessing the end condition is how you silently truncate a result set. Follow the cursor or the next-link the API provides, and reconcile the row count against any total the API reports.' },
 { t: 'Idempotency keys: Level 4 over HTTP', ref:true,
   code: "# The network failed after the server processed the request.\n# Did the payment go through? You cannot tell from your side.\n\nresp = requests.post(\n    \"/payments\",\n    json=payload,\n    headers={\"Idempotency-Key\": f\"{run_id}:{txn_id}\"},   # stable across retries\n    timeout=(3, 30),\n)\n\n# The server deduplicates on that key, so retrying is safe.\n# The key must be derived from the DATA, not generated per attempt -\n# a fresh uuid4() on each retry defeats the entire mechanism.",
   note: 'The same argument as idempotent loads, moved to the API boundary. Generating the key inside the retry loop is the mistake — it must be stable across attempts, which means deriving it from the run and the record.' },
 { t: 'What is different about an LLM API', ref:true,
   code: "# 1. Treat the output as UNTRUSTED INPUT\nraw = call_model(prompt)\ntry:\n    data = json.loads(raw)\nexcept json.JSONDecodeError:\n    raise ModelOutputError(\"not valid JSON\")\nvalidate_schema(data)          # then check it means what you expect\n\n# 2. Non-determinism: the same prompt can give different output.\n#    Pin the model version; set temperature=0 for extraction tasks;\n#    a \"usually correct\" parser is a flaky pipeline.\n\n# 3. Cost and latency are per call and much larger than a normal API.\n#    Cache aggressively; batch; cap tokens; set a spend alarm.\n\n# 4. Failures are not just HTTP: truncation, refusal, hallucinated fields.",
   note: 'The rule that matters: model output is untrusted input, so parse it and validate it against a schema before anything downstream touches it. An agent loop adds the further requirement of a hard step limit, because a loop that decides its own next action can decide to keep going.' }
],
body: [
 { h: 'Which failures to retry', html:
   '<table><thead><tr><th>Retry</th><th>Fail fast</th></tr></thead><tbody><tr><td>429 rate limited (honour Retry-After)</td><td>400 bad request</td></tr><tr><td>500, 502, 503, 504</td><td>401, 403 auth</td></tr><tr><td>Connection reset, timeout</td><td>404 not found</td></tr><tr><td></td><td>422 validation</td></tr></tbody></table><p>Retrying a 401 four times with backoff wastes a minute and delays the alert. The credential is not going to become valid.</p>' },
 { h: 'Agent loops, briefly', html:
   '<div class="pre">while not done:\n    action = model.decide(state)      <i>the model chooses the next step</i>\n    result = execute(action)          <u>bound this: allowlist the tools</u>\n    state  = update(state, result)\n    steps += 1\n    if steps &gt; MAX_STEPS: break       <i>non-negotiable</i></div><p>Three controls are not optional: a hard step limit, an allowlist of permitted actions, and a spend cap. A loop whose exit condition is decided by the thing inside the loop needs an external bound.</p>' },
 { h: 'Where this meets data engineering', html:
   '<p>Extraction from unstructured documents, classification of free-text fields, and enrichment. In every case the model sits <em class="hl">inside</em> a pipeline that still needs idempotency, quarantine and reconciliation — the LLM is a transform step with an unusually high failure rate, not an exemption from the rest of this bench.</p>' }
],
call: '"Every network call gets a timeout, status checking, retries only on transient failures, and an idempotency key derived from the data so a retry after an ambiguous failure is safe. For an LLM I add that the output is untrusted input — parse and schema-validate before anything downstream sees it — and an agent loop gets a hard step cap."',
warn: 'Pagination that stops on the first empty page silently truncates the result set, and some APIs genuinely return an empty page mid-sequence. The job succeeds with a fraction of the data and no error anywhere.',
qf: [
 ['What four things does every HTTP call need?', 'A timeout, status checking, retries on transient failures only, and self-imposed rate limiting.'],
 ['What happens without a timeout?', 'The call can hang indefinitely, holding a worker until someone notices.'],
 ['Which HTTP codes are worth retrying?', '429 and 5xx, plus connection errors. Never 4xx auth or validation errors.'],
 ['What is the pagination bug?', "Guessing the end condition — follow the API's cursor or next-link instead."],
 ['What is an idempotency key and where does it come from?', 'A stable key derived from the data, so the server can deduplicate a retried request.'],
 ['What is the rule for LLM output?', 'Treat it as untrusted input — parse and validate against a schema before use.'],
 ['What bounds an agent loop?', 'A hard step limit, an allowlist of actions, and a spend cap.']
]});

M.push({
code: 'A3', track: 'Level 9 · Python in the stack', theory: true,
title: 'Airflow, boto3 and databases',
sub: 'Where your Python actually lives, and the three things that go wrong there.',
lede: 'Most production Python at a bank sits inside an orchestrator, talks to AWS through boto3, and reads a database. Each has one detail that separates someone who has run it from someone who has read about it.',
ex: [
 { t: 'Airflow: the logical date is the whole point', ref:true,
   code: "with DAG(\"txn_silver\",\n         schedule=\"0 2 * * *\",\n         start_date=datetime(2026, 1, 1),\n         catchup=False,            # or a year of backfill fires on deploy\n         max_active_runs=1,        # two runs must not write one partition\n         default_args={\"retries\": 2, \"retry_delay\": timedelta(minutes=5)}) as dag:\n\n    load = PythonOperator(\n        task_id=\"load_silver\",\n        python_callable=load_partition,\n        op_kwargs={\"dt\": \"{{ ds }}\"},     # the LOGICAL date, not today\n    )\n\n# datetime.now() inside the task -> a backfill of last Tuesday\n# writes today's partition. Every backfill is silently wrong.",
   note: '`{{ ds }}` is the interval the run represents. Using `datetime.now()` instead means a re-run of a past date processes today, which makes backfills meaningless — and because retries are automatic, this bites without anyone triggering it manually.' },
 { t: 'boto3: paginate, and never hardcode credentials', ref:true,
   code: "import boto3\n\ns3 = boto3.client(\"s3\")            # credentials from the ROLE, not a file\n\n# list_objects_v2 returns at most 1000 keys. Without the paginator\n# you silently process the first 1000 and miss the rest.\npaginator = s3.get_paginator(\"list_objects_v2\")\nfor page in paginator.paginate(Bucket=\"lake\", Prefix=\"silver/dt=2026-02-01/\"):\n    for obj in page.get(\"Contents\", []):\n        process(obj[\"Key\"])\n\n# Credentials, in order of preference:\n#   IAM role on the compute (EC2, ECS task, Lambda, EKS service account)\n#   NEVER: access keys in code, in env files, or in the repo",
   note: 'The 1000-key truncation is the same shape as the pagination bug in A2 and just as quiet. The credentials question behind the question is "how does this get permissions?" — and the answer a bank wants is an IAM role attached to the compute.' },
 { t: 'Databases: parameterise, and stream', ref:true,
   code: "# NEVER - SQL injection, and it breaks on any quote in the data\ncur.execute(f\"SELECT * FROM txns WHERE dt = '{dt}'\")\n\n# ALWAYS - the driver escapes it\ncur.execute(\"SELECT * FROM txns WHERE dt = %s\", (dt,))\n\n# fetchall() pulls the entire result into memory - the Level 2 problem\nfor row in cur:                      # server-side cursor, streams\n    process(row)\n\n# executemany / COPY for writes: one INSERT per row is one\n# round trip per row, which is the Level 2 chunking argument again.",
   note: 'Three separate lessons in one snippet, and all three are the same lessons from earlier levels arriving in a new place: parameterise, stream rather than materialise, and batch rather than round-trip.' }
],
body: [
 { h: 'The Airflow rules that matter', html:
   '<table><thead><tr><th>Setting</th><th>Why</th></tr></thead><tbody><tr><td><code>catchup=False</code></td><td>Otherwise deploying fires one run per interval since start_date</td></tr><tr><td><code>max_active_runs=1</code></td><td>Two runs writing one partition corrupt it</td></tr><tr><td><code>{{ ds }}</code></td><td>The logical date — what makes a backfill mean anything</td></tr><tr><td>Retries</td><td>Automatic, which is why tasks must be idempotent</td></tr><tr><td>SLA / timeout</td><td>A job that succeeds four hours late still broke its contract</td></tr></tbody></table>' },
 { h: 'Connections and pools', html:
   '<p>Opening a connection per row is a round trip per row. Opening one and never closing it exhausts the pool for everything else — which is the context-manager argument from F2. Use a pool, take a connection with <code>with</code>, and return it.</p>' },
 { h: 'Where the earlier levels reappear', html:
   '<ul><li><strong>Level 2</strong> — <code>fetchall()</code> versus streaming a cursor.</li><li><strong>Level 3</strong> — retries around a flaky API, cleanup with <code>with</code>.</li><li><strong>Level 4</strong> — Airflow retries automatically, so tasks must be idempotent.</li><li><strong>Level 1</strong> — a task that mutates a shared object between runs in the same worker.</li></ul>' }
],
call: '"Airflow tasks are parameterised on the logical date rather than now(), because retries and backfills are automatic and a task using now() writes today’s partition when re-running last Tuesday. The same paginate-or-truncate trap shows up in boto3 list_objects_v2, which stops at a thousand keys without a paginator."',
warn: '`list_objects_v2` returns at most 1000 keys. Without a paginator you process the first thousand and miss everything else, with no error — the job succeeds having read a fraction of the bucket.',
qf: [
 ['What does {{ ds }} give you?', 'The logical date of the run, which is what makes backfills reprocess the right day.'],
 ['Why catchup=False?', 'Otherwise deploying triggers one run per interval since start_date, all at once.'],
 ['Why max_active_runs=1?', 'So two runs cannot write the same partition simultaneously.'],
 ['What is the boto3 truncation trap?', 'list_objects_v2 caps at 1000 keys — use a paginator.'],
 ['Where should AWS credentials come from?', 'An IAM role attached to the compute, never keys in code or files.'],
 ['Why parameterise SQL?', 'Injection safety, and it survives quotes and special characters in the data.'],
 ['Why not fetchall()?', 'It materialises the whole result — stream the cursor instead.']
]});

M.push({
code: 'A4', track: 'Level 10-11 · Delivery and scenarios', theory: true,
title: 'Working inside a bank, and the questions they ask',
sub: 'Environments, masked data, and the four scenario answers worth rehearsing.',
lede: 'The last level is not about Python. It is about how the work is delivered in a regulated environment, and the handful of scenario questions that a panel uses to tell whether you have actually operated a pipeline.',
ex: [
 { t: '"The job failed at 2 AM and you are on call. First 30 minutes?"', ref:true,
   code: "1  Is it still failing, or did a retry succeed?         (check the run history)\n2  What is the blast radius — which downstream depends on it?\n3  Read the ERROR, not the last line. Find the FIRST failure.\n4  Is it data, code or infrastructure?\n     data   -> a bad row, a schema change upstream\n     code   -> what deployed recently?\n     infra  -> source down, credentials expired, disk full\n5  Can it be re-run safely?  (this is why Level 4 exists)\n6  Communicate: what broke, who is affected, ETA, next update time.\n7  Only then fix. Write the postmortem note while it is fresh.",
   note: 'The order is the answer. Candidates jump to step 7. Establishing blast radius and communicating before fixing is what a panel is listening for — and step 5 is only answerable if the load was built to be idempotent.' },
 { t: '"Numbers are wrong after month-end close."', ref:true,
   code: "Reconcile, do not guess. Narrow it down by bisection:\n\n1  Is the SOURCE count right?        source vs raw\n2  Did ingestion drop rows?          raw vs staged      <- quarantine?\n3  Did a transform drop rows?        staged vs curated  <- inner join?\n4  Is the report reading correctly?  curated vs report  <- filter? timezone?\n\nThen the usual culprits, in order of likelihood:\n  an inner join that should have been a left join\n  a late-arriving correction not reprocessed\n  a duplicate load (Level 4)\n  a timezone boundary putting rows in the wrong day",
   note: 'A count at every hop turns "the numbers are wrong" into a single failing stage. Saying you would bisect the pipeline rather than inspect the final query is the difference between a method and a guess.' },
 { t: '"Reprocess three days without double counting."', ref:true,
   code: "The answer is one word first: idempotency. Then the mechanism:\n\n  partition overwrite   delete-and-write each day the run owns\n  merge on key          upsert; a re-run is a no-op\n  dedupe on read        append with a run id, resolve in the view\n\nThen the operational parts people forget:\n  - process days in ORDER if the transform is stateful\n  - reconcile counts per day after each one\n  - check what downstream consumers cached from the bad data\n  - and confirm nothing was already published from the bad run",
   note: 'The mechanism is Level 4. What separates a good answer is the last two lines — fixing the table is not the same as fixing what was already published from it.' },
 { t: '"You know nothing about the project. How do you start?"', ref:true,
   code: "1  What does this pipeline produce, and WHO reads it?\n2  What breaks if it is late? if it is wrong? (that is the real SLA)\n3  Where does the data come from, and who owns that source?\n4  Read the last three incidents. That tells you the real risks.\n5  Run it end to end in the lowest environment, and read the logs.\n6  Trace ONE record from source to report by hand.\n7  Now change something small and ship it.\n\nStep 6 is the one that teaches you the system.",
   note: 'Tracing a single record end to end teaches more than reading the whole repository, and it produces questions nobody thought to write down. Step 4 is the other underrated one — past incidents are a map of where the system is actually fragile.' }
],
body: [
 { h: 'Environments', html:
   '<table><thead><tr><th>Environment</th><th>Data</th><th>Who deploys</th></tr></thead><tbody><tr><td>dev</td><td>Synthetic or masked</td><td>You</td></tr><tr><td>test / SIT</td><td>Masked production-like</td><td>CI</td></tr><tr><td>UAT</td><td>Masked, business-validated</td><td>Release process</td></tr><tr><td>prod</td><td>Real, restricted</td><td><b>Change approval</b></td></tr></tbody></table><p>You will not have production access, and that is the point rather than an obstacle. It means logs, metrics and reproducible local runs matter more, not less.</p>' },
 { h: 'Data in lower environments', html:
   '<p>Real customer data does not leave production. What you get is masked, tokenised or synthetic — which means a bug that depends on real distributions may not reproduce below production. That is a genuine constraint and the reason quality assertions run <em class="hl">in</em> the pipeline rather than only in tests.</p>' },
 { h: 'The vocabulary', html:
   '<div class="pre">SLA / SLO      what late means, and what breaks when it is\nRTO / RPO      how fast you recover, how much data you can lose\nlineage        where a number came from — a regulator will ask\nBCBS 239       banking rule on risk data aggregation and reporting\nfour-eyes      every production change reviewed by a second person\nCAB            change approval board — why deploys are scheduled</div>' }
],
call: '"When a job fails I establish blast radius and communicate before I fix anything, because the people downstream need to know sooner than they need it fixed. And whether it can be safely re-run is a question I want answered at design time rather than at 2 AM — which is what idempotency buys."',
warn: 'Fixing the table is not the same as fixing what was published from it. A corrected reprocess still leaves downstream caches, extracts and reports carrying the bad numbers, and nobody is looking for them.',
qf: [
 ['First step when a job fails at 2 AM?', 'Check whether it is still failing, then establish blast radius — before fixing.'],
 ['How do you investigate wrong numbers?', 'Reconcile counts at every hop and bisect: source, raw, staged, curated, report.'],
 ['Most common cause of missing rows?', 'An inner join that should have been a left join, or a filter dropping nulls.'],
 ['What makes reprocessing safe?', 'Idempotency — partition overwrite or a keyed merge.'],
 ['What do people forget when reprocessing?', 'Downstream consumers that already cached or published the bad data.'],
 ['How do you learn an unfamiliar pipeline?', 'Trace one record end to end by hand, and read the last three incidents.'],
 ['Why will you not have production access?', 'Regulatory separation of duties — which is why logs and metrics matter more.']
]});

M.push({
code: 'V1', track: 'Tier 14 · Interview and career',
title: 'The coding patterns they actually ask',
sub: 'Six shapes cover most data-engineering screens. Not LeetCode — data shapes.',
lede: 'A data-engineering screen is rarely a graph algorithm. It is almost always one of a small set of shapes over rows: group, deduplicate, join, aggregate in one pass, find the top N per group, and reconcile two sources. Each has an idiomatic Python answer that is short, and a naive answer that is O(n²).',
ex: [
 { t: 'Group rows by a key',
   code: "from collections import defaultdict\n\ntxns = [\n    {\"id\": \"t1\", \"wallet\": \"w-1\", \"amount\": 100.0},\n    {\"id\": \"t2\", \"wallet\": \"w-2\", \"amount\": 250.0},\n    {\"id\": \"t3\", \"wallet\": \"w-1\", \"amount\": 75.0},\n]\n\nby_wallet = defaultdict(list)\nfor t in txns:\n    by_wallet[t[\"wallet\"]].append(t)\n\nfor w in sorted(by_wallet):\n    ids = [t[\"id\"] for t in by_wallet[w]]\n    print(w, ids)\n\n# the naive version is O(n^2):\n#   for w in wallets: [t for t in txns if t[\"wallet\"] == w]",
   note: 'One pass, a dict of lists. The interviewer is watching for whether you scan the whole list once per key — which is quadratic and is the single most common inefficiency in a screen answer.' },
 { t: 'Deduplicate, keeping the latest',
   code: "rows = [\n    {\"id\": \"t1\", \"amount\": 100.0, \"ingested\": \"2026-02-13\"},\n    {\"id\": \"t1\", \"amount\": 110.0, \"ingested\": \"2026-02-14\"},\n    {\"id\": \"t2\", \"amount\": 250.0, \"ingested\": \"2026-02-13\"},\n]\n\nlatest = {}\nfor r in rows:\n    prev = latest.get(r[\"id\"])\n    if prev is None or r[\"ingested\"] > prev[\"ingested\"]:\n        latest[r[\"id\"]] = r\n\nfor k in sorted(latest):\n    print(k, latest[k][\"amount\"], latest[k][\"ingested\"])\n\nprint(\"kept\", len(latest), \"of\", len(rows))",
   note: 'The follow-up is always "which duplicate wins?". Say it out loud: latest ingestion for corrections, earliest for immutable events. And note the tie case — if two share a timestamp the survivor is arbitrary unless you add a second sort key.' },
 { t: 'Join two sources in memory',
   code: "txns = [{\"id\": \"t1\", \"wallet\": \"w-1\"}, {\"id\": \"t2\", \"wallet\": \"w-9\"}]\nwallets = [{\"wallet\": \"w-1\", \"risk\": \"low\"}]\n\nindex = {w[\"wallet\"]: w for w in wallets}      # build a hash index once\n\njoined, unmatched = [], []\nfor t in txns:\n    w = index.get(t[\"wallet\"])\n    if w is None:\n        unmatched.append(t)                     # a LEFT join keeps these\n    else:\n        joined.append({**t, \"risk\": w[\"risk\"]})\n\nprint(\"joined:   \", joined)\nprint(\"unmatched:\", [t[\"id\"] for t in unmatched])\nprint(\"inner join would have silently dropped\", len(unmatched), \"row(s)\")",
   note: 'Index the smaller side, then scan the larger once — the same idea as a broadcast hash join in Spark. The line that earns marks is the last one: naming what an inner join would have dropped.' },
 { t: 'Aggregate several metrics in one pass',
   code: "txns = [\n    {\"wallet\": \"w-1\", \"amount\": 100.0, \"flagged\": False},\n    {\"wallet\": \"w-1\", \"amount\": 950.0, \"flagged\": True},\n    {\"wallet\": \"w-2\", \"amount\": 40.0,  \"flagged\": False},\n]\n\nstats = {}\nfor t in txns:\n    s = stats.setdefault(t[\"wallet\"], {\"n\": 0, \"total\": 0.0, \"flagged\": 0, \"max\": 0.0})\n    s[\"n\"] += 1\n    s[\"total\"] += t[\"amount\"]\n    s[\"flagged\"] += 1 if t[\"flagged\"] else 0\n    s[\"max\"] = max(s[\"max\"], t[\"amount\"])\n\nfor w in sorted(stats):\n    s = stats[w]\n    print(f\"{w}: n={s['n']} total={s['total']:.2f} flagged={s['flagged']} max={s['max']:.2f}\")",
   note: 'One traversal, four metrics. Filtering four times and joining the results is four passes for the same answer — and it is exactly the conditional-aggregation argument from SQL and Spark, in plain Python.' },
 { t: 'Top N per group',
   code: "txns = [\n    {\"wallet\": \"w-1\", \"id\": \"t1\", \"amount\": 100.0},\n    {\"wallet\": \"w-1\", \"id\": \"t2\", \"amount\": 900.0},\n    {\"wallet\": \"w-1\", \"id\": \"t3\", \"amount\": 500.0},\n    {\"wallet\": \"w-2\", \"id\": \"t4\", \"amount\": 40.0},\n]\n\ngroups = {}\nfor t in txns:\n    groups.setdefault(t[\"wallet\"], []).append(t)\n\nfor w in sorted(groups):\n    top = sorted(groups[w], key=lambda t: t[\"amount\"], reverse=True)[:2]\n    print(w, [(t[\"id\"], t[\"amount\"]) for t in top])",
   note: 'Group, then sort within each group and slice. For very large groups you would use a bounded heap instead of sorting everything — saying that unprompted signals you have thought about the cost.' },
 { t: 'Reconcile two sources',
   code: "source = {\"t1\": 100.0, \"t2\": 250.0, \"t3\": 75.0}\ntarget = {\"t1\": 100.0, \"t2\": 999.0, \"t4\": 10.0}\n\nmissing = sorted(set(source) - set(target))\nextra   = sorted(set(target) - set(source))\ndiffers = sorted(k for k in set(source) & set(target) if source[k] != target[k])\n\nprint(\"in source, not loaded:\", missing)\nprint(\"in target, not in source:\", extra)\nprint(\"value mismatch:\", [(k, source[k], target[k]) for k in differs])\nprint(\"reconciled:\", not (missing or extra or differs))",
   note: 'Set operations answer "the numbers are wrong" in four lines and turn a vague complaint into three specific lists. This is the shape of every reconciliation job you will ever write.' }
],
body: [
 { h: 'The six shapes', html:
   '<table><thead><tr><th>Ask</th><th>Shape</th><th>Cost</th></tr></thead><tbody><tr><td>"Group these by X"</td><td>dict of lists, one pass</td><td>O(n)</td></tr><tr><td>"Remove duplicates"</td><td>dict keyed on the business key</td><td>O(n)</td></tr><tr><td>"Combine these two"</td><td>Index the small side, scan the large</td><td>O(n+m)</td></tr><tr><td>"Summarise per group"</td><td>Accumulator dict, one pass</td><td>O(n)</td></tr><tr><td>"Top N per group"</td><td>Group, then sort or heap per group</td><td>O(n log k)</td></tr><tr><td>"Why do these disagree?"</td><td>Set difference and intersection</td><td>O(n+m)</td></tr></tbody></table>' },
 { h: 'What they are actually checking', html:
   '<ul><li><strong>Do you scan repeatedly?</strong> A nested loop over the same list is the tell.</li><li><strong>Do you name the ambiguity?</strong> Which duplicate wins, what happens to unmatched rows, how ties break.</li><li><strong>Do you handle empty input?</strong> Say it before they ask.</li><li><strong>Do you know when to stop?</strong> "Past a few million rows I would push this into SQL or Spark rather than a dict" is a better answer than optimising the dict.</li></ul>' },
 { h: 'Say the cost out loud', html:
   '<p>Dict and set lookup is O(1); scanning a list to find an item is O(n). Building an index and then looking up turns a quadratic loop into a linear one, and stating that transformation as you write it is most of what the interviewer wants to hear.</p>' }
],
call: '"Most data screens are one of six shapes over rows, and the one thing they all share is: build a dict index once rather than scanning the list per key. When I write one I say which duplicate wins and what happens to unmatched rows, because that ambiguity is usually the real question."',
warn: 'Filtering a list inside a loop over its keys is O(n²) and looks perfectly readable. On the fifty rows in the interview it runs instantly; on the real data it never finishes, and nothing about the code says so.',
qf: [
 ['How do you group rows by a key?', 'One pass into a dict of lists — defaultdict(list) or setdefault.'],
 ['What makes the naive grouping quadratic?', 'Scanning the whole list once per distinct key instead of once in total.'],
 ['How do you join two lists in memory?', 'Index the smaller side into a dict, then scan the larger once.'],
 ['What question follows any deduplication?', 'Which duplicate wins — and what breaks ties.'],
 ['How do you compute several metrics per group?', 'One accumulator dict updated in a single pass, not one filter pass per metric.'],
 ['How do you reconcile two sources?', 'Set difference both ways for missing and extra, intersection for value mismatches.'],
 ['When do you stop optimising Python?', 'When the data outgrows one machine — then it belongs in SQL or Spark.']
]});

M.push({
code: 'V2', track: 'Tier 14 · Interview and career',
title: 'Reading someone else’s Python',
sub: 'Code review is a real interview round. Here is what to look for, in order.',
lede: 'You will be handed a function and asked what is wrong with it. The instinct is to comment on style; the value is in finding the defect. There is an order that finds real bugs fastest, and it maps onto every earlier tier of this bench.',
ex: [
 { t: 'Find the defects before reading on',
   code: "def load_batch(rows, seen=[]):\n    results = []\n    for r in rows:\n        try:\n            if r[\"id\"] not in seen:\n                seen.append(r[\"id\"])\n                results.append({\"id\": r[\"id\"], \"amt\": float(r[\"amount\"])})\n        except:\n            pass\n    return results\n\nbatch = [{\"id\": \"t1\", \"amount\": \"10\"}, {\"id\": \"t2\", \"amount\": \"bad\"}]\nprint(\"run 1:\", load_batch(batch))\nprint(\"run 2:\", load_batch(batch))\nprint(\"second run returned nothing — state leaked between calls\")",
   note: 'Five defects. The mutable default keeps state across calls, so the second run returns nothing. The bare except hides the bad row silently. `not in` on a list is O(n) so this is quadratic. There is no reject count. And the function name says load while it returns — it does neither cleanly.' },
 { t: 'The reviewed version',
   code: "def parse_batch(rows):\n    parsed, rejected = [], []\n    seen = set()\n    for r in rows:\n        try:\n            if r[\"id\"] in seen:\n                continue\n            seen.add(r[\"id\"])\n            parsed.append({\"id\": r[\"id\"], \"amt\": float(r[\"amount\"])})\n        except (ValueError, TypeError, KeyError) as e:\n            rejected.append({\"row\": r, \"reason\": str(e)})\n    return parsed, rejected\n\nbatch = [{\"id\": \"t1\", \"amount\": \"10\"}, {\"id\": \"t2\", \"amount\": \"bad\"}, {\"id\": \"t1\", \"amount\": \"10\"}]\ngood, bad = parse_batch(batch)\nprint(\"run 1:\", good, \"rejected:\", len(bad))\ngood, bad = parse_batch(batch)\nprint(\"run 2:\", good, \"rejected:\", len(bad))\nprint(\"identical across runs:\", True)",
   note: 'State is local, the set makes membership O(1), rejects are returned rather than discarded, exceptions are named, and the function does one thing the name describes. Same length, entirely different behaviour under retry.' },
 { t: 'A subtler one: the shared-default variant',
   code: "def tally(txn, totals={}):\n    totals[txn[\"wallet\"]] = totals.get(txn[\"wallet\"], 0) + txn[\"amount\"]\n    return totals\n\nprint(tally({\"wallet\": \"w-1\", \"amount\": 10}))\nprint(tally({\"wallet\": \"w-2\", \"amount\": 20}))\nprint(\"w-1 is still here, from a previous call — and it is a memory leak\")",
   note: 'This one passes review constantly because it looks like a pure accumulator. In a long-running worker the dict grows until the process dies, and the numbers are wrong from the second call onwards.' },
 { t: 'The mutation review',
   code: "def enrich(rows):\n    for r in rows:\n        r[\"band\"] = \"large\" if r[\"amount\"] > 100 else \"small\"\n    return rows\n\noriginal = [{\"id\": \"t1\", \"amount\": 500}]\nresult = enrich(original)\nprint(\"caller's data was modified:\", \"band\" in original[0])\nprint(\"same object returned:\", result is original)\n\ndef enrich_pure(rows):\n    return [dict(r, band=\"large\" if r[\"amount\"] > 100 else \"small\") for r in rows]\n\noriginal2 = [{\"id\": \"t1\", \"amount\": 500}]\nenrich_pure(original2)\nprint(\"pure version left it alone:\", \"band\" not in original2[0])",
   note: 'The signature promises a return value and the body edits the input. Both are true, which is what makes it survive review — the caller has no copy of what they passed in and nothing warned them.' }
],
body: [
 { h: 'The review order that finds bugs fastest', html:
   '<ol><li><strong>Mutable defaults</strong> — any <code>=[]</code>, <code>={}</code>, or a call in a default.</li><li><strong>Bare or broad except</strong> — what is being swallowed, and is it counted?</li><li><strong>Mutation of arguments</strong> — does the caller keep their data?</li><li><strong>Accidental O(n²)</strong> — <code>in</code> on a list inside a loop.</li><li><strong>Re-runnability</strong> — what happens if this runs twice?</li><li><strong>Naming</strong> — does the name describe what it does?</li></ol><p>Style comes last and is mostly a linter’s job. Finding a mutable default before commenting on line length is the difference between reviewing and proofreading.</p>' },
 { h: 'How to say it', html:
   '<p>Lead with the consequence, not the rule. "This default dict is shared across calls, so the second invocation returns the first one’s data" lands; "avoid mutable defaults" sounds like a checklist. Then propose the fix, and say which of the defects you would block the merge on.</p>' },
 { h: 'What good code looks like here', html:
   '<ul><li>Pure transforms that return new objects.</li><li>Specific exceptions, with the rejects returned or logged.</li><li>Sets and dicts for membership, not lists.</li><li>One responsibility per function, and a name that says it.</li><li>Safe to run twice.</li></ul>' }
],
call: '"When I review Python I look for mutable defaults, bare excepts, argument mutation and accidental quadratic loops before I look at anything stylistic — those four cause real incidents. And I lead with the consequence rather than the rule, because \'the second call returns the first call’s data\' is more persuasive than \'avoid mutable defaults\'."',
warn: 'A function that both mutates its argument and returns it passes review easily, because the return value makes it look pure. The caller keeps no copy of what they passed in, and the bug only surfaces when someone else reuses that data.',
qf: [
 ['What do you check first in a review?', 'Mutable defaults, bare excepts, argument mutation, and accidental O(n²) loops.'],
 ['Why is `x in some_list` inside a loop a smell?', 'List membership is O(n), so the loop becomes quadratic — use a set.'],
 ['Why does a mutating function that also returns survive review?', 'The return value makes it look pure, so nobody checks whether the input changed.'],
 ['What is wrong with `except: pass`?', 'It converts a failure into silent data loss with a successful exit code.'],
 ['How should you phrase a review comment?', 'Lead with the consequence, then the fix, then say whether it blocks the merge.'],
 ['What question exposes most pipeline bugs?', 'What happens if this runs twice?']
]});

M.push({
code: 'V3', track: 'Tier 14 · Interview and career',
title: 'Debugging as a method',
sub: 'Bisect, do not guess. The order matters more than the tools.',
lede: 'Under pressure the instinct is to read the code and look for something wrong. That works for simple bugs and fails for the ones that matter. A method that narrows the search space beats intuition, and it is also what a panel is listening for when they hand you a broken function.',
ex: [
 { t: 'Narrow it by bisection, not by reading',
   code: "def pipeline(rows):\n    stage1 = [r for r in rows if r.get(\"amount\") is not None]\n    stage2 = [dict(r, amount=float(r[\"amount\"])) for r in stage1]\n    stage3 = [r for r in stage2 if r[\"amount\"] > 0]\n    return stage3\n\nrows = [\n    {\"id\": \"t1\", \"amount\": \"100\"},\n    {\"id\": \"t2\"},\n    {\"id\": \"t3\", \"amount\": \"0\"},\n    {\"id\": \"t4\", \"amount\": \"250\"},\n]\n\n# instrument every hop, then read where the drop happened\ns1 = [r for r in rows if r.get(\"amount\") is not None]\ns2 = [dict(r, amount=float(r[\"amount\"])) for r in s1]\ns3 = [r for r in s2 if r[\"amount\"] > 0]\n\nprint(f\"in     {len(rows)}\")\nprint(f\"stage1 {len(s1)}   (-{len(rows)-len(s1)}: missing amount)\")\nprint(f\"stage2 {len(s2)}   (-{len(s1)-len(s2)})\")\nprint(f\"stage3 {len(s3)}   (-{len(s2)-len(s3)}: amount not > 0)\")",
   note: 'Counts at every hop turn "rows are missing" into a specific stage in seconds. Reading the function first would have found it eventually; counting finds it immediately and works on code you have never seen.' },
 { t: 'Reproduce it smaller before you fix it',
   code: "def band(amount):\n    if amount > 1000:\n        return \"large\"\n    elif amount > 100:\n        return \"medium\"\n    return \"small\"\n\nfor a in [0, 100, 100.01, 1000, 1000.01, -5]:\n    print(f\"{a:>9} -> {band(a)}\")\n\nprint()\nprint(\"boundaries are the bug surface: 100 is 'small', 1000 is 'medium'\")\nprint(\"is that intended, or is one of them an off-by-one?\")",
   note: 'A minimal reproduction is a table of boundary values. Half of all logic bugs live exactly on a boundary, and printing the boundaries settles in one line what arguing about the code would not.' },
 { t: 'Assert your assumptions rather than believing them',
   code: "def load(rows):\n    assert isinstance(rows, list), f\"expected list, got {type(rows).__name__}\"\n    assert all(\"id\" in r for r in rows), \"every row needs an id\"\n    seen = {r[\"id\"] for r in rows}\n    assert len(seen) == len(rows), f\"duplicate ids: {len(rows)-len(seen)}\"\n    return len(rows)\n\nprint(\"clean:\", load([{\"id\": \"t1\"}, {\"id\": \"t2\"}]))\n\nfor bad in [{\"id\": \"t1\"}, {\"id\": \"t1\"}]:\n    pass\ntry:\n    load([{\"id\": \"t1\"}, {\"id\": \"t1\"}])\nexcept AssertionError as e:\n    print(\"caught early:\", e)\ntry:\n    load([{\"amount\": 1}])\nexcept AssertionError as e:\n    print(\"caught early:\", e)",
   note: 'An assertion converts a silent wrong answer into a loud failure at the point the assumption broke, rather than three stages later where the symptom appears. In a pipeline these become data quality gates.' },
 { t: 'Binary search a long pipeline',
   code: "stages = [\"extract\", \"clean\", \"dedupe\", \"enrich\", \"aggregate\", \"write\"]\ncounts  = [1000,      1000,    1000,     640,      640,         640]\n\nprint(\"stage      rows    delta\")\nprev = None\nfor s, c in zip(stages, counts):\n    delta = \"\" if prev is None else f\"{c - prev:+d}\"\n    flag = \"  <-- HERE\" if prev is not None and c != prev else \"\"\n    print(f\"{s:10} {c:5}  {delta:>6}{flag}\")\n    prev = c\n\nprint()\nprint(\"six stages, one comparison each — not six code reviews\")",
   note: 'With counts recorded at each hop, finding the guilty stage is a scan rather than an investigation. This is why instrumenting a pipeline pays for itself the first time it breaks.' }
],
body: [
 { h: 'The order', html:
   '<ol><li><strong>Reproduce it</strong> — smallest input that still fails.</li><li><strong>Bisect</strong> — counts or prints at each hop; find the stage.</li><li><strong>Read the first error</strong>, not the last line of the traceback. The last frame is where it surfaced; the first is where it started.</li><li><strong>Check your assumptions</strong> with assertions, rather than trusting them.</li><li><strong>Change one thing</strong> and re-measure.</li><li><strong>Write the test</strong> that would have caught it, before fixing.</li></ol>' },
 { h: 'Where data bugs actually hide', html:
   '<table><thead><tr><th>Symptom</th><th>Usual cause</th></tr></thead><tbody><tr><td>Rows missing</td><td>Inner join, or a filter dropping nulls</td></tr><tr><td>Rows duplicated</td><td>A join fanning out, or a non-idempotent load</td></tr><tr><td>Totals slightly off</td><td>Float arithmetic, or a boundary condition</td></tr><tr><td>Totals wildly off</td><td>Double-counting from a re-run</td></tr><tr><td>Works on sample, fails on real data</td><td>Nulls, encoding, or scale</td></tr><tr><td>Intermittent</td><td>Ordering, concurrency, or a timezone boundary</td></tr></tbody></table>' },
 { h: 'What not to do', html:
   '<p>Do not change several things at once — if it starts working you have learned nothing and cannot revert intelligently. Do not fix the symptom before you understand the cause; a filter added to remove bad rows is usually hiding the reason they exist. And do not skip writing the test, because the same bug will arrive again through a different path.</p>' }
],
call: '"I bisect rather than read — counts at every hop turn \'rows are missing\' into a named stage in seconds, and it works on code I have never seen. Then I write the test that would have caught it before I write the fix, because otherwise the same bug comes back through a different path."',
warn: 'The last frame of a traceback is where the error surfaced, not where it started. Fixing the line that raised often just moves the failure downstream — read the first error in the log, not the final one.',
qf: [
 ['First step when debugging?', 'Reproduce it with the smallest input that still fails.'],
 ['How do you find which stage broke?', 'Bisect — record row counts at every hop and look for the drop.'],
 ['Which part of a traceback matters most?', 'The first error, not the last frame — the last is where it surfaced.'],
 ['What causes rows to go missing?', 'An inner join that should be left, or a filter dropping nulls.'],
 ['What causes duplicates?', 'A join fanning out, or a non-idempotent load that ran twice.'],
 ['Why change one thing at a time?', 'Otherwise a fix teaches you nothing and cannot be reverted intelligently.'],
 ['What do you write before the fix?', 'The test that would have caught it.']
]});

M.push({
code: 'V4', track: 'Tier 14 · Interview and career',
title: 'Designing a pipeline out loud',
sub: 'The structure of a good answer to "how would you build this?"',
lede: 'A design question is not testing whether you know Airflow. It is testing whether you ask about the contract before the tooling, and whether you can name what you would not build. There is an order that makes the answer sound like experience rather than a diagram.',
ex: [
 { t: 'The questions before any code', ref:true,
   code: "BEFORE naming a single tool:\n\n  1  Who consumes this, and what decision does it drive?\n  2  How fresh does it need to be?      (this is the real SLA)\n  3  What happens if it is late? if it is wrong?\n  4  How much data, and how fast is it growing?\n  5  Where does it come from, and who owns that source?\n  6  Can the source be replayed, or is it one-shot?\n  7  What is the grain of the output — one row per what?\n\nOnly now does \"batch or streaming\" have an answer.\nOnly now does \"Python or Spark\" have an answer.",
   note: 'Most candidates start at step 8. Asking about consumers and freshness first is what separates a designer from someone reciting an architecture, and questions 6 and 7 are the ones that actually constrain the design.' },
 { t: 'The shape of the answer', ref:true,
   code: "SOURCE -> LAND -> CLEAN -> MODEL -> SERVE\n                   |        |        |\n                   +--------+--------+-- quality gates between each\n\nFor each hop, say:\n  what it does           one sentence\n  the grain              one row per what\n  idempotency            how a re-run behaves\n  failure mode           what breaks, and what you do about it\n  the check              the assertion that must return zero rows\n\nThen say what you are NOT building and why:\n  \"no streaming layer, because the SLA is daily and streaming\n   triples the operational surface for no benefit here\"",
   note: 'Naming what you deliberately did not build is the strongest single signal available in a design round. It shows you priced the alternative rather than not knowing it existed.' },
 { t: 'Sizing before choosing tools',
   code: "daily_rows = 5_000_000\navg_row_bytes = 400\ndays_retained = 730\n\ndaily_gb = daily_rows * avg_row_bytes / 1e9\ntotal_gb = daily_gb * days_retained\n\nprint(f\"per day:   {daily_gb:>8.2f} GB\")\nprint(f\"retained:  {total_gb:>8.2f} GB\")\nprint(f\"per hour:  {daily_rows/24:>8,.0f} rows\")\nprint(f\"per second:{daily_rows/86400:>8,.0f} rows\")\nprint()\nprint(\"2 GB/day fits on one machine — Python and Parquet is enough\")\nprint(\"the 1.5 TB total is a storage and partitioning question, not a compute one\")",
   note: 'Two lines of arithmetic decide whether this is a Python job or a Spark job, and doing it out loud is far more convincing than asserting either. Fifty-eight rows a second is not a streaming problem.' },
 { t: 'The trade-off table you should reach for',

<script>

/* ============================================================

'use strict';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var MODS = window.PY_MODULES, PY = window.MiniPython;
var mods = [], navBtns = [], cur = 0, doneSet = {};

/* ---------- roadmap derived from module order ---------- */
/* Explicit learning order. Tracks render in this sequence regardless of the

var TRACK_ORDER = [
  'Tier 14 \u00b7 Interview and career',
  'Level 1 \u00b7 How Python stores data',
  'Level 2 \u00b7 Memory and volume',
  'Level 3 \u00b7 When things go wrong',
  'Level 4 \u00b7 Safe to re-run',
  'Level 5 \u00b7 Code a team can own',
  'Level 6 \u00b7 Testing and CI',
  'Level 7 \u00b7 Concurrency',
  'Level 8 \u00b7 APIs, LLMs and agents',
  'Level 9 \u00b7 Python in the stack',
  'Level 10-11 \u00b7 Delivery and scenarios'
];
var ROADMAP = (function(){
  var out = [], seen = {};
  MODS.forEach(function(m){
    if(!(m.track in seen)){ seen[m.track] = { t:m.track, items:[] }; out.push(seen[m.track]); }
    seen[m.track].items.push(m);
  });
  out.sort(function(a, b){
    var ia = TRACK_ORDER.indexOf(a.t), ib = TRACK_ORDER.indexOf(b.t);

})();
/* Re-flatten in track order so the pager, the export and the nav all agree. */
MODS = ROADMAP.reduce(function(a, t){ return a.concat(t.items); }, []);
window.PY_MODULES_ORDERED = MODS;

/* ---------- module DOM ---------- */


function buildModule(m, idx){
  var sec = document.createElement('section');
  sec.className = 'mod'; sec.id = m.code.toLowerCase();

  h += '<h1>' + esc(m.title) + '<small>' + esc(m.sub) + '</small></h1>';
  h += '<p class="lede">' + m.lede + '</p>';

    var id = m.code.toLowerCase() + '-e' + i;

      '<textarea class="pybox" id="' + id + '-code" spellcheck="false" rows="' +
        Math.min(22, e.code.split('\n').length + 1) + '">' + esc(e.code) + '</textarea>' +
      '<div class="row"><button class="btn pri" id="' + id + '-run">Run &#9654;</button>' +
      '<button class="btn sm" id="' + id + '-rst">Reset</button>' +
      '<span class="meta" id="' + id + '-meta">\u2014</span></div>' +

}
function runCode(host, meta, src){
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

  var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
  var out = res.output || '';
  var h = '';
  if(out) h += '<div class="pyout">' + esc(out.replace(/\n$/, '')) + '</div>';
  if(res.error){
    h += '<div class="err">' + esc(res.error) + '</div>';
    meta.className = 'meta bad';
    meta.innerHTML = '<b>' + esc(res.error.split(':')[0]) + '</b>';
  } else {
    meta.className = 'meta';
    var lines = out ? out.replace(/\n$/, '').split('\n').length : 0;
    meta.innerHTML = '<b>' + lines + '</b> line' + (lines === 1 ? '' : 's') +
      ' \u00b7 <b>' + fmtInt(res.steps) + '</b> steps \u00b7 ' + (t1 - t0).toFixed(1) + ' ms';

}
function fmtInt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function wireModule(m){
  (m.ex || []).forEach(function(e, i){
    if(e.ref) return;
    var id = m.code.toLowerCase() + '-e' + i;
    var box = $(id + '-code'), out = $(id + '-out'), meta = $(id + '-meta');
    if(!box) return;
    function go(){ runCode(out, meta, box.value); }
    $(id + '-run').addEventListener('click', go);
    $(id + '-rst').addEventListener('click', function(){ box.value = e.code; go(); });
    box.addEventListener('keydown', function(ev){
      if((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ ev.preventDefault(); go(); }
      if(ev.key === 'Tab'){
        ev.preventDefault();
        var a = box.selectionStart, b = box.selectionEnd;
        box.value = box.value.slice(0, a) + '    ' + box.value.slice(b);

}


/* ---------- rail ---------- */
function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }
function buildRail(){
  var nav = $('nav'), host = $('mods');
  nav.innerHTML = '';

  ROADMAP.forEach(function(t){
    var wrap = document.createElement('div'); wrap.className = 'grp';
    wrap.innerHTML = '<div class="grp-t">' + esc(t.t) + '<u>' + t.items.length + '</u></div>';
    t.items.forEach(function(m){
      var sec = buildModule(m, mods.length);
      host.appendChild(sec);
      var idx = mods.length; mods.push(sec);
      var b = document.createElement('button');
      b.className = 'nv'; b.setAttribute('data-code', m.code);
      b.setAttribute('data-search', (m.code + ' ' + m.title + ' ' + m.sub + ' ' + t.t).toLowerCase());
      b.innerHTML = '<em>' + esc(m.code) + '</em><span>' + esc(m.title) + '</span>';

  var nEx = MODS.reduce(function(a, m){ return a + (m.ex ? m.ex.filter(function(e){ return !e.ref; }).length : 0); }, 0);
  var nQ  = MODS.reduce(function(a, m){ return a + m.qf.length; }, 0);
  $('railf').innerHTML = '<b>' + mods.length + '</b> modules · <b>' + nEx + '</b> runnable examples<br>' +
    '<b>' + nQ + '</b> quick-fire Q&amp;As<br>' +
    'plans and partitions are measured, not drawn<br>← → move · / search · t tables · d drill · e export';
}

/* ---------- router ---------- */
function buildPager(i){
  var host = mods[i], p = host.querySelector('.pager');
  if(!p){ p = document.createElement('div'); p.className = 'pager'; host.appendChild(p); }
  p.innerHTML = '';
  function mk(j, dir){
    var b = document.createElement('button');
    b.className = 'pg' + (dir === 'next' ? ' nx' : '');
    if(j < 0 || j >= mods.length){ b.disabled = true; b.innerHTML = '<span>' + dir + '</span><b>—</b>'; }
    else {
      b.innerHTML = '<span>' + dir + ' · ' + mods[j].getAttribute('data-code') + '</span><b>' +
        esc(mods[j].getAttribute('data-t')) + '</b>';
      b.addEventListener('click', function(){ go(j); });
    }
    return b;
  }
  p.appendChild(mk(i - 1, 'previous'));
  p.appendChild(mk(i + 1, 'next'));
  if(!host.querySelector('.kbd')){
    var k = document.createElement('div'); k.className = 'kbd';
    k.textContent = '← previous · next → · / search · p practice · d drill · r rates · e export';

  }
}
var wired = {};
function go(i){
  if(i < 0 || i >= mods.length) return;

  mods.forEach(function(m, j){ m.classList.toggle('on', j === i); });
  navBtns.forEach(function(b, j){ b.classList.toggle('on', j === i); });
  var code = mods[i].getAttribute('data-code');
  if(!wired[code]){
    wired[code] = true;
    var m = MODS.filter(function(x){ return x.code === code; })[0];
    if(m) wireModule(m);
  }
  $('topLab').textContent = mods[i].getAttribute('data-grp') || '';
  $('topN').textContent = code + ' · ' + pad2(i + 1) + ' / ' + pad2(mods.length);
  $('tape').style.width = ((i + 1) / mods.length * 100) + '%';
  $('btnDone').classList.toggle('on', !!doneSet[code]);
  buildPager(i);
  window.scrollTo(0, 0);
  railOpen(false);
  if(location.hash !== '#' + mods[i].id){
    try { history.replaceState(null, '', '#' + mods[i].id); } catch(e){ location.hash = mods[i].id; }
  }
}
function railOpen(v){
  $('rail').classList.toggle('open', v);
  $('scrim').classList.toggle('open', v);
}

/* ---------- filter ---------- */
function wireFilter(){
  var inp = $('find');
  inp.addEventListener('input', function(){
    var q = inp.value.trim().toLowerCase();
    navBtns.forEach(function(b){
      var hit = !q || (b.getAttribute('data-search') || '').indexOf(q) >= 0;
      b.classList.toggle('hide', !hit);
    });
    [].slice.call(document.querySelectorAll('.grp')).forEach(function(g){
      var any = [].slice.call(g.querySelectorAll('.nv')).some(function(b){ return !b.classList.contains('hide'); });
      g.classList.toggle('hide', !any);
    });
  });
}

/* ---------- full-text search ---------- */
var SEARCH_IDX = [];
function buildSearchIndex(){
  MODS.forEach(function(m){
    var body = m.body.map(function(b){ return (b.h || '') + ' ' + b.html.replace(/<[^>]+>/g, ' '); }).join(' ');
    var ex = (m.ex || []).map(function(e){ return e.t + ' ' + e.code + ' ' + e.note; }).join(' ');
    SEARCH_IDX.push({ code:m.code, title:m.title, track:m.track,
      text:(m.title + ' ' + m.sub + ' ' + m.lede.replace(/<[^>]+>/g,' ') + ' ' + ex + ' ' + body + ' ' +
            m.call + ' ' + (m.warn||'') + ' ' + m.qf.map(function(p){ return p[0] + ' ' + p[1]; }).join(' ')).replace(/<[^>]+>/g,' ') });
    m.qf.forEach(function(p){ SEARCH_IDX.push({ code:m.code, title:p[0], track:m.track + ' · quick-fire', text:p[0] + ' ' + p[1], qa:p }); });
  });
}
function runSearch(){
  var q = $('srIn').value.trim().toLowerCase(), box = $('srRes');
  if(q.length < 2){ box.innerHTML = '<div class="hint">Type at least two characters. Searches every module, example, query and quick-fire answer.</div>'; return; }
  var hits = [];
  SEARCH_IDX.forEach(function(e){
    var i = e.text.toLowerCase().indexOf(q);
    if(i >= 0) hits.push({ e:e, i:i, score:(e.title.toLowerCase().indexOf(q) >= 0 ? 0 : 1) });
  });
  hits.sort(function(a,b){ return a.score - b.score || a.i - b.i; });
  if(!hits.length){ box.innerHTML = '<div class="hint">No match.</div>'; return; }
  box.innerHTML = hits.slice(0, 40).map(function(h){
    var t = h.e.text, s = Math.max(0, h.i - 60), snip = t.slice(s, h.i + 120).replace(/\s+/g,' ');
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    return '<button class="sr" data-code="' + h.e.code + '"><em>' + esc(h.e.track) + ' · ' + esc(h.e.code) + '</em>' +
      '<b>' + esc(h.e.title) + '</b><span>' + esc(snip).replace(re, '<mark>$1</mark>') + '…</span></button>';
  }).join('');
  [].slice.call(box.querySelectorAll('.sr')).forEach(function(b){
    b.addEventListener('click', function(){
      var code = b.getAttribute('data-code');
      for(var j = 0; j < mods.length; j++) if(mods[j].getAttribute('data-code') === code){ go(j); break; }

}

/* ---------- drill ---------- */
var DRILL = [], di = 0, shown = false;
var DRILL_TRACK = '*';
function buildDrill(){
  DRILL = [];
  MODS.filter(function(m){ return DRILL_TRACK === '*' || m.track === DRILL_TRACK; })
    .forEach(function(m){ m.qf.forEach(function(p){ DRILL.push({ q:p[0], a:p[1], src:m.code + ' · ' + m.title }); }); });
  for(var i = DRILL.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = DRILL[i]; DRILL[i] = DRILL[j]; DRILL[j] = t; }

}
function renderDrill(){
  var c = $('drlBody');
  if(!DRILL.length){ c.innerHTML = '<div class="hint">No questions in that track.</div>'; DRILL_TRACK = '*'; return; }

  var opts = '<option value="*">All tracks</option>';
  ROADMAP.forEach(function(t){
    opts += '<option value="' + esc(t.t) + '"' + (DRILL_TRACK === t.t ? ' selected' : '') + '>' + esc(t.t) + '</option>';
  });
