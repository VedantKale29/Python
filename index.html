<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Bench &mdash; Vedant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#070B14; --panel:#0F1626; --panel-2:#162033; --panel-3:#1B2740;
  --line:#223049; --line-soft:#1A2438;
  --text:#E4EBF5; --muted:#8496B0; --dim:#6C7F9C;
  --signal:#2FD8C6; --signal-soft:rgba(47,216,198,.10); --signal-line:rgba(47,216,198,.32);
  --flag:#F2B33D; --flag-soft:rgba(242,179,61,.10); --flag-line:rgba(242,179,61,.34);
  --wire:#7C9CF5; --wire-soft:rgba(124,156,245,.12);
  --alert:#FF7A7A; --ok:#56E39F; --violet:#B79CF7;
  --r:10px; --sb:296px;
  --d:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  font-weight:300;font-size:15.5px;line-height:1.68;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(900px 520px at 78% -8%, rgba(47,216,198,.055), transparent 62%),
    radial-gradient(760px 480px at 4% 102%, rgba(124,156,245,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px) 0 0/100% 44px;}
::selection{background:rgba(47,216,198,.26)}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:600;line-height:1.2;letter-spacing:-.015em}
a{color:var(--signal)}

/* shell */
.app{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh;position:relative}
.scrim{display:none;position:fixed;inset:0;background:rgba(4,7,13,.66);z-index:39;backdrop-filter:blur(2px)}
.scrim.open{display:block}
.rail{position:fixed;inset:0 auto 0 0;width:var(--sb);height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:contain;
  background:linear-gradient(180deg,#0A1120,#080D18);
  border-right:1px solid var(--line);overflow-y:auto;z-index:40;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;display:flex;flex-direction:column}
.rail::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.brand{padding:22px 20px 15px;border-bottom:1px solid var(--line-soft)}
.brand b{display:block;font-family:'Space Grotesk';font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.brand b i{color:var(--signal);font-style:normal}
.brand span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.18em;color:var(--dim);margin-top:5px;text-transform:uppercase}
.find{padding:13px 14px 4px;position:sticky;top:0;background:linear-gradient(180deg,#0A1120 72%,transparent);z-index:2}
.find input{width:100%;background:#0A101C;border:1px solid var(--line);border-radius:8px;color:var(--text);
  font-family:'IBM Plex Mono';font-size:12px;padding:8px 11px;outline:none;transition:border-color .16s,box-shadow .16s}
.find input:focus{border-color:var(--signal);box-shadow:0 0 0 3px var(--signal-soft)}
.find input::placeholder{color:var(--dim)}
nav{flex:1}
.grp{padding:14px 14px 2px}
.grp.hide{display:none}
.grp-t{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;
  padding:0 8px 8px;display:flex;align-items:center;gap:8px}
.grp-t::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.grp-t u{text-decoration:none;color:var(--line);letter-spacing:.06em}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-family:'IBM Plex Sans';font-size:13.4px;font-weight:400;
  cursor:pointer;transition:background .16s,color .16s;position:relative;line-height:1.35}
.nv:hover{background:rgba(255,255,255,.035);color:var(--text)}
.nv em{font-family:'IBM Plex Mono';font-style:normal;font-size:10.5px;color:var(--dim);min-width:24px;letter-spacing:.04em;transition:color .16s}
.nv.on{background:var(--signal-soft);color:#fff;font-weight:500}
.nv.on em{color:var(--signal)}
.nv.on::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:19px;
  background:var(--signal);border-radius:0 3px 3px 0;box-shadow:0 0 12px var(--signal)}
.nv.done em{color:var(--signal)}
.nv.hide{display:none}
.nv.ok>em{color:var(--ok)}
.nv.ok>em::after{content:'✓';margin-left:3px;font-style:normal}
.rail-f{padding:16px 22px 26px;font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);line-height:1.8;border-top:1px solid var(--line-soft)}
.rail-f b{color:var(--signal);font-weight:500}

/* top bar */
.stage{grid-column:2;min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:13px 40px;
  background:rgba(7,11,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.burger{display:none;background:transparent;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 9px;cursor:pointer;font-size:14px}
.top-lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape{flex:1;height:3px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.tape i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--wire),var(--signal));border-radius:3px;
  transition:width .45s var(--d);box-shadow:0 0 10px rgba(47,216,198,.55)}
.top-n{font-family:'IBM Plex Mono';font-size:11px;color:var(--signal);white-space:nowrap}
.top-acts{display:flex;gap:6px;margin-left:auto;align-items:center}
.tbtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;
  font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;display:flex;align-items:center;gap:6px;min-height:32px;
  transition:border-color .15s,color .15s}
.tbtn:hover{border-color:var(--signal);color:var(--text)}
.tbtn.on{border-color:var(--ok);color:var(--ok);background:rgba(86,227,159,.08)}
.tbtn kbd{font:400 9px/1 'IBM Plex Mono',monospace;opacity:.5;border:1px solid var(--line);border-radius:3px;padding:2px 4px}

/* module */
.mod{display:none;padding:38px 40px 90px;max-width:1120px}
.mod.on{display:block;animation:in .42s var(--d)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal);
  display:flex;align-items:center;gap:10px;margin-bottom:14px}
.eyebrow::after{content:'';flex:1;max-width:120px;height:1px;background:var(--signal-line)}
.mod h1{font-size:clamp(28px,4.4vw,40px);margin-bottom:12px}
.mod h1 small{display:block;font-size:13px;font-weight:400;color:var(--dim);font-family:'IBM Plex Mono';letter-spacing:.05em;margin-top:9px;line-height:1.6}
.lede{font-size:17px;color:#B9C7DA;font-weight:300;max-width:76ch;margin-bottom:30px}
.mod h2{font-size:19px;margin:34px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.mod h2::before{content:'';width:6px;height:6px;background:var(--signal);border-radius:2px;transform:rotate(45deg);flex:none}
.mod h3{font-size:15px;color:var(--signal);margin:22px 0 8px;font-weight:600}
.mod p{max-width:78ch;margin-bottom:13px;color:#C4D0E0}
.mod ul,.mod ol{max-width:78ch;margin:0 0 15px 20px;color:#C4D0E0}
.mod li{margin-bottom:7px}
.mod li::marker{color:var(--signal)}
strong{color:#fff;font-weight:600}
em.hl{font-style:normal;color:var(--flag)}
code{font-family:'IBM Plex Mono';font-size:.87em;background:var(--panel-2);border:1px solid var(--line);padding:1.5px 6px;border-radius:5px;color:var(--signal)}

/* bench panel */
.bench{background:linear-gradient(180deg,var(--panel),#0C1322);border:1px solid var(--line);border-radius:var(--r);
  margin:22px 0 26px;position:relative;overflow:hidden;box-shadow:0 18px 44px -26px rgba(0,0,0,.9)}
.bench::before,.bench::after{content:'';position:absolute;width:11px;height:11px;border:1.5px solid var(--signal-line);pointer-events:none}
.bench::before{top:46px;left:0;border-right:0;border-bottom:0}
.bench::after{bottom:0;right:0;border-left:0;border-top:0}
.bh{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(90deg,rgba(47,216,198,.07),transparent);
  border-bottom:1px solid var(--line);font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--signal)}
.bh h5{font-family:'IBM Plex Mono';font-size:10px;font-weight:500;letter-spacing:.15em}
.bh .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 9px var(--signal);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.32}}
.bh .tag{margin-left:auto;color:var(--dim);letter-spacing:.1em;text-transform:none;font-size:9.5px}
.bb{padding:16px}

/* SQL editor */
.sqlbox{width:100%;background:#080E19;border:1px solid var(--line);border-left:2px solid var(--wire);border-radius:7px;
  color:#C8D6EA;font-family:'IBM Plex Mono';font-size:12.6px;line-height:1.66;padding:12px 14px;outline:none;resize:vertical;
  min-height:70px;tab-size:2;transition:border-color .16s}
.sqlbox:focus{border-color:var(--signal);border-left-color:var(--signal)}
.btn{background:var(--panel-3);border:1px solid var(--line);color:var(--text);padding:8px 15px;border-radius:8px;cursor:pointer;
  font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.06em;transition:all .16s;white-space:nowrap}
.btn:hover{border-color:var(--signal);color:var(--signal);background:var(--signal-soft)}
.btn:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn.pri{background:var(--signal-soft);border-color:var(--signal-line);color:var(--signal)}
.btn.pri:hover{background:rgba(47,216,198,.2)}
.btn.sm{padding:5px 10px;font-size:10.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:11px 0}
.row.end{margin-bottom:0}
.meta{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-left:auto}
.meta b{color:var(--signal);font-weight:500}
.meta.bad b{color:var(--alert)}

/* result grid */
.out{margin-top:4px}
.rwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line-soft);border-radius:8px;background:#0A101C}
table.res{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono';font-size:12.2px;margin:0}
table.res th{background:var(--panel-2);color:var(--signal);font-size:9.8px;letter-spacing:.12em;text-transform:uppercase;
  text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap;position:sticky;top:0}
table.res td{padding:7px 11px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;white-space:nowrap}
table.res tbody tr:last-child td{border-bottom:0}
table.res tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
table.res tbody tr:hover{background:var(--signal-soft)}
table.res td.n{text-align:right;color:#DCE4F0}
table.res td.null{color:var(--dim);font-style:italic}
.err{border:1px solid rgba(255,122,122,.4);border-left:2px solid var(--alert);background:rgba(255,122,122,.07);
  border-radius:7px;padding:11px 13px;font-family:'IBM Plex Mono';font-size:12px;color:#FFC2C2;white-space:pre-wrap}
.zero{font-family:'IBM Plex Mono';font-size:12px;color:var(--flag);border:1px dashed var(--flag-line);
  border-radius:7px;padding:11px 13px;background:var(--flag-soft)}

/* narrative / code */
.pre{font-family:'IBM Plex Mono';font-size:12.4px;background:#080E19;border:1px solid var(--line-soft);
  border-left:2px solid var(--signal);border-radius:7px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;
  color:#B9C7DA;line-height:1.66;margin:12px 0;overflow-x:auto}
.pre.code{border-left-color:var(--wire);color:#C8D6EA}
.pre.note{border-left-color:var(--flag);white-space:normal;font-family:'IBM Plex Sans';font-size:13.6px;color:#B9C7DA}
.pre b{color:var(--flag);font-weight:500}
.pre i{font-style:normal;color:var(--ok)}
.pre u{text-decoration:none;color:var(--alert)}

/* tables in prose */
.mod table:not(.res){width:100%;border-collapse:collapse;margin:14px 0;font-size:13.4px}
.mod table:not(.res) th{background:var(--panel-2);color:var(--signal);font-family:'IBM Plex Mono';font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:500}
.mod table:not(.res) td{padding:9px 12px;border-bottom:1px solid var(--line-soft);color:#C4D0E0;vertical-align:top}
.mod table:not(.res) tbody tr:nth-child(odd){background:rgba(124,156,245,.032)}
.mod table:not(.res) tbody tr:hover{background:var(--signal-soft)}

/* callouts */
.call{border:1px solid var(--flag-line);border-left:3px solid var(--flag);background:var(--flag-soft);border-radius:8px;
  padding:14px 16px;margin:20px 0;max-width:82ch}
.call h4{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--flag);margin-bottom:7px;font-weight:500}
.call p{color:#DCE4F0;margin:0;font-size:14.4px;max-width:none}
.call.warn{border-color:rgba(255,122,122,.34);border-left-color:var(--alert);background:rgba(255,122,122,.07)}
.call.warn h4{color:var(--alert)}

/* quick fire */
.qf{border:1px solid var(--line);border-radius:var(--r);margin:26px 0 8px;background:var(--panel);overflow:hidden}
.qf>summary{padding:13px 16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;
  font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--flag)}
.qf>summary::-webkit-details-marker{display:none}
.qf>summary::before{content:'▸';color:var(--flag);transition:transform .2s;display:inline-block}
.qf[open]>summary::before{transform:rotate(90deg)}
.qf>summary:hover{background:var(--flag-soft)}
.qfb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.qa{padding:11px 0;border-bottom:1px dashed var(--line-soft)}
.qa:last-child{border:0}
.qa q{display:block;color:#fff;font-weight:500;font-size:14px;quotes:none}
.qa q::before{content:'Q. ';color:var(--flag);font-family:'IBM Plex Mono';font-size:11px}
.qa p{margin:5px 0 0;color:var(--muted);font-size:13.6px;max-width:none}

/* pager */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line)}
.pg{flex:1;max-width:320px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 15px;
  cursor:pointer;text-align:left;transition:all .18s;color:var(--text);min-width:0}
.pg:hover{border-color:var(--signal);background:var(--signal-soft);transform:translateY(-2px)}
.pg span{display:block;font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pg b{font-family:'Space Grotesk';font-size:14.5px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.nx{text-align:right}
.pg[disabled]{opacity:.28;pointer-events:none}
.kbd{font-family:'IBM Plex Mono';font-size:10px;color:var(--dim);letter-spacing:.1em;text-align:center;margin-top:18px}

/* overlays */
.ovl{position:fixed;inset:0;background:rgba(4,7,13,.74);backdrop-filter:blur(3px);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:6vh 16px 20px}
.ovl.open{display:flex}
.ovl-card{background:#0C1322;border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.ovl-hd{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line);
  font:500 12.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--text);flex-shrink:0}
.ovl-hd .x{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;
  width:30px;height:30px;cursor:pointer;font-size:13px;line-height:1}
.ovl-hd .x:hover{border-color:var(--alert);color:var(--alert)}
.ovl-bd{padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain}
#srIn{width:100%;background:#080D18;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);
  font-family:inherit;font-size:14.5px;outline:none;margin-bottom:12px}
#srIn:focus{border-color:var(--signal)}
.sr{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;
  padding:9px 11px;margin-bottom:5px;cursor:pointer;color:inherit}
.sr:hover,.sr.sel{background:rgba(47,216,198,.07);border-color:rgba(47,216,198,.30)}
.sr em{display:block;font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.sr b{display:block;font-weight:500;font-size:14px;color:var(--text);line-height:1.4}
.sr span{display:block;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.sr mark{background:rgba(242,179,61,.24);color:var(--flag);border-radius:2px;padding:0 1px}
.hint{color:var(--dim);font-size:13px;line-height:1.6;padding:10px 2px}
.drl-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 12px}
.drl-bar i{display:block;height:100%;background:var(--signal);width:0;transition:width .3s}
.drl-q{font-size:17px;line-height:1.5;font-weight:500;color:var(--text);margin:14px 0 6px}
.drl-src{font:400 9.5px/1.4 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.drl-a{background:rgba(47,216,198,.06);border-left:2px solid var(--signal);border-radius:0 8px 8px 0;padding:12px 14px;
  font-size:14px;line-height:1.65;color:var(--muted);margin-bottom:14px}
.orow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:4px}
.obtn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:8px 13px;cursor:pointer;
  font:500 12px/1 'IBM Plex Sans',sans-serif;min-height:38px}
.obtn:hover{border-color:var(--signal);color:var(--text)}
.obtn.pri{border-color:var(--signal);color:var(--signal)}

/* schema browser */
.sch{margin-bottom:16px}
.sch h4{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:6px}
.sch p{font-size:12.8px;color:var(--muted);margin-bottom:7px}
.sch .cols{font-family:'IBM Plex Mono';font-size:11.5px;color:#B9C7DA;background:#080E19;border:1px solid var(--line-soft);
  border-radius:6px;padding:8px 10px;line-height:1.8}
.sch .cols b{color:var(--flag);font-weight:500}

/* mobile */
@media(max-width:760px){
  .mod table:not(.res){display:block;overflow-x:auto;font-size:12.5px}
  .mod h2{font-size:17px} .mod h3{font-size:14px}
  .lede{font-size:15.5px} .mod p,.mod li{font-size:14.5px}
  .pre{font-size:11.4px;padding:10px 11px}
  .sqlbox{font-size:11.8px}
  .bh{flex-wrap:wrap;row-gap:4px} .bh .tag{margin-left:0}
  .call{padding:12px 13px} .qa q{font-size:13.5px} .qa p{font-size:13px}
  .meta{margin-left:0;width:100%}
}
@media(max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{width:min(88vw,300px);transform:translateX(-100%);transition:transform .26s var(--d);box-shadow:none;visibility:hidden}
  .rail.open{transform:none;visibility:visible;box-shadow:0 0 44px rgba(0,0,0,.6)}
  .burger{min-width:44px;min-height:40px;font-size:17px;line-height:1;display:block}
  .stage{grid-column:1}
  .top{padding:12px 18px}
  .mod{padding:26px 18px 70px}
  .top-acts .lbl{display:none}
  .tbtn{padding:5px 8px} .tbtn kbd{display:none}
  .ovl{padding:0}

/* ---------- export / night-before sheet ---------- */
.ex-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ex-tab{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:7px 12px;

.ex-opts select:focus{border-color:var(--signal)}
.ex-count{font:400 10.5px/1.4 'IBM Plex Mono',monospace;color:var(--dim);letter-spacing:.08em;margin-left:auto}
.sheet{background:#0A101C;border:1px solid var(--line-soft);border-radius:9px;padding:16px 18px;max-height:52vh;overflow-y:auto}
.sheet h3{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--signal);

.sheet h3:first-child{margin-top:0}
.sheet h4{font-family:'Space Grotesk';font-size:13.5px;color:var(--flag);margin:14px 0 6px;font-weight:600}
.sheet .sq{color:#fff;font-weight:500;font-size:13.5px;margin-top:9px}
.sheet .sq::before{content:'Q. ';color:var(--flag);font-family:'IBM Plex Mono';font-size:10.5px}
.sheet .sa{color:var(--muted);font-size:13px;margin:3px 0 0 0;line-height:1.6}
.sheet .sa::before{content:'A. ';color:var(--signal);font-family:'IBM Plex Mono';font-size:10.5px}
.sheet blockquote{border-left:2px solid var(--flag);background:var(--flag-soft);border-radius:0 7px 7px 0;
  padding:9px 12px;margin:7px 0;color:#DCE4F0;font-size:13.5px;line-height:1.6}
.sheet .strap{border-left:2px solid var(--alert);background:rgba(255,122,122,.07);border-radius:0 7px 7px 0;
  padding:8px 12px;margin:6px 0 0;color:#FFC2C2;font-size:12.6px;line-height:1.55}
.sheet .strap::before{content:'TRAP · ';font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.14em}
.sheet pre{font-family:'IBM Plex Mono';font-size:11.6px;background:#070C16;border:1px solid var(--line-soft);
  border-left:2px solid var(--wire);border-radius:6px;padding:9px 11px;white-space:pre-wrap;color:#C8D6EA;
  line-height:1.6;margin:5px 0;overflow-x:auto}
.sheet .snote{color:var(--dim);font-size:12.2px;line-height:1.55;margin:4px 0 0}
.sheet code{font-size:.88em}

/* ---------- print: the sheet only ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff!important;color:#111!important;font-size:10.5pt;line-height:1.45}
  body::before{display:none!important}
  .rail,.top,.scrim,.pager,.kbd,.bench,.ex-tabs,.ex-opts,.ovl-hd,.orow,.drl-bar{display:none!important}
  .app{display:block!important}
  .ovl{position:static!important;display:block!important;background:#fff!important;padding:0!important;backdrop-filter:none!important}
  .ovl:not(.open){display:none!important}
  .ovl-card{border:0!important;box-shadow:none!important;max-height:none!important;height:auto!important;width:100%!important}
  .ovl-bd{overflow:visible!important;padding:0!important}
  #drlOvl{display:none!important}
  .sheet{max-height:none!important;overflow:visible!important;background:#fff!important;border:0!important;padding:0!important}
  .sheet h3{color:#000!important;border-bottom:1.5pt solid #000!important;font-size:9.5pt;margin:16pt 0 6pt;
    break-after:avoid;page-break-after:avoid}
  .sheet h4{color:#000!important;font-size:11pt;margin:10pt 0 3pt;break-after:avoid;page-break-after:avoid}
  .sheet .sq{color:#000!important;font-size:10pt;break-inside:avoid;page-break-inside:avoid}
  .sheet .sa{color:#333!important;font-size:9.5pt}
  .sheet .sq,.sheet .sa{orphans:3;widows:3}
  .sheet blockquote{border-left:2pt solid #666!important;background:#f4f4f4!important;color:#000!important;
    break-inside:avoid;page-break-inside:avoid}
  .sheet .strap{border-left:2pt solid #999!important;background:#f8f8f8!important;color:#222!important}
  .sheet pre{background:#f6f6f6!important;color:#111!important;border:1px solid #ccc!important;font-size:8.6pt;
    break-inside:avoid;page-break-inside:avoid}
  .sheet .snote{color:#444!important}
  .sheet code{background:#eee!important;color:#111!important;border:0!important}
  .mod{display:none!important}
}

.gb i{font-style:normal;font:400 10.5px/1 'IBM Plex Mono',monospace;color:var(--muted);min-width:96px;text-align:right;flex:none;

.gb u{text-decoration:none;flex:1;height:15px;background:var(--line-soft);border-radius:3px;overflow:hidden;display:block}

.gb.hot u s{background:linear-gradient(90deg,var(--flag),var(--alert))}
.gb b{font:500 11px/1 'IBM Plex Mono',monospace;color:var(--signal);min-width:70px;flex:none}
canvas.plot{width:100%;height:200px;display:block;background:#080E19;border:1px solid var(--line-soft);border-radius:7px;margin:12px 0}

.trace .tr span s{text-decoration:none;color:var(--alert)}
.rates{margin:10px 0 4px}
.rates .rrow{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.rates .rrow label{font:400 11px/1.3 'IBM Plex Mono',monospace;color:var(--muted);flex:1;min-width:150px}
.rates .rrow input{width:120px;background:#080E19;border:1px solid var(--line);border-radius:6px;color:var(--signal);
  font-family:'IBM Plex Mono';font-size:11.5px;padding:6px 8px;outline:none}
.rates .rrow input:focus{border-color:var(--signal)}
.rates .rrow em{font-style:normal;font:400 10px/1 'IBM Plex Mono',monospace;color:var(--dim);min-width:88px}
.prOpts{display:grid;gap:7px;margin-bottom:12px}
.prOpts .obtn{text-align:left;padding:11px 13px;line-height:1.5;min-height:auto;font-size:13.5px}
.prOpts .obtn:hover{background:var(--signal-soft)}

/* ---------- spark: code editor, plan and partition histogram ---------- */
.pybox{width:100%;background:#080E19;border:1px solid var(--line);border-left:2px solid var(--flag);border-radius:7px;
  color:#C8D6EA;font-family:'IBM Plex Mono';font-size:12.6px;line-height:1.66;padding:12px 14px;outline:none;
  resize:vertical;min-height:80px;tab-size:2;transition:border-color .16s}
.pybox:focus{border-color:var(--signal);border-left-color:var(--signal)}

  border-radius:7px;padding:10px 12px;margin:12px 0;overflow-x:auto}
.plan .pl{display:flex;gap:9px;align-items:baseline;padding:3px 0;white-space:nowrap}

.plan .pl.wide b{color:var(--alert)}
.plan .pl.scan b{color:var(--wire)}
.plan .pl span{color:#C8D6EA}
.plan .pl i{font-style:normal;color:var(--dim)}

  min-height:2px;position:relative}

  font:500 9px/1 'IBM Plex Mono',monospace;color:var(--muted)}

.pyout{font-family:'IBM Plex Mono';font-size:12.6px;line-height:1.65;background:#080E19;
  border:1px solid var(--line-soft);border-left:2px solid var(--ok);border-radius:7px;

.cols{font-family:'IBM Plex Mono';font-size:12px;line-height:2;color:var(--muted)}
.cols b{color:var(--wire);font-weight:500}

<script>
/* ============================================================
   MINI-PYTHON — a real interpreter for a large subset of Python.
   Indentation-aware tokenizer, full expression grammar, and an
   evaluator whose statement executor is a JS generator, so Python
   `yield` genuinely suspends: infinite generators work.
   ============================================================ */
(function (root) {
'use strict';

var KEYWORDS = ['False','None','True','and','as','assert','break','class','continue','def','del',
  'elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal',
  'not','or','pass','raise','return','try','while','with','yield'];
var OPS3 = ['**=','//=','>>=','<<=','...'];
var OPS2 = ['**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','->',':=','|=','&=','^=','<<','>>'];
var OPS1 = '+-*/%<>=(){}[],:.;@|&^~';

function SynErr(msg, line){ var e = new Error(msg); e.pyLine = line; e.pySyntax = true; return e; }

function tokenize(src){
  var toks = [], indents = [0], i = 0, line = 1, n = src.length, depth = 0, bol = true;
  function push(t, v){ toks.push({ t:t, v:v, line:line }); }
  while(i < n){
    if(bol && depth === 0){
      var col = 0, j = i;
      while(j < n && (src[j] === ' ' || src[j] === '\t')){ col += src[j] === '\t' ? 8 : 1; j++; }
      if(j >= n || src[j] === '\n' || src[j] === '#'){
        while(j < n && src[j] !== '\n') j++;
        if(j < n){ j++; line++; }
        i = j; continue;
      }
      i = j;
      if(col > indents[indents.length-1]){ indents.push(col); push('INDENT'); }
      else while(col < indents[indents.length-1]){
        indents.pop(); push('DEDENT');
        if(col > indents[indents.length-1]) throw SynErr('unindent does not match any outer indentation level', line);
      }
      bol = false; continue;
    }
    var c = src[i];
    if(c === '\n'){ line++; i++; if(depth === 0){ push('NEWLINE'); bol = true; } continue; }
    if(c === ' ' || c === '\t' || c === '\r'){ i++; continue; }
    if(c === '\\' && src[i+1] === '\n'){ i += 2; line++; continue; }
    if(c === '#'){ while(i < n && src[i] !== '\n') i++; continue; }
    if(c === '"' || c === "'" || (/[fFrRbB]/.test(c) && (src[i+1] === '"' || src[i+1] === "'"))){
      var isF = false, isR = false;
      while(/[fFrRbB]/.test(src[i])){ if(/[fF]/.test(src[i])) isF = true; if(/[rR]/.test(src[i])) isR = true; i++; }
      var q = src[i], triple = src[i+1] === q && src[i+2] === q;
      i += triple ? 3 : 1;
      var buf = '';
      for(;;){

/* ---------------- parser ---------------- */
function P(src){ this.toks = tokenize(src); this.p = 0; }

 ['Why is `x is 5` dangerous?', 'It works only because small integers are cached; larger values silently compare False.'],
 ['What makes a function pure?', 'It reads its inputs and returns a new object, without modifying what was passed in.'],
 ['Why do pure functions matter in a pipeline?', 'They are testable in isolation and re-running them cannot corrupt caller state.']
]});

M.push({
code: 'N2', track: 'Level 1 · How Python stores data',
title: 'Mutable versus immutable',
sub: 'Which objects can change under you — and which quietly make a new one.',
lede: 'Some objects can be modified in place; some cannot. That single distinction decides whether the aliasing from N1 is a problem or a non-event, and it is the reason <code>+=</code> behaves differently on a list and on a number.',
ex: [
 { t: 'Immutable: "changing" makes a new object',
   code: "s = \"hello\"\nbefore = id(s)\ns = s + \" world\"\nafter = id(s)\n\nprint(s)\nprint(\"same object?\", before == after)\n\nn = 5\nb = n\nn += 1\nprint(\"n:\", n, \" b:\", b)",
   note: 'Strings, numbers and tuples cannot be edited. `s + " world"` builds a new string and rebinds the label, so anyone else holding the old string still sees "hello". This is why immutable types are safe to share.' },
 { t: 'Mutable: the object itself changes',
   code: "xs = [1, 2]\nys = xs\nxs += [3]\nprint(\"xs:\", xs, \" ys:\", ys, \" same:\", xs is ys)\n\na = (1, 2)\nb = a\na += (3,)\nprint(\"a: \", a, \"  b: \", b, \"  same:\", a is b)",
   note: 'For a list, `+=` mutates in place and both names see it. For a tuple, `+=` cannot mutate, so it builds a new tuple and rebinds only the local name. Same operator, opposite behaviour — decided entirely by mutability.' },
 { t: 'Only immutable things can be dict keys',
   code: "d = {}\nd[(\"2026-02-01\", \"w-1\")] = 42\nprint(\"tuple key works:\", d)\n\ntry:\n    d[[\"2026-02-01\", \"w-1\"]] = 42\nexcept TypeError as e:\n    print(\"list key fails:\", e)",
   note: 'A dict key must hash to a stable value. A list can change after insertion, which would strand the entry in the wrong bucket, so Python refuses. This is why composite keys are tuples.' },
 { t: 'The pipeline consequence',
   code: "DEFAULT_TAGS = [\"clean\"]\n\ndef label(txn, tags=DEFAULT_TAGS):\n    tags.append(txn[\"id\"])\n    return tags\n\nprint(label({\"id\": \"t1\"}))\nprint(label({\"id\": \"t2\"}))\nprint(\"shared constant is now:\", DEFAULT_TAGS)",
   note: 'A module-level mutable constant passed as a default is shared by every call. The "constant" grows on every invocation, and in a long-running worker it grows until the process dies.' }
],
body: [
 { h: 'The two categories', html:
   '<table><thead><tr><th>Immutable</th><th>Mutable</th></tr></thead><tbody><tr><td><code>int</code>, <code>float</code>, <code>bool</code></td><td><code>list</code></td></tr><tr><td><code>str</code></td><td><code>dict</code></td></tr><tr><td><code>tuple</code></td><td><code>set</code></td></tr><tr><td><code>frozenset</code></td><td>most custom classes</td></tr></tbody></table><p>A tuple is immutable, but a tuple <em class="hl">containing</em> a list is only shallowly so — the outer structure is fixed and the inner list can still change. That is exactly the shallow-versus-deep copy question in N3.</p>' },
 { h: 'Why it matters operationally', html:
   '<ul><li><strong>Immutable objects are safe to share</strong> across functions, threads and caches.</li><li><strong>Mutable objects need an owner.</strong> Decide who is allowed to modify a structure, and have everyone else copy.</li><li><strong>Mutation makes retries unsafe.</strong> If a step edits its input, re-running it after a partial failure applies the change twice.</li></ul>' }
],
call: '"Mutability decides whether aliasing is a problem: an immutable object can be shared freely because \'changing\' it produces a new object, while a mutable one needs a single owner. It is also why += mutates a list in place but rebinds a tuple — same operator, opposite behaviour."',
warn: 'A mutable module-level constant passed as a default argument is shared across every call. It is not a constant at all — it accumulates on each invocation, and in a long-running worker that is a memory leak that only appears in production.',
qf: [
 ['Name the immutable built-in types.', 'int, float, bool, str, tuple, frozenset.'],
 ['Why must dict keys be immutable?', 'The key must hash to a stable value; a mutable key could change after insertion and strand the entry.'],
 ['Why does += differ on lists and tuples?', 'On a list it mutates in place so all aliases see it; on a tuple it must build a new object and rebind only the local name.'],
 ['Is a tuple containing a list immutable?', 'Only shallowly — the tuple cannot be reassigned but the inner list can still change.'],
 ['Why does mutation make retries unsafe?', 'Re-running a step that edited its input applies the change twice.'],
 ['What is the safest default for a transform?', 'Take input, return a new object, modify nothing.']
]});

M.push({
code: 'N3', track: 'Level 1 · How Python stores data',
title: 'The mutable default argument',
sub: 'A default is evaluated once, when the function is defined — not on each call.',
lede: 'This is the most quoted Python gotcha, and with N1 and N2 behind you the cause is obvious rather than mysterious: the default value is an object created at <em class="hl">definition</em> time and reused by every call that does not override it. If that object is mutable, every call shares it.',
ex: [
 { t: 'The bug, watched happening',
   code: "def collect(txn_id, batch=[]):\n    batch.append(txn_id)\n    return batch\n\nprint(\"call 1:\", collect(\"t1\"))\nprint(\"call 2:\", collect(\"t2\"))\nprint(\"call 3:\", collect(\"t3\"))\nprint(\"still one shared list:\", collect(\"t4\") is collect(\"t5\"))",
   note: 'Each call appends to the same list, so it grows forever. In a short script you would notice. In a long-running worker the list is a memory leak that only shows up after hours — and the function looks completely reasonable.' },
 { t: 'Why: the default is one object',
   code: "def f(batch=[]):\n    return id(batch)\n\nfirst = f()\nsecond = f()\nprint(\"same default object every call:\", first == second)\n\ndef g(batch=None):\n    if batch is None:\n        batch = []\n    return id(batch)\n\nprint(\"fresh object every call:\", g() != g())",
   note: 'The proof. The default list is created once and its identity never changes. The None-sentinel version creates a new list inside the body, so each call gets its own.' },
 { t: 'The fix',
   code: "def collect(txn_id, batch=None):\n    if batch is None:\n        batch = []\n    batch.append(txn_id)\n    return batch\n\nprint(\"call 1:\", collect(\"t1\"))\nprint(\"call 2:\", collect(\"t2\"))\nprint(\"explicit batch:\", collect(\"t3\", [\"seed\"]))",
   note: 'None as the sentinel, then build the real default inside the body. Note it still accepts a caller-supplied list, which is the behaviour you wanted all along.' },
 { t: 'Immutable defaults are fine',
   code: "def tag(txn_id, prefix=\"txn\", limit=10, opts=()):\n    return f\"{prefix}-{txn_id}-{limit}-{len(opts)}\"\n\nprint(tag(\"t1\"))\nprint(tag(\"t2\", \"load\", 5, (\"a\", \"b\")))",
   note: 'Strings, numbers and tuples cannot be mutated, so sharing one across calls is harmless. The rule is not "never use defaults" — it is "never use a mutable default".' }
],
body: [
 { h: 'The rule', html:
   '<div class="pre code">def f(x, acc=[]):      <u>evaluated ONCE at definition — shared by every call</u>\ndef f(x, acc=None):    <i>the sentinel; build the real default in the body</i>\n    if acc is None:\n        acc = []</div><p>The same trap applies to <code>{}</code>, <code>set()</code>, and any object built by calling something — including <code>datetime.now()</code>, which freezes at import time rather than moving with each call.</p>' },
 { h: 'Where it bites in a pipeline', html:
   '<ul><li><strong>An accumulator default</strong> that collects rows across unrelated runs.</li><li><strong>A cache or config dict default</strong> that one caller mutates and everyone else inherits.</li><li><strong>A timestamp default</strong> that is the moment the module was imported, not the moment of the call — so every record gets the same "current" time.</li></ul>' }
],
call: '"A default argument is evaluated once at definition time, so a mutable default is shared by every call — which makes it an accumulator nobody asked for. I use None as the sentinel and build the real default inside the body, and the same rule catches datetime.now() defaults that freeze at import."',
warn: 'A `datetime.now()` default freezes at import time. Every row written by that job gets the same "current" timestamp, which looks plausible on a dashboard and makes any freshness or lateness calculation silently wrong.',
qf: [
 ['When is a default argument evaluated?', 'Once, when the function is defined.'],
 ['Why is a mutable default dangerous?', 'Every call shares the same object, so it accumulates across calls.'],
 ['What is the fix?', 'Use None as a sentinel and create the real default inside the body.'],
 ['Are immutable defaults safe?', 'Yes — strings, numbers and tuples cannot be mutated.'],
 ['What non-obvious default has the same problem?', 'datetime.now() — it freezes at import time rather than evaluating per call.'],
 ['How would you spot it in review?', 'Any default that is [], {}, set(), or a function call.']
]});

M.push({
code: 'N4', track: 'Level 1 · How Python stores data',
title: 'Copying: shallow versus deep',
sub: 'A shallow copy duplicates the container. The things inside are still shared.',
lede: 'You now know <code>=</code> does not copy. So how do you copy? There are two kinds, they differ only for nested data, and picking the wrong one produces a bug that passes every test written on flat structures.',
ex: [
 { t: 'Shallow copy: outer new, inner shared',
   code: "import json\n\noriginal = [{\"id\": \"t1\", \"tags\": [\"clean\"]}]\nshallow = list(original)\n\nprint(\"outer is a new list: \", shallow is not original)\nprint(\"inner dicts shared:  \", shallow[0] is original[0])\n\nshallow[0][\"tags\"].append(\"suspicious\")\nprint(\"original changed too:\", original[0][\"tags\"])",
   note: 'list() copied the outer list, so appending a whole new dict to `shallow` would not touch `original`. But the dicts inside are the same objects, so editing one is visible through both. This is the copy that looks like it worked.' },
 { t: 'The flat case, where shallow is enough',
   code: "original = [1, 2, 3]\nshallow = list(original)\nshallow.append(4)\n\nprint(\"original:\", original)\nprint(\"copy:    \", shallow)",
   note: 'With immutable elements there is nothing shared that can change, so a shallow copy is a real copy. This is why the bug survives testing — the test data is flat and the production data is nested.' },
 { t: 'Deep copy: everything duplicated',
   code: "def deepcopy_rows(rows):\n    return [dict(r, tags=list(r[\"tags\"])) for r in rows]\n\noriginal = [{\"id\": \"t1\", \"tags\": [\"clean\"]}]\ndeep = deepcopy_rows(original)\n\ndeep[0][\"tags\"].append(\"suspicious\")\nprint(\"original:\", original[0][\"tags\"])\nprint(\"copy:    \", deep[0][\"tags\"])\nprint(\"independent:\", original[0][\"tags\"] != deep[0][\"tags\"])",
   note: 'Copying each level explicitly. In real code `copy.deepcopy` does this for arbitrary structures, but writing the one level you actually need is faster and makes the intent obvious.' },
 { t: 'The three ways to shallow-copy',
   code: "original = [1, 2, 3]\n\na = list(original)\nb = original[:]\nc = original.copy()\n\nprint(a == b == c == original)\nprint(a is not original, b is not original, c is not original)",
   note: 'All three are the same operation. `[:]` is terse and idiomatic; `list()` is clearest when the input might be a generator or tuple, because it also converts.' }
],
body: [
 { h: 'Which to use', html:
   '<table><thead><tr><th>Situation</th><th>Copy</th></tr></thead><tbody><tr><td>Flat list of numbers or strings</td><td>Shallow — <code>list(xs)</code></td></tr><tr><td>List of dicts you will edit</td><td>Deep, or rebuild each dict</td></tr><tr><td>Config you pass to callers</td><td>Deep, or make it immutable</td></tr><tr><td>A million records in a loop</td><td><b>Neither</b> — restructure so no copy is needed</td></tr></tbody></table>' },
 { h: 'The cost', html:
   '<p><code>deepcopy</code> walks the entire structure, allocating as it goes. Deep-copying a million records inside a loop is a real performance defect — copy the small thing (the config, the template), not the large one (the data).</p><p>The better answer is usually to avoid the copy: if your transforms are pure, as in N1, nothing needs defending and no copy is required.</p>' }
],
call: '"A shallow copy duplicates the container while the objects inside stay shared, which is why it passes tests on flat data and fails on nested records. But the better fix is usually to make the transform pure so no copy is needed at all — deep-copying a million records in a loop is a defect of its own."',
warn: 'A shallow copy of a list of dicts looks correct and is not. Every test written on a flat list passes, and the first nested structure in production shares its inner objects with the original.',
qf: [
 ['What does a shallow copy duplicate?', 'The outer container only — inner objects stay shared.'],
 ['When is a shallow copy sufficient?', 'When the elements are immutable.'],
 ['Name three ways to shallow-copy a list.', 'list(xs), xs[:], xs.copy().'],
 ['What does deepcopy cost?', 'It walks the whole structure — expensive on large data and wrong inside a hot loop.'],
 ['What is better than copying?', 'Pure transforms that return new objects, so nothing needs defending.'],
 ['Why does the bug survive testing?', 'Test fixtures are usually flat; the sharing only matters when data is nested.']
]});

M.push({
code: 'M1', track: 'Level 2 · Memory and volume',
title: 'Generators: process one item at a time',
sub: 'Square brackets build the whole list first. That is the line that kills the job.',
lede: 'A list comprehension materialises every element before the next line runs. On ten thousand rows that is invisible; on ten million it is the difference between a job that finishes and a worker that is killed. A generator produces items on demand and holds one at a time.',
ex: [
 { t: 'List versus generator: what gets built',
   code: "def source(n):\n    for i in range(n):\n        yield {\"id\": i, \"amount\": i * 10}\n\nrows = list(source(5))\nprint(\"list built:\", rows)\n\ngen = (r for r in source(5))\nprint(\"generator:  built nothing yet\")\nprint(\"first item:\", next(gen))\nprint(\"second:    \", next(gen))",
   note: 'The list exists in full the moment it is created. The generator has produced nothing until you ask. The square brackets are the decision point — everything else in this level follows from choosing them or not.' },
 { t: 'A generator holds no length and no index',
   code: "def source(n):\n    for i in range(n):\n        yield i\n\ngen = source(5)\ntry:\n    print(len(gen))\nexcept TypeError as e:\n    print(\"no len():\", e)\n\ntry:\n    print(gen[2])\nexcept TypeError as e:\n    print(\"no indexing:\", e)",
   note: 'The trade-off, stated by the interpreter. A generator does not know how many items it will produce until it has produced them, so it cannot answer len() and cannot be indexed. If you need either, you need a list.' },
 { t: 'Single pass: consuming exhausts it',
   code: "def source(n):\n    for i in range(n):\n        yield i\n\ngen = source(3)\nprint(\"first pass: \", list(gen))\nprint(\"second pass:\", list(gen))\nprint(\"the data is gone, not cached\")",
   note: 'This is the failure people hit first. You loop once to count and again to process, and the second loop sees nothing — with no error. If you need two passes, either materialise deliberately with list() or build the generator twice.' },
 { t: 'An infinite source, safely bounded',
   code: "from itertools import count, islice\n\ndef transaction_ids():\n    for n in count(1):\n        yield f\"t-{n:05d}\"\n\nfirst_five = list(islice(transaction_ids(), 5))\nprint(first_five)\nprint(\"the generator is still open; nothing was materialised\")",
   note: 'count() never ends. Wrapping it in list() would run until the process died, but islice takes what it needs and stops. This only works because the generator is genuinely lazy — which the engine running this page implements for real.' },
 { t: 'The pipeline shape',
   code: "def read(n):\n    for i in range(n):\n        yield {\"id\": f\"t-{i}\", \"amount\": float(i * 7 % 50)}\n\ndef clean(rows):\n    for r in rows:\n        if r[\"amount\"] > 0:\n            yield r\n\ndef enrich(rows):\n    for r in rows:\n        yield dict(r, band=\"large\" if r[\"amount\"] >= 30 else \"small\")\n\npipeline = enrich(clean(read(10)))\n\nseen = 0\nfor row in pipeline:\n    print(row)\n    seen += 1\n    if seen == 3:\n        break\nprint(\"stopped early \u2014 rows 4..9 were never read\")",
   note: 'Three stages composed, and still only one row in memory at a time — nothing is materialised until the final loop. This is the shape to reach for: each stage a generator, composed at the end.' }
],
body: [
 { h: 'The trade-off, stated plainly', html:
   '<table><thead><tr><th></th><th>List</th><th>Generator</th></tr></thead><tbody><tr><td>Memory</td><td>All items</td><td><b>One item</b></td></tr><tr><td><code>len()</code></td><td>Yes</td><td>No</td></tr><tr><td>Indexing</td><td>Yes</td><td>No</td></tr><tr><td>Re-iterate</td><td>Yes</td><td><b>No — single pass</b></td></tr><tr><td>Right when</td><td>Small, or needed twice</td><td>Large, or streaming</td></tr></tbody></table>' },
 { h: 'The syntax difference is one character', html:
   '<div class="pre code">[r for r in rows]     <u>list — builds everything now</u>\n(r for r in rows)     <i>generator — builds nothing until asked</i>\n\nsum(x for x in rows)  <i>no brackets needed inside a call</i></div><p>Because the difference is so small, it is worth reading every comprehension in a pipeline and asking whether the list is needed. Most are not.</p>' },
 { h: 'When a list is the right answer', html:
   '<ul><li><strong>You need it twice.</strong> Materialise once rather than rebuilding the source.</li><li><strong>You need len() or an index.</strong></li><li><strong>It is small and known-bounded</strong> — a config, a lookup table, a batch of a thousand.</li><li><strong>You are about to sort it.</strong> Sorting needs every element anyway.</li></ul>' }
],
call: '"A list comprehension materialises everything before the next line runs, so on a large source it is the line that kills the worker. I default to generators for anything row-shaped and materialise deliberately when I need a second pass, a length or an index — and the cost of that choice is that a generator is single-use."',
warn: 'Consuming a generator twice gives you nothing the second time, with no error. Counting the rows and then processing them is the classic version — the count is right, the processing loop is empty, and the job reports success.',
qf: [
 ['What does a generator hold in memory?', 'One item at a time, not the whole collection.'],
 ['What can a list do that a generator cannot?', 'len(), indexing, and being iterated more than once.'],
 ['What happens on a second pass over a generator?', 'Nothing — it is exhausted, and there is no error.'],
 ['What is the syntax difference?', 'Square brackets build a list; parentheses build a generator.'],
 ['How do you take the first N of an infinite source?', 'itertools.islice — list() would never terminate.'],
 ['When is a list the right choice?', 'When it is small, or you need it twice, or you need len() or indexing.']
]});

M.push({
code: 'M2', track: 'Level 2 · Memory and volume',
title: 'Chunking and the escalation ladder',
sub: 'One row at a time is not always right — and a bigger machine is the last resort, not the first.',
lede: 'Row-at-a-time is memory-safe and can be slow: a database insert per row means a network round trip per row. Chunking is the middle ground. And when someone asks what you would do with a 10 GB file and 8 GB of RAM, the answer is a ladder of cheap options long before "get a bigger machine".',
ex: [
 { t: 'Batching a generator into chunks',
   code: "def read(n):\n    for i in range(n):\n        yield {\"id\": f\"t-{i}\", \"amount\": i}\n\ndef chunked(rows, size):\n    batch = []\n    for r in rows:\n        batch.append(r)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch\n\nfor i, batch in enumerate(chunked(read(11), 4)):\n    print(f\"batch {i}: {len(batch)} rows, ids {batch[0]['id']}..{batch[-1]['id']}\")",
   note: 'Memory holds one chunk, not the file. The final partial batch is the part people forget — without the trailing `if batch:` the last rows are silently dropped, which is a data-loss bug that only appears when the row count is not a multiple of the chunk size.' },
 { t: 'Proving the trailing batch matters',
   code: "def chunked_broken(rows, size):\n    batch = []\n    for r in rows:\n        batch.append(r)\n        if len(batch) == size:\n            yield batch\n            batch = []\n\ndef chunked_ok(rows, size):\n    batch = []\n    for r in rows:\n        batch.append(r)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch\n\nrows = list(range(10))\nprint(\"broken total:\", sum(len(b) for b in chunked_broken(rows, 4)))\nprint(\"correct total:\", sum(len(b) for b in chunked_ok(rows, 4)))",
   note: 'Ten rows in, eight out. Two rows vanish with no error and no exception — the job succeeds and the target is short. Always reconcile counts across a chunking boundary.' },
 { t: 'Aggregating without materialising',
   code: "def read(n):\n    for i in range(n):\n        yield {\"wallet\": f\"w-{i % 3}\", \"amount\": float(i * 10)}\n\ntotals = {}\ncount = 0\nfor r in read(9):\n    totals[r[\"wallet\"]] = totals.get(r[\"wallet\"], 0) + r[\"amount\"]\n    count += 1\n\nprint(\"rows seen:\", count)\nfor w in sorted(totals):\n    print(f\"  {w}: {totals[w]:,.2f}\")\nprint(\"memory held: one row plus the totals dict\")",
   note: 'A running aggregate needs only the accumulator, not the data. This is the pattern that lets you summarise a file far larger than memory — and it is exactly what Spark’s partial aggregate does, one machine at a time.' },
 { t: 'Reduce the data before you reduce the problem',
   code: "rows = [\n    {\"id\": \"t1\", \"amount\": 100.0, \"notes\": \"x\" * 200, \"raw\": \"y\" * 500},\n    {\"id\": \"t2\", \"amount\": 250.0, \"notes\": \"x\" * 200, \"raw\": \"y\" * 500},\n]\n\nwide = sum(len(str(v)) for r in rows for v in r.values())\nnarrow_rows = [{\"id\": r[\"id\"], \"amount\": r[\"amount\"]} for r in rows]\nnarrow = sum(len(str(v)) for r in narrow_rows for v in r.values())\n\nprint(\"all columns: \", wide, \"chars\")\nprint(\"two columns: \", narrow, \"chars\")\nprint(\"reduction:   \", f\"{(1 - narrow/wide):.0%}\")",
   note: 'Projecting to the columns you need is the cheapest win available and it happens before any of the harder options. The same principle as column pruning in Parquet — do not read what you will not use.' }
],
body: [
 { h: 'The escalation ladder', html:
   '<p>The answer to "10 GB file, 8 GB of RAM":</p><table><thead><tr><th>#</th><th>Step</th><th>Cost</th></tr></thead><tbody><tr><td>1</td><td><b>Read fewer columns</b></td><td>Free</td></tr><tr><td>2</td><td><b>Stream it</b> — generators, one row at a time</td><td>Free</td></tr><tr><td>3</td><td><b>Chunk it</b> — batch for throughput</td><td>Free</td></tr><tr><td>4</td><td>Use smaller types — int32, category</td><td>Small change</td></tr><tr><td>5</td><td>Change format — CSV to Parquet</td><td>One conversion</td></tr><tr><td>6</td><td>Push the work to the database or warehouse</td><td>Design change</td></tr><tr><td>7</td><td>Distribute it — Spark</td><td>Real complexity</td></tr><tr><td>8</td><td>Bigger machine</td><td>Money, and it does not scale</td></tr></tbody></table><p>Reaching for step 7 or 8 first is the answer that loses marks. Steps 1 to 3 solve most real cases and cost nothing.</p>' },
 { h: 'Choosing a chunk size', html:
   '<ul><li><strong>Too small</strong> — you pay the per-batch overhead (a round trip, a commit) too often.</li><li><strong>Too large</strong> — you are back to holding everything in memory, and a failure loses more work.</li><li><strong>Start around 1,000–10,000 rows</strong> for database writes, then measure.</li><li><strong>A failed chunk is the retry unit</strong>, so size it to what you are willing to redo.</li></ul>' }
],
call: '"I stream by default and chunk when the per-item overhead dominates — a database insert per row is a network round trip per row. Before any of that I project to the columns I need, because that is free. Reaching for Spark or a bigger box first is the answer that skips the three options that usually work."',
warn: 'A chunking loop that forgets the trailing partial batch silently drops up to chunk-size-minus-one rows. Ten rows through a size-four chunker becomes eight, the job succeeds, and nothing reports the loss. Reconcile counts across the boundary.',
qf: [
 ['Why chunk rather than stream row by row?', 'Per-item overhead — a round trip or commit per row is far slower than per batch.'],
 ['What is the classic chunking bug?', 'Forgetting to yield the final partial batch, silently dropping rows.'],
 ['How do you aggregate a file larger than memory?', 'Keep a running accumulator and stream — memory holds one row plus the totals.'],
 ['State the escalation ladder.', 'Fewer columns, stream, chunk, smaller types, better format, push to the database, distribute, bigger machine.'],
 ['What is the free first step?', 'Reading only the columns you need.'],
 ['How do you size a chunk?', 'Large enough to amortise overhead, small enough that a failed chunk is cheap to retry — start around 1k–10k rows and measure.']
]});

M.push({
code: 'F1', track: 'Level 3 · When things go wrong',
title: 'Exceptions: the two ways to get it wrong',
sub: 'Swallowing everything, and catching nothing. The first is worse.',
lede: 'Source systems go down, files arrive malformed, a schema changes overnight. The question is not whether your job hits an exception — it is what it does next. There are two failure modes, and the quiet one causes far more damage than the loud one.',
ex: [
 { t: 'The dangerous shape: silent data loss',
   code: "rows = [{\"id\": \"t1\", \"amount\": \"100\"},\n        {\"id\": \"t2\", \"amount\": \"oops\"},\n        {\"id\": \"t3\", \"amount\": \"250\"}]\n\nloaded = []\nfor r in rows:\n    try:\n        loaded.append({\"id\": r[\"id\"], \"amount\": float(r[\"amount\"])})\n    except:\n        pass\n\nprint(\"rows in: \", len(rows))\nprint(\"rows out:\", len(loaded))\nprint(\"job status: SUCCESS\")\nprint(\"nobody knows a row vanished\")",
   note: 'Three rows in, two out, exit code zero. The alert never fires because nothing failed. This is the shape that turns a crash into silent data loss, and it is worse than the crash because the crash would have been noticed.' },
 { t: 'The other extreme: no handling at all',
   code: "rows = [{\"id\": \"t1\", \"amount\": \"100\"},\n        {\"id\": \"t2\", \"amount\": \"oops\"}]\n\ntry:\n    loaded = [float(r[\"amount\"]) for r in rows]\nexcept ValueError as e:\n    print(\"job died on row 2:\", e)\n    print(\"rows 3..1,000,000 never processed\")",
   note: 'Loud, and at least honest — but one bad row out of a million stops everything, and the whole run has to start again. Neither extreme is right.' },
 { t: 'The right shape: specific, and counted',
   code: "rows = [{\"id\": \"t1\", \"amount\": \"100\"},\n        {\"id\": \"t2\", \"amount\": \"oops\"},\n        {\"id\": \"t3\", \"amount\": \"250\"},\n        {\"id\": \"t4\"}]\n\ngood, bad = [], []\nfor r in rows:\n    try:\n        good.append({\"id\": r[\"id\"], \"amount\": float(r[\"amount\"])})\n    except (ValueError, TypeError) as e:\n        bad.append({\"row\": r, \"reason\": str(e)})\n    except KeyError as e:\n        bad.append({\"row\": r, \"reason\": f\"missing field {e}\"})\n\nprint(f\"loaded {len(good)}, quarantined {len(bad)} of {len(rows)}\")\nfor b in bad:\n    print(\"  \", b[\"row\"].get(\"id\", \"?\"), \"->\", b[\"reason\"])\nprint(\"reject rate:\", f\"{len(bad)/len(rows):.0%}\")",
   note: 'Catch what you expect, name it, and keep the failures. The rejects are data, not noise — they go to a quarantine table and the reject rate becomes a metric you can alarm on. A job that quarantines 40% of rows should fail the run.' },
 { t: 'Custom exceptions carry business meaning',
   code: "class LoadError(Exception):\n    pass\n\nclass SchemaError(LoadError):\n    pass\n\nclass AmountError(LoadError):\n    pass\n\ndef parse(row):\n    if \"amount\" not in row:\n        raise SchemaError(f\"{row.get('id','?')}: no amount column\")\n    if float(row[\"amount\"]) < 0:\n        raise AmountError(f\"{row['id']}: negative amount\")\n    return float(row[\"amount\"])\n\nfor row in [{\"id\":\"t1\",\"amount\":\"10\"}, {\"id\":\"t2\"}, {\"id\":\"t3\",\"amount\":\"-5\"}]:\n    try:\n        print(\"ok:\", parse(row))\n    except SchemaError as e:\n        print(\"STOP THE RUN  ->\", e)\n    except LoadError as e:\n        print(\"quarantine row ->\", e)",
   note: 'A schema error means the contract broke and the whole run should stop; a bad amount means one row is wrong. Built-in exception types cannot express that difference — your own hierarchy can, and the caller decides per type.' },
 { t: 'finally always runs',
   code: "def load(fail):\n    conn = \"OPEN\"\n    try:\n        if fail:\n            raise ValueError(\"network dropped\")\n        return \"committed\"\n    finally:\n        conn = \"CLOSED\"\n        print(\"  cleanup ran, connection:\", conn)\n\nprint(\"happy path:\", load(False))\ntry:\n    load(True)\nexcept ValueError as e:\n    print(\"failed path:\", e)",
   note: 'The cleanup runs on both paths — return and exception. Without it, a job that dies halfway leaves the connection open, and enough of those exhaust the pool for everything else.' }
],
body: [
 { h: 'The rules', html:
   '<table><thead><tr><th>Do</th><th>Do not</th></tr></thead><tbody><tr><td>Catch specific exception types</td><td><code>except:</code> or <code>except Exception:</code> broadly</td></tr><tr><td>Log the row and the reason</td><td><code>pass</code> in the handler</td></tr><tr><td>Count rejects and alarm on the rate</td><td>Discard silently</td></tr><tr><td>Re-raise what you cannot handle</td><td>Convert every error into a warning</td></tr></tbody></table>' },
 { h: 'Which errors deserve which response', html:
   '<table><thead><tr><th>Error</th><th>Response</th></tr></thead><tbody><tr><td>One malformed row</td><td>Quarantine, continue, count it</td></tr><tr><td>Schema changed</td><td><b>Stop</b> — the contract broke</td></tr><tr><td>Source unavailable</td><td>Retry with backoff</td></tr><tr><td>Credentials rejected</td><td>Stop — retrying will not fix it</td></tr><tr><td>Reject rate above threshold</td><td>Stop — something upstream changed</td></tr></tbody></table><p>That last row is the one candidates miss. Quarantining is correct until it is happening to half the file, at which point continuing is the wrong call.</p>' }
],
call: '"A bare except that passes turns a crash into silent data loss — the job reports success and the rows are simply gone. I catch specific types, quarantine bad rows with a reason, and alarm on the reject rate, because quarantining is right for one bad row and wrong for half the file."',
warn: '`except: pass` is the most damaging two words in a data pipeline. The exit code is zero, no alert fires, and the missing rows are discovered weeks later by someone reconciling a total.',
qf: [
 ['What is wrong with `except: pass`?', 'It converts a crash into silent data loss — the job reports success with rows missing.'],
 ['What should a handler do with a bad row?', 'Quarantine it with a reason, count it, and continue.'],
 ['When should a bad row stop the whole run?', 'When the reject rate crosses a threshold, or when the schema itself changed.'],
 ['Why define custom exceptions?', 'Built-in types cannot express business meaning; a hierarchy lets the caller respond differently per type.'],
 ['What does finally guarantee?', 'The block runs whether the try succeeded, returned or raised.'],
 ['Which errors are worth retrying?', 'Transient ones — a source being unavailable. Never a schema mismatch or a rejected credential.']
]});

M.push({
code: 'F2', track: 'Level 3 · When things go wrong',
title: 'Context managers and decorators',
sub: 'Two ways to wrap behaviour around code — cleanup, and retry with backoff.',
lede: 'Writing <code>try/finally</code> everywhere is noisy, and so is copying a retry loop into every function that calls a flaky source. A context manager packages the first; a decorator packages the second. Both are ordinary Python once you see that a decorator is just a function that takes a function and returns a function.',
ex: [
 { t: 'A context manager, built from scratch',
   code: "class ManagedConnection:\n    def __init__(self, name):\n        self.name = name\n    def __enter__(self):\n        print(f\"  open {self.name}\")\n        return self\n    def __exit__(self, exc_type, exc, tb):\n        print(f\"  close {self.name}\")\n        return False\n\nwith ManagedConnection(\"warehouse\") as conn:\n    print(\"  running load\")\n\nprint(\"---\")\ntry:\n    with ManagedConnection(\"warehouse\") as conn:\n        raise ValueError(\"load failed midway\")\nexcept ValueError as e:\n    print(\"caught outside:\", e)",
   note: '__exit__ runs on both paths. Returning False lets the exception propagate — returning True would swallow it, which is the context-manager version of `except: pass`. The connection closes either way.' },
 { t: 'A decorator is a function returning a function',
   code: "def logged(fn):\n    def wrapper(*args, **kwargs):\n        print(f\"  -> {fn.__name__}{args}\")\n        result = fn(*args, **kwargs)\n        print(f\"  <- returned {result}\")\n        return result\n    return wrapper\n\n@logged\ndef load(n):\n    return n * 2\n\nprint(\"result:\", load(21))",
   note: 'The @ is shorthand for `load = logged(load)`. Nothing magic happens — `logged` receives the original function and returns a replacement that calls it. Once that clicks, every decorator becomes readable.' },
 { t: 'Retry with exponential backoff and jitter',
   code: "def retry(attempts=4, base=1.0):\n    def decorate(fn):\n        def wrapper(*args):\n            delay = base\n            for attempt in range(1, attempts + 1):\n                try:\n                    return fn(*args)\n                except ConnectionError as e:\n                    if attempt == attempts:\n                        print(f\"  attempt {attempt}: giving up\")\n                        raise\n                    jitter = (attempt * 7 % 5) / 10.0\n                    print(f\"  attempt {attempt} failed ({e}); wait {delay + jitter:.1f}s\")\n                    delay = delay * 2\n        return wrapper\n    return decorate\n\nclass ConnectionError(Exception):\n    pass\n\ncalls = {\"n\": 0}\n\n@retry(attempts=4)\ndef fetch():\n    calls[\"n\"] += 1\n    if calls[\"n\"] < 3:\n        raise ConnectionError(\"source timeout\")\n    return {\"rows\": 120}\n\nprint(\"result:\", fetch())\nprint(\"total attempts:\", calls[\"n\"])",
   note: 'Delay doubles each attempt, and jitter breaks the synchronisation. Retrying immediately hammers a struggling source; retrying on the same schedule from fifty workers means they all hit it at the same instant and knock it over again.' },
 { t: 'Do not retry what will never succeed',
   code: "class TransientError(Exception):\n    pass\n\nclass SchemaError(Exception):\n    pass\n\nclass AuthError(Exception):\n    pass\n\nRETRYABLE = (TransientError,)\n\ndef verdict(exc):\n    return \"retry\" if isinstance(exc, RETRYABLE) else \"fail fast\"\n\nfailures = [\n    TransientError(\"source timeout\"),\n    SchemaError(\"column renamed upstream\"),\n    AuthError(\"403 forbidden\"),\n]\n\nfor exc in failures:\n    name = type(exc).__name__\n    print(f\"{name:16} {str(exc):26} -> {verdict(exc)}\")",
   note: 'Retrying a schema mismatch or a rejected credential wastes four attempts and delays the alert by minutes. The follow-up question in an interview is always "which failures do you retry?" — transient ones only.' }
],
body: [
 { h: 'The context manager protocol', html:
   '<div class="pre code">class Managed:\n    def __enter__(self):        <i>acquire; the return value is bound by `as`</i>\n        return resource\n    def __exit__(self, t, v, tb): <i>release; runs on success AND on exception</i>\n        return False              <u>False lets the exception propagate</u></div><p><code>contextlib.contextmanager</code> lets you write the same thing as a generator with a <code>yield</code> in the middle — everything before the yield is <code>__enter__</code>, everything after is <code>__exit__</code>.</p>' },
 { h: 'Backoff, and why jitter matters', html:
   '<div class="pre">attempt 1  wait 1s\nattempt 2  wait 2s\nattempt 3  wait 4s      <i>exponential: give the source room to recover</i>\n\n+ jitter   wait 4s ± random   <i>so fifty workers do not retry in unison</i></div><p>Without jitter, every client computes the same delay and retries at the same instant — you have synchronised the load rather than spread it, and a brief outage becomes a sustained one. This is the identical argument as the AWS bench’s backoff module.</p>' },
 { h: 'Where each belongs', html:
   '<ul><li><strong>Context manager</strong> — anything acquired and released: connections, files, locks, temporary state, timers.</li><li><strong>Decorator</strong> — anything wrapped around many functions: retry, timing, logging, caching, auth.</li><li><strong>Neither</strong> — if it applies to exactly one call site, just write the try/finally there.</li></ul>' }
],
call: '"A decorator is just a function that takes a function and returns a replacement, which is why retry-with-backoff belongs there rather than copied into every caller. And jitter matters as much as the backoff — fifty workers retrying on the same schedule synchronise the load and finish off a source that was recovering."',
warn: 'Retrying a schema mismatch or a rejected credential is pure delay — the operation cannot succeed, so four attempts with backoff just postpone the alert by minutes. Decide per exception type whether a retry could ever help.',
qf: [
 ['What two methods does a context manager need?', '__enter__ and __exit__.'],
 ['What does returning True from __exit__ do?', 'Swallows the exception — usually wrong, and the same mistake as `except: pass`.'],
 ['What is a decorator, mechanically?', 'A function that takes a function and returns a replacement function.'],
 ['What is `@deco` shorthand for?', 'f = deco(f).'],
 ['Why exponential backoff?', 'It gives a struggling source progressively more room to recover.'],
 ['Why jitter?', 'Without it every client retries at the same instant, synchronising load instead of spreading it.'],
 ['Which exceptions should you retry?', 'Transient ones only — never schema mismatches or auth failures.']
]});

M.push({
code: 'I1', track: 'Level 4 · Safe to re-run',
title: 'Idempotency: running twice must equal running once',
sub: 'The most important property in this bench. Retries are not optional, so this is not either.',
lede: 'Everything so far assumed a single run. Jobs are retried automatically by the orchestrator, replayed for backfills, and re-run by an engineer at 2 AM who is not sure whether the first attempt got through. A load is <em class="hl">idempotent</em> when running it twice leaves the target identical to running it once. If it is not, every one of those situations corrupts the data.',
ex: [
 { t: 'The load that looks reasonable',
   code: "target = []\n\ndef load_append(rows):\n    for r in rows:\n        target.append(r)\n\nbatch = [{\"id\": \"t1\", \"amount\": 100.0}, {\"id\": \"t2\", \"amount\": 250.0}]\n\nload_append(batch)\nprint(\"after run 1:\", len(target), \"rows, total\", sum(r[\"amount\"] for r in target))\n\nload_append(batch)\nprint(\"after run 2:\", len(target), \"rows, total\", sum(r[\"amount\"] for r in target))\nprint(\"revenue double-counted:\", sum(r['amount'] for r in target) == 700.0)",
   note: 'Append is the natural way to write a load and it is not idempotent. The retry the orchestrator did for you at 3 AM doubled the numbers, and nothing failed — the second run succeeded perfectly.' },
 { t: 'Fix 1: overwrite the partition this run owns',
   code: "target = {}\n\ndef load_partition(dt, rows):\n    target[dt] = list(rows)\n\nbatch = [{\"id\": \"t1\", \"amount\": 100.0}, {\"id\": \"t2\", \"amount\": 250.0}]\n\nload_partition(\"2026-02-01\", batch)\nprint(\"run 1:\", len(target[\"2026-02-01\"]), \"rows\")\nload_partition(\"2026-02-01\", batch)\nprint(\"run 2:\", len(target[\"2026-02-01\"]), \"rows\")\n\nload_partition(\"2026-02-02\", [{\"id\": \"t3\", \"amount\": 40.0}])\nprint(\"other partition untouched:\", sorted(target.keys()))",
   note: 'The run owns a partition and replaces it wholesale. Re-running replaces rather than adds, so it is naturally idempotent, and a backfill of one day cannot touch any other day. This is the default for daily fact loads.' },
 { t: 'Fix 2: merge on a business key',
   code: "target = {}\n\ndef merge(rows):\n    for r in rows:\n        target[r[\"id\"]] = r\n\nmerge([{\"id\": \"t1\", \"amount\": 100.0}, {\"id\": \"t2\", \"amount\": 250.0}])\nprint(\"run 1:\", len(target))\n\nmerge([{\"id\": \"t1\", \"amount\": 100.0}, {\"id\": \"t2\", \"amount\": 250.0}])\nprint(\"run 2:\", len(target), \"(unchanged)\")\n\nmerge([{\"id\": \"t2\", \"amount\": 999.0}])\nprint(\"corrected t2:\", target[\"t2\"][\"amount\"])\nprint(\"total rows:\", len(target))",
   note: 'Keyed upsert. Re-running is a no-op and a correction overwrites in place. This is what MERGE does in a warehouse, and it needs a key you actually trust — which is the whole difficulty.' },
 { t: 'Fix 3: deduplicate on read',
   code: "raw = []\n\ndef append_only(rows, run_id):\n    for r in rows:\n        raw.append(dict(r, _run=run_id))\n\nbatch = [{\"id\": \"t1\", \"amount\": 100.0}, {\"id\": \"t2\", \"amount\": 250.0}]\nappend_only(batch, \"run-1\")\nappend_only(batch, \"run-2\")\n\nprint(\"raw rows:\", len(raw))\n\nlatest = {}\nfor r in raw:\n    latest[r[\"id\"]] = r\n\nprint(\"deduplicated:\", len(latest))\nprint(\"total:\", sum(r[\"amount\"] for r in latest.values()))",
   note: 'Write fast and deduplicate at read time, keeping the latest per key. Right when write latency matters, and it moves the cost to every reader — so the view that deduplicates has to be the only way anyone queries the table.' },
 { t: 'The at-2-AM question, answered by code',
   code: "def run_twice(load, name):\n    target = {}\n    load(target, [{\"id\": \"t1\", \"amount\": 100.0}])\n    first = dict(target)\n    load(target, [{\"id\": \"t1\", \"amount\": 100.0}])\n    same = target == first\n    print(f\"{name:12} idempotent: {same}\")\n    return same\n\ndef appender(target, rows):\n    for r in rows:\n        target[len(target)] = r\n\ndef merger(target, rows):\n    for r in rows:\n        target[r[\"id\"]] = r\n\nrun_twice(appender, \"append\")\nrun_twice(merger, \"merge\")",
   note: 'The idempotency test, in five lines: run the load twice and assert the target is unchanged. If your load claims to be idempotent, that claim should be executable — and this is the test almost nobody writes.' }
],
body: [
 { h: 'The three strategies', html:
   '<table><thead><tr><th>Strategy</th><th>How</th><th>Right for</th></tr></thead><tbody><tr><td><b>Overwrite partition</b></td><td>The run owns a partition and replaces it</td><td><b>Daily facts — the usual default</b></td></tr><tr><td><b>Merge on key</b></td><td>Upsert keyed on a business key</td><td>Mutable dimensions, CDC targets</td></tr><tr><td><b>Append + dedupe on read</b></td><td>Write everything, deduplicate in a view</td><td>High-throughput streams</td></tr></tbody></table><p>All three assume you can identify a row. If the source gives you no key and no stable ordering, that is the problem to solve first — no amount of load logic fixes an unidentifiable row.</p>' },
 { h: 'Restartability is not the same thing', html:
   '<p><strong>Idempotent</strong> means re-running the whole job is safe. <strong>Restartable</strong> means a failed job can resume rather than starting from zero. A five-hour job that must restart from the beginning after failing at hour four is idempotent and still operationally painful.</p><p>Restartability comes from checkpointing progress — recording which partitions or chunks completed, and skipping them on the next attempt. It only works if each unit is itself idempotent, which is why this comes second.</p>' },
 { h: 'Poison records', html:
   '<p>A single row that always fails will retry forever and block the queue behind it. The pattern is a retry counter and a dead-letter destination: after N attempts, move the row aside, record why, and continue. Then alarm on the dead-letter rate — one poison record is a data issue, a thousand is an upstream change.</p>' }
],
call: '"Idempotent means running twice leaves the target identical to running once, and since the orchestrator retries automatically that is not optional. For daily facts I overwrite the partition the run owns; for mutable dimensions I merge on a business key. And I write the test that runs the load twice and asserts the table is unchanged — if the claim is real it should be executable."',
warn: 'Append is the natural way to write a load and it is never idempotent. The automatic retry that the orchestrator performed at 3 AM doubled the numbers, both runs reported success, and the discrepancy is found by whoever reconciles the month-end total.',
qf: [
 ['Define idempotent.', 'Running the load twice leaves the target identical to running it once.'],
 ['Why does it matter more than it sounds?', 'Orchestrators retry automatically, backfills replay, and engineers re-run after ambiguous failures.'],
 ['Name the three strategies.', 'Overwrite the partition the run owns, merge on a business key, or append and deduplicate on read.'],
 ['Which is the usual default for daily facts?', 'Overwrite the partition — simplest and naturally idempotent.'],
 ['Idempotent versus restartable?', 'Idempotent means re-running is safe; restartable means a failed run resumes instead of starting over.'],
 ['What is a poison record?', 'A row that always fails, retrying forever and blocking the queue — send it to a dead-letter store after N attempts.'],
 ['How do you prove a load is idempotent?', 'Run it twice in a test and assert the target is unchanged.']
]});

M.push({
code: 'P1', track: 'Level 5 · Code a team can own', theory: true,
title: 'Project layout, logging and configuration',
sub: 'The three things that make a script into something a team can operate.',
lede: 'A notebook that works is not a system. What separates them is boring: a layout where the transform is separable from the I/O, logging that a machine can parse, and configuration that does not embed a password in a repository.',
ex: [
 { t: 'The layout that makes testing possible', ref:true,
   code: "project/\n  src/pipeline/\n    __init__.py\n    config.py        # settings, read from environment\n    extract.py       # I/O at the edge\n    transform.py     # PURE functions — the tested part\n    load.py          # I/O at the edge\n    cli.py           # entry point, argument parsing\n  tests/\n    test_transform.py\n  pyproject.toml\n  README.md",
   note: 'The load-bearing line is that `transform.py` contains pure functions taking and returning data. That is what lets tests run in a second with no database, no network and no cluster — the same structural argument as the PySpark bench.' },
 { t: 'Logging, not print', ref:true,
   code: "import logging\nlogger = logging.getLogger(__name__)\n\nlogger.info(\"load.start\", extra={\"run_id\": run_id, \"partition\": dt})\nlogger.warning(\"row.quarantined\", extra={\"txn_id\": r[\"id\"], \"reason\": str(e)})\nlogger.error(\"load.failed\", exc_info=True)\n\n# print()  -> stdout, no level, no timestamp, no context, cannot be filtered\n# logger   -> level, timestamp, module, and structured fields a parser can index",
   note: 'print goes to stdout with no level and no context, so it cannot be filtered, routed or alarmed on. A logger gives you severity and structured fields — and in a bank, the log is the audit trail.' },
 { t: 'Configuration and secrets', ref:true,
   code: "import os\n\nDB_HOST = os.environ[\"DB_HOST\"]                  # required: fail fast if absent\nBATCH   = int(os.environ.get(\"BATCH_SIZE\", 1000))  # optional, with a default\n\n# NEVER\n# DB_PASSWORD = \"hunter2\"                        # in the repo, forever, in git history\n\n# Secrets come from the environment, injected by AWS Secrets Manager,\n# Vault, or the orchestrator - never from a file you commit.",
   note: '`os.environ["X"]` raises immediately when the variable is missing, which is what you want — a job that starts with half its configuration and fails an hour later is worse than one that refuses to start. A committed secret is in git history forever, even after you delete it.' }
],
body: [
 { h: 'Why the layout matters', html:
   '<table><thead><tr><th>Layer</th><th>Contains</th><th>Tested how</th></tr></thead><tbody><tr><td>extract / load</td><td>I/O — database, S3, API</td><td>Integration tests, or mocked</td></tr><tr><td><b>transform</b></td><td><b>Pure functions</b></td><td><b>Unit tests, no infrastructure</b></td></tr><tr><td>cli</td><td>Argument parsing, wiring</td><td>Smoke test</td></tr></tbody></table><p>If the transform reads from the database itself, none of it can be tested without one. That single coupling is what makes most pipelines untestable.</p>' },
 { h: 'Log levels, used correctly', html:
   '<div class="pre">DEBUG     developer detail, off in production\nINFO      lifecycle: started, finished, N rows loaded\nWARNING   recovered from something — a quarantined row\nERROR     the operation failed and a human should look\nCRITICAL  the service is down</div><p>Log the <em class="hl">run id</em> on every line. When something breaks at 2 AM the first thing you do is filter by run id, and if the lines do not carry it you are reading the whole file.</p>' },
 { h: 'Dependencies', html:
